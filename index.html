<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DartPro - Team & Kasse</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a28;--bg4:#222236;
  --accent:#00e5ff;--accent2:#ff3d71;--accent3:#ffaa00;--green:#00e676;--red:#ff1744;
  --text:#e8e8f0;--text2:#9898b0;--text3:#5a5a78;
  --radius:8px;--radius2:12px;
}
html{font-size:15px}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1,h2,h3,h4{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em}
button{font-family:'Barlow',sans-serif;cursor:pointer;border:none;outline:none;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
input,select{font-family:'Barlow',sans-serif;outline:none}
.app{max-width:1400px;margin:0 auto;padding:20px}
.screen{display:none}
.screen.active{display:block}

.header{text-align:center;padding:30px 0 20px;position:relative}
.header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.logo{font-family:'Oswald',sans-serif;font-size:2.8rem;font-weight:700;letter-spacing:.08em;background:linear-gradient(135deg,var(--accent),#7c4dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo span{font-weight:300;font-size:1.4rem;display:block;letter-spacing:.2em;-webkit-text-fill-color:var(--text2);margin-top:2px}

.card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius2);padding:24px;margin-bottom:16px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.card-title{font-size:1.1rem;color:var(--accent);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title .icon{width:28px;height:28px;background:var(--bg3);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1rem}

.form-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;align-items:end}
.form-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
input,select{background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px 12px;border-radius:6px;font-size:.95rem;width:100%}
input:focus,select:focus{border-color:var(--accent)}

.btn{padding:10px 20px;border-radius:6px;font-size:.95rem;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#0099cc);color:#000}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:var(--bg3);color:var(--text);border:1px solid var(--bg4)}
.btn-ghost:hover{background:var(--bg4)}
.btn-success{background:var(--green);color:#000}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:6px 12px;font-size:.8rem}

.member-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:16px;text-align:center}
.stat-card.highlight{border-color:var(--accent);box-shadow:0 0 20px rgba(0,229,255,.15)}
.stat-label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.stat-value{font-family:'Oswald';font-size:1.8rem;font-weight:600;color:var(--accent)}

.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--bg4);padding-bottom:4px}
.tab{padding:10px 20px;background:transparent;color:var(--text2);border:none;border-bottom:2px solid transparent;margin-bottom:-6px;transition:all .2s;font-size:.9rem}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.edit-btn{background:transparent;border:1px solid var(--bg4);color:var(--text2);padding:4px 8px;border-radius:4px;font-size:.85rem;cursor:pointer}
.edit-btn:hover{background:var(--bg3);color:var(--accent);border-color:var(--accent)}

@media(max-width:768px){
  .form-row{flex-direction:column}
  .form-group{min-width:100%}
}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">DARTPRO<span>Team & Kasse</span></div>
  </div>

  <div id="screen-members" class="screen active">
    <!-- Wird durch JavaScript gefüllt -->
  </div>
</div>

<script>
const STATE = {
  members: [],
  otherIncome: [],
  otherExpenses: [],
  nextMemberId: 1,
  nextIncomeId: 1,
  nextExpenseId: 1,
  felgeCost: 0.50,
  monthlyFee: 5.00,
};

const STORAGE_KEY = 'dartpro_team_data';

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
  } catch (e) {
    console.warn('Save failed:', e);
  }
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      Object.assign(STATE, data);
      return true;
    }
  } catch (e) {
    console.warn('Load failed:', e);
  }
  return false;
}

function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function formatDate(dateStr) {
  if (!dateStr) return '-';
  const d = new Date(dateStr);
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

// === MEMBERS ===
let currentMemberTab = 'tab-kader';

window.openSettings = function() {
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px';
  modal.innerHTML = `
    <div style="background:var(--bg2);border:2px solid var(--accent);border-radius:var(--radius);padding:24px;max-width:450px;width:100%">
      <h3 style="font-family:'Oswald';color:var(--accent);margin-bottom:20px;font-size:1.3rem">Einstellungen</h3>
      <div style="margin-bottom:16px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Felgen-Preis pro Stück (€)</label>
        <input type="number" id="settings-felge-cost" value="${STATE.felgeCost.toFixed(2)}" step="0.01" min="0" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px;font-size:1rem">
      </div>
      <div style="margin-bottom:20px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Monatsbeitrag pro Mitglied (€)</label>
        <input type="number" id="settings-monthly-fee" value="${STATE.monthlyFee.toFixed(2)}" step="0.01" min="0" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px;font-size:1rem">
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="this.closest('div[style*=fixed]').remove()">Abbrechen</button>
        <button class="btn btn-primary" onclick="saveSettings()">Speichern</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

window.saveSettings = function() {
  const newFelgeCost = parseFloat(document.getElementById('settings-felge-cost').value);
  const newMonthlyFee = parseFloat(document.getElementById('settings-monthly-fee').value);
  
  if (!isNaN(newFelgeCost) && newFelgeCost >= 0) STATE.felgeCost = newFelgeCost;
  if (!isNaN(newMonthlyFee) && newMonthlyFee >= 0) STATE.monthlyFee = newMonthlyFee;
  
  document.querySelector('div[style*="position:fixed"][style*="z-index:10000"]').remove();
  saveState();
  renderMembers();
}

function renderMembersList() {
  const FELGE_COST = STATE.felgeCost;
  const MONTHLY_FEE = STATE.monthlyFee;
  const months = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  
  let html = '<div style="display:grid;gap:12px">';
  
  STATE.members.forEach(m => {
    const penaltyTotal = (m.penalties || []).reduce((s, p) => s + p.amount, 0);
    const paidMonthsCount = (m.paidMonths || []).length;
    
    let monthButtons = months.map((month, idx) => {
      const isPaid = (m.paidMonths || []).includes(idx);
      return `<button class="btn btn-sm" style="min-width:48px;padding:4px 8px;font-size:.75rem;${isPaid ? 'background:var(--green);color:#000' : 'background:var(--bg);color:var(--text2);border:1px solid var(--bg4)'}" onclick="togglePaidMonth(${m.id}, ${idx})">${month}</button>`;
    }).join('');
    
    let penaltiesHtml = '';
    if ((m.penalties || []).length > 0) {
      penaltiesHtml = `<div style="display:grid;gap:4px;margin-bottom:8px">`;
      (m.penalties || []).forEach((p, idx) => {
        penaltiesHtml += `
          <div style="background:var(--bg);padding:8px;border-radius:4px;display:flex;justify-content:space-between;align-items:center;font-size:.82rem">
            <span>${esc(p.type)} - ${formatDate(p.date)}</span>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="color:var(--accent2);font-weight:600">${p.amount.toFixed(2)} €</span>
              <button class="edit-btn" style="color:var(--red);padding:2px 6px;font-size:.75rem" onclick="deletePenalty(${m.id}, ${idx})">&#128465;</button>
            </div>
          </div>
        `;
      });
      penaltiesHtml += `</div>`;
    } else {
      penaltiesHtml = '<div style="font-size:.82rem;color:var(--text3);margin-bottom:8px">Keine Strafen</div>';
    }
    
    html += `
    <div style="background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px">
        <div>
          <div style="font-family:'Oswald';font-size:1.2rem;font-weight:600">${esc(m.name)}</div>
          <div style="font-size:.82rem;color:var(--text2);margin-top:4px">
            ${m.birthday ? 'Geburtstag: ' + formatDate(m.birthday) : ''} 
            ${m.jerseySize ? '| Trikot: ' + m.jerseySize : ''}
            | Felgen: <span style="color:var(--accent2)">${m.felgeCount || 0}</span> (${((m.felgeCount || 0) * FELGE_COST).toFixed(2)} €)
          </div>
        </div>
        <div style="display:flex;gap:4px">
          <button class="edit-btn" onclick="editMember(${m.id})">&#9998;</button>
          <button class="edit-btn" style="color:var(--red)" onclick="deleteMember(${m.id})">&#128465;</button>
        </div>
      </div>
      <div style="margin-bottom:12px">
        <div style="font-size:.75rem;color:var(--text2);margin-bottom:6px">Monatsbeiträge (${paidMonthsCount}/${MONTHLY_FEE.toFixed(2)} € pro Monat):</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">${monthButtons}</div>
        <div style="font-size:.82rem;color:var(--green);margin-top:6px;font-weight:600">Gesamt: ${(paidMonthsCount * MONTHLY_FEE).toFixed(2)} €</div>
      </div>
      <div>
        <div style="font-size:.75rem;color:var(--text2);margin-bottom:6px">Strafen: <span style="color:var(--accent2);font-weight:600">${(m.penalties || []).length}</span> (${penaltyTotal.toFixed(2)} €)</div>
        ${penaltiesHtml}
        <button class="edit-btn btn-sm" onclick="addPenalty(${m.id})">+ Strafe hinzufügen</button>
      </div>
    </div>
    `;
  });
  
  html += '</div>';
  return html;
}

function renderBirthdaysView() {
  if (STATE.members.length === 0) {
    return '<div class="card"><p style="color:var(--text3);text-align:center;padding:40px">Noch keine Mitglieder vorhanden</p></div>';
  }
  
  const membersWithBirthdays = STATE.members.filter(m => m.birthday).map(m => {
    const birthDate = new Date(m.birthday);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const nextBirthday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
    if (nextBirthday < today) nextBirthday.setFullYear(nextBirthday.getFullYear() + 1);
    const diffTime = nextBirthday - today;
    const daysUntil = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    return { ...m, daysUntilBirthday: daysUntil, nextBirthday };
  });
  
  if (membersWithBirthdays.length === 0) {
    return '<div class="card"><p style="color:var(--text3);text-align:center;padding:40px">Keine Geburtstage eingetragen</p></div>';
  }
  
  membersWithBirthdays.sort((a, b) => a.daysUntilBirthday - b.daysUntilBirthday);
  
  let html = '<div class="card"><div class="card-title"><div class="icon">&#127874;</div> Geburtstage</div>';
  
  membersWithBirthdays.forEach((m, idx) => {
    const isToday = m.daysUntilBirthday === 0;
    const isNextWeek = m.daysUntilBirthday <= 7;
    const birthDate = new Date(m.birthday);
    const age = new Date().getFullYear() - birthDate.getFullYear();
    
    let badgeColor = 'var(--red)';
    let badgeBg = 'rgba(255,23,68,.15)';
    let badgeText = `in ${m.daysUntilBirthday} Tagen`;
    
    if (isToday) {
      badgeColor = 'var(--green)';
      badgeBg = 'rgba(0,230,118,.2)';
      badgeText = '&#127881; HEUTE!';
    } else if (isNextWeek) {
      badgeColor = 'var(--accent3)';
      badgeBg = 'rgba(255,170,0,.15)';
      badgeText = `in ${m.daysUntilBirthday} ${m.daysUntilBirthday === 1 ? 'Tag' : 'Tagen'}`;
    }
    
    html += `
      <div style="background:var(--bg3);border:${isToday ? '2px' : '1px'} solid ${isToday ? 'var(--green)' : (isNextWeek ? 'var(--accent3)' : 'var(--bg4)')};border-radius:var(--radius);padding:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;${idx === 0 && !isToday ? 'border-color:var(--red);border-width:2px;background:rgba(255,23,68,.05)' : ''}">
        <div style="display:flex;align-items:center;gap:16px">
          ${idx === 0 && !isToday ? '<div style="font-size:1.5rem">&#128293;</div>' : ''}
          <div>
            <div style="font-family:'Oswald';font-size:1.2rem;font-weight:600;${idx === 0 ? 'color:var(--red)' : ''}">${esc(m.name)}</div>
            <div style="font-size:.85rem;color:var(--text2);margin-top:4px">${formatDate(m.birthday)} ${!isNaN(age) ? `(${age} Jahre)` : ''}</div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-family:'Oswald';font-size:1.6rem;font-weight:700;color:${badgeColor};padding:4px 12px;background:${badgeBg};border-radius:var(--radius)">${badgeText}</div>
        </div>
      </div>
    `;
  });
  
  html += '</div>';
  return html;
}

function renderMembers() {
  const el = document.getElementById('screen-members');
  const FELGE_COST = STATE.felgeCost;
  const MONTHLY_FEE = STATE.monthlyFee;
  
  const totalFelgeMoney = STATE.members.reduce((sum, m) => sum + (m.felgeCount || 0) * FELGE_COST, 0);
  const totalMonthlyFees = STATE.members.reduce((sum, m) => sum + (m.paidMonths || []).length * MONTHLY_FEE, 0);
  const totalPenalties = STATE.members.reduce((sum, m) => sum + (m.penalties || []).reduce((s, p) => s + p.amount, 0), 0);
  const totalOtherIncome = STATE.otherIncome.reduce((sum, i) => sum + i.amount, 0);
  const totalOtherExpenses = STATE.otherExpenses.reduce((sum, e) => sum + e.amount, 0);
  const totalCash = totalFelgeMoney + totalMonthlyFees + totalPenalties + totalOtherIncome - totalOtherExpenses;
  
  let membersHtml = STATE.members.length === 0 ? 
    '<p style="color:var(--text3);text-align:center;padding:40px;font-size:.9rem">Noch keine Mitglieder hinzugefügt</p>' :
    renderMembersList();
  
  let incomeHtml = STATE.otherIncome.length === 0 ?
    '<p style="color:var(--text3);text-align:center;padding:20px;font-size:.85rem">Keine sonstigen Einnahmen</p>' :
    `<table style="width:100%;border-collapse:collapse;margin-top:12px">
      <thead><tr style="background:var(--bg3)"><th style="padding:10px;text-align:left;font-size:.75rem;color:var(--text2)">Beschreibung</th><th style="padding:10px;text-align:left;font-size:.75rem;color:var(--text2)">Betrag</th><th style="padding:10px;text-align:left;font-size:.75rem;color:var(--text2)">Datum</th><th></th></tr></thead>
      <tbody>
        ${STATE.otherIncome.map(i => `
          <tr style="border-bottom:1px solid var(--bg4)">
            <td style="padding:12px">${esc(i.description)}</td>
            <td style="padding:12px;color:var(--green);font-weight:600">+${i.amount.toFixed(2)} €</td>
            <td style="padding:12px">${formatDate(i.date)}</td>
            <td style="padding:12px;text-align:right"><button class="edit-btn" style="color:var(--red)" onclick="deleteIncome(${i.id})">&#128465;</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
  
  let expensesHtml = STATE.otherExpenses.length === 0 ?
    '<p style="color:var(--text3);text-align:center;padding:20px;font-size:.85rem">Keine Ausgaben erfasst</p>' :
    `<table style="width:100%;border-collapse:collapse;margin-top:12px">
      <thead><tr style="background:var(--bg3)"><th style="padding:10px;text-align:left;font-size:.75rem;color:var(--text2)">Beschreibung</th><th style="padding:10px;text-align:left;font-size:.75rem;color:var(--text2)">Betrag</th><th style="padding:10px;text-align:left;font-size:.75rem;color:var(--text2)">Datum</th><th></th></tr></thead>
      <tbody>
        ${STATE.otherExpenses.map(e => `
          <tr style="border-bottom:1px solid var(--bg4)">
            <td style="padding:12px">${esc(e.description)}</td>
            <td style="padding:12px;color:var(--red);font-weight:600">-${e.amount.toFixed(2)} €</td>
            <td style="padding:12px">${formatDate(e.date)}</td>
            <td style="padding:12px;text-align:right"><button class="edit-btn" style="color:var(--red)" onclick="deleteExpense(${e.id})">&#128465;</button></td>
          </tr>
        `).join('')}
      </tbody>
    </table>`;
  
  el.innerHTML = `
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h2 style="font-size:1.8rem">&#128101; Team & Kasse</h2>
      <button class="btn btn-ghost" style="padding:12px 18px;font-size:1rem;display:flex;align-items:center;gap:8px" onclick="openSettings()">
        <span style="font-size:1.4rem">&#9881;</span>
      </button>
    </div>
    
    <div class="member-stats">
      <div class="stat-card"><div class="stat-label">Mitglieder</div><div class="stat-value">${STATE.members.length}</div></div>
      <div class="stat-card"><div class="stat-label">Felgengeld</div><div class="stat-value">${totalFelgeMoney.toFixed(2)} €</div><div style="font-size:.75rem;color:var(--text3);margin-top:4px">${STATE.members.reduce((sum, m) => sum + (m.felgeCount || 0), 0)} Felgen × ${FELGE_COST.toFixed(2)} €</div></div>
      <div class="stat-card"><div class="stat-label">Monatsbeiträge</div><div class="stat-value">${totalMonthlyFees.toFixed(2)} €</div><div style="font-size:.75rem;color:var(--text3);margin-top:4px">${STATE.members.reduce((sum, m) => sum + (m.paidMonths || []).length, 0)} × ${MONTHLY_FEE.toFixed(2)} €</div></div>
      <div class="stat-card"><div class="stat-label">Strafen</div><div class="stat-value">${totalPenalties.toFixed(2)} €</div></div>
      <div class="stat-card"><div class="stat-label">Sonstige Einnahmen</div><div class="stat-value">${totalOtherIncome.toFixed(2)} €</div></div>
      <div class="stat-card"><div class="stat-label">Ausgaben</div><div class="stat-value" style="color:var(--red)">${totalOtherExpenses.toFixed(2)} €</div></div>
      <div class="stat-card highlight"><div class="stat-label">Gesamtkasse</div><div class="stat-value">${totalCash.toFixed(2)} €</div></div>
    </div>
    
    <div class="tabs">
      <button class="tab ${currentMemberTab === 'tab-kader' ? 'active' : ''}" onclick="switchMemberTab('tab-kader')">Kader</button>
      <button class="tab ${currentMemberTab === 'tab-birthdays' ? 'active' : ''}" onclick="switchMemberTab('tab-birthdays')">&#127874; Geburtstage</button>
    </div>
    
    <div id="tab-kader" style="display:${currentMemberTab === 'tab-kader' ? '' : 'none'}">
      <div class="card">
        <div class="card-title"><div class="icon">&#128100;</div> Mitglied hinzufügen</div>
        <div class="form-row">
          <div class="form-group" style="flex:2"><label>Name</label><input type="text" id="member-name" placeholder="Vollständiger Name"></div>
          <div class="form-group"><label>Geburtstag</label><input type="date" id="member-birthday"></div>
          <div class="form-group"><label>Trikotgröße</label><select id="member-jersey"><option value="">-</option><option value="XS">XS</option><option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option><option value="XXXL">XXXL</option></select></div>
          <div class="form-group"><label>Felgen</label><input type="number" id="member-felge" value="0" min="0" step="1"></div>
          <div class="form-group" style="flex:0;min-width:auto"><label>&nbsp;</label><button class="btn btn-primary" onclick="addMember()">+ Hinzufügen</button></div>
        </div>
      </div>
      <div class="card"><div class="card-title"><div class="icon">&#128101;</div> Mitgliederliste</div>${membersHtml}</div>
      <div class="card">
        <div class="card-title"><div class="icon">&#128176;</div> Sonstige Einnahmen</div>
        <div class="form-row">
          <div class="form-group" style="flex:2"><label>Beschreibung</label><input type="text" id="income-desc" placeholder="z.B. Spende, Verkauf, etc."></div>
          <div class="form-group"><label>Betrag (€)</label><input type="number" id="income-amount" placeholder="0.00" min="0" step="0.01"></div>
          <div class="form-group"><label>Datum</label><input type="date" id="income-date"></div>
          <div class="form-group" style="flex:0;min-width:auto"><label>&nbsp;</label><button class="btn btn-success" onclick="addIncome()">+ Einnahme</button></div>
        </div>
        ${incomeHtml}
      </div>
      <div class="card">
        <div class="card-title"><div class="icon">&#128184;</div> Ausgaben</div>
        <div class="form-row">
          <div class="form-group" style="flex:2"><label>Beschreibung</label><input type="text" id="expense-desc" placeholder="z.B. Dartpfeile, Miete, Verpflegung, etc."></div>
          <div class="form-group"><label>Betrag (€)</label><input type="number" id="expense-amount" placeholder="0.00" min="0" step="0.01"></div>
          <div class="form-group"><label>Datum</label><input type="date" id="expense-date"></div>
          <div class="form-group" style="flex:0;min-width:auto"><label>&nbsp;</label><button class="btn btn-danger" onclick="addExpense()">+ Ausgabe</button></div>
        </div>
        ${expensesHtml}
      </div>
    </div>
    
    <div id="tab-birthdays" style="display:${currentMemberTab === 'tab-birthdays' ? '' : 'none'}">${renderBirthdaysView()}</div>
  `;
  
  const incomeDate = document.getElementById('income-date');
  if (incomeDate) incomeDate.valueAsDate = new Date();
  const expenseDate = document.getElementById('expense-date');
  if (expenseDate) expenseDate.valueAsDate = new Date();
}

window.switchMemberTab = function(tabId) {
  currentMemberTab = tabId;
  ['tab-kader','tab-birthdays'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = id === tabId ? '' : 'none';
  });
  document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
  const activeTab = document.querySelector(`.tabs .tab[onclick*="${tabId}"]`);
  if (activeTab) activeTab.classList.add('active');
}

window.addMember = function() {
  const name = document.getElementById('member-name').value.trim();
  const birthday = document.getElementById('member-birthday').value;
  const jerseySize = document.getElementById('member-jersey').value;
  const felgeCount = parseInt(document.getElementById('member-felge').value) || 0;
  
  if (!name) {
    alert('Bitte Name eingeben');
    return;
  }
  
  STATE.members.push({
    id: STATE.nextMemberId++,
    name,
    birthday,
    jerseySize,
    felgeCount,
    paidMonths: [],
    penalties: []
  });
  
  saveState();
  renderMembers();
}

window.editMember = function(id) {
  const member = STATE.members.find(m => m.id === id);
  if (!member) return;
  
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px';
  modal.innerHTML = `
    <div style="background:var(--bg2);border:2px solid var(--accent);border-radius:var(--radius);padding:24px;max-width:500px;width:100%">
      <h3 style="font-family:'Oswald';color:var(--accent);margin-bottom:20px;font-size:1.3rem">Mitglied bearbeiten</h3>
      <div style="margin-bottom:12px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Name</label>
        <input type="text" id="edit-member-name" value="${esc(member.name)}" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px">
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Geburtstag</label>
        <input type="date" id="edit-member-birthday" value="${member.birthday || ''}" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px">
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Trikotgröße</label>
        <select id="edit-member-jersey" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px">
          <option value="">-</option>
          <option value="XS" ${member.jerseySize === 'XS' ? 'selected' : ''}>XS</option>
          <option value="S" ${member.jerseySize === 'S' ? 'selected' : ''}>S</option>
          <option value="M" ${member.jerseySize === 'M' ? 'selected' : ''}>M</option>
          <option value="L" ${member.jerseySize === 'L' ? 'selected' : ''}>L</option>
          <option value="XL" ${member.jerseySize === 'XL' ? 'selected' : ''}>XL</option>
          <option value="XXL" ${member.jerseySize === 'XXL' ? 'selected' : ''}>XXL</option>
          <option value="XXXL" ${member.jerseySize === 'XXXL' ? 'selected' : ''}>XXXL</option>
        </select>
      </div>
      <div style="margin-bottom:20px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Felgen</label>
        <input type="number" id="edit-member-felge" value="${member.felgeCount || 0}" min="0" step="1" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px">
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="this.closest('div[style*=fixed]').remove()">Abbrechen</button>
        <button class="btn btn-primary" onclick="saveMember(${id})">Speichern</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

window.saveMember = function(id) {
  const member = STATE.members.find(m => m.id === id);
  if (!member) return;
  
  member.name = document.getElementById('edit-member-name').value.trim();
  member.birthday = document.getElementById('edit-member-birthday').value;
  member.jerseySize = document.getElementById('edit-member-jersey').value;
  member.felgeCount = parseInt(document.getElementById('edit-member-felge').value) || 0;
  
  document.querySelector('div[style*="position:fixed"][style*="z-index:10000"]').remove();
  
  saveState();
  renderMembers();
}

window.deleteMember = function(id) {
  if (!confirm('Mitglied wirklich löschen? Alle Daten gehen verloren.')) return;
  const idx = STATE.members.findIndex(m => m.id === id);
  if (idx !== -1) {
    STATE.members.splice(idx, 1);
    saveState();
    renderMembers();
  }
}

window.togglePaidMonth = function(memberId, monthIdx) {
  const member = STATE.members.find(m => m.id === memberId);
  if (!member) return;
  if (!member.paidMonths) member.paidMonths = [];
  const idx = member.paidMonths.indexOf(monthIdx);
  if (idx >= 0) {
    member.paidMonths.splice(idx, 1);
  } else {
    member.paidMonths.push(monthIdx);
    member.paidMonths.sort((a, b) => a - b);
  }
  saveState();
  renderMembers();
}

window.addPenalty = function(memberId) {
  const member = STATE.members.find(m => m.id === memberId);
  if (!member) return;
  
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px';
  modal.innerHTML = `
    <div style="background:var(--bg2);border:2px solid var(--accent2);border-radius:var(--radius);padding:24px;max-width:400px;width:100%">
      <h3 style="font-family:'Oswald';color:var(--accent2);margin-bottom:20px;font-size:1.3rem">Strafe hinzufügen</h3>
      <div style="margin-bottom:12px"><label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Grund</label><input type="text" id="penalty-type" placeholder="z.B. Zu spät, Vergessen, etc." style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px"></div>
      <div style="margin-bottom:12px"><label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Betrag (€)</label><input type="number" id="penalty-amount" value="5" min="0" step="0.50" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px"></div>
      <div style="margin-bottom:20px"><label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Datum</label><input type="date" id="penalty-date" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="this.closest('div[style*=fixed]').remove()">Abbrechen</button>
        <button class="btn btn-danger" onclick="savePenalty(${memberId})">Speichern</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  document.getElementById('penalty-date').valueAsDate = new Date();
}

window.savePenalty = function(memberId) {
  const member = STATE.members.find(m => m.id === memberId);
  if (!member) return;
  
  const type = document.getElementById('penalty-type').value.trim();
  const amount = parseFloat(document.getElementById('penalty-amount').value);
  const date = document.getElementById('penalty-date').value;
  
  if (!type || isNaN(amount) || amount <= 0 || !date) {
    alert('Bitte alle Felder korrekt ausfüllen');
    return;
  }
  
  if (!member.penalties) member.penalties = [];
  member.penalties.push({ type, amount, date });
  
  document.body.querySelector('div[style*="position:fixed"][style*="z-index:10000"]').remove();
  
  saveState();
  renderMembers();
}

window.deletePenalty = function(memberId, penaltyIdx) {
  const member = STATE.members.find(m => m.id === memberId);
  if (!member || !member.penalties) return;
  if (!confirm('Diese Strafe wirklich löschen?')) return;
  member.penalties.splice(penaltyIdx, 1);
  saveState();
  renderMembers();
}

window.addIncome = function() {
  const description = document.getElementById('income-desc').value.trim();
  const amount = parseFloat(document.getElementById('income-amount').value);
  const date = document.getElementById('income-date').value;
  
  if (!description || isNaN(amount) || amount <= 0 || !date) {
    alert('Bitte alle Felder korrekt ausfüllen');
    return;
  }
  
  STATE.otherIncome.push({ id: STATE.nextIncomeId++, description, amount, date });
  saveState();
  renderMembers();
}

window.deleteIncome = function(id) {
  if (!confirm('Diese Einnahme wirklich löschen?')) return;
  const idx = STATE.otherIncome.findIndex(i => i.id === id);
  if (idx !== -1) {
    STATE.otherIncome.splice(idx, 1);
    saveState();
    renderMembers();
  }
}

window.addExpense = function() {
  const description = document.getElementById('expense-desc').value.trim();
  const amount = parseFloat(document.getElementById('expense-amount').value);
  const date = document.getElementById('expense-date').value;
  
  if (!description || isNaN(amount) || amount <= 0 || !date) {
    alert('Bitte alle Felder korrekt ausfüllen');
    return;
  }
  
  STATE.otherExpenses.push({ id: STATE.nextExpenseId++, description, amount, date });
  saveState();
  renderMembers();
}

window.deleteExpense = function(id) {
  if (!confirm('Diese Ausgabe wirklich löschen?')) return;
  const idx = STATE.otherExpenses.findIndex(e => e.id === id);
  if (idx !== -1) {
    STATE.otherExpenses.splice(idx, 1);
    saveState();
    renderMembers();
  }
}

// === INIT ===
if (loadState()) {
  renderMembers();
} else {
  renderMembers();
}
</script>
</body>
</html>
