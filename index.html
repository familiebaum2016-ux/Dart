<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DartPro - Team & Kasse</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* === BASE STYLES === */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a28;--bg4:#222236;
  --accent:#00e5ff;--accent2:#ff3d71;--accent3:#ffaa00;--green:#00e676;--red:#ff1744;
  --text:#e8e8f0;--text2:#9898b0;--text3:#5a5a78;
  --radius:8px;--radius2:12px;
}
html{font-size:15px}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1,h2,h3,h4{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em}
button{font-family:'Barlow',sans-serif;cursor:pointer;border:none;outline:none;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
input,select{font-family:'Barlow',sans-serif;outline:none}
.app{max-width:1400px;margin:0 auto;padding:20px}
.screen{display:none}.screen.active{display:block}

/* === HEADER === */
.header{text-align:center;padding:30px 0 20px;position:relative}
.header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.logo{font-family:'Oswald',sans-serif;font-size:2.8rem;font-weight:700;letter-spacing:.08em;background:linear-gradient(135deg,var(--accent),#7c4dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo span{font-weight:300;font-size:1.4rem;display:block;letter-spacing:.2em;-webkit-text-fill-color:var(--text2);margin-top:2px}

/* === LOGIN === */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh}
.login-box{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius2);padding:40px;max-width:420px;width:100%;position:relative;overflow:hidden}
.login-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.login-box h2{font-family:'Oswald';text-align:center;margin-bottom:24px;color:var(--accent);font-size:1.6rem}
.login-box .form-group{margin-bottom:14px}
.login-box label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;font-weight:500;display:block;margin-bottom:4px}
.login-box input{background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px 12px;border-radius:6px;font-size:.95rem;width:100%}
.login-box input:focus{border-color:var(--accent)}
.login-toggle{text-align:center;margin-top:16px;font-size:.85rem;color:var(--text2)}
.login-toggle a{color:var(--accent);cursor:pointer;text-decoration:underline}
.user-info{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg3);border-radius:var(--radius);margin-bottom:16px}
.user-info .email{flex:1;font-size:.85rem;color:var(--text2);overflow:hidden;text-overflow:ellipsis}
.user-info .role-badge{padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.role-superadmin{background:rgba(124,77,255,.2);color:#b388ff;border:1px solid #7c4dff}
.role-admin{background:rgba(0,229,255,.15);color:var(--accent);border:1px solid var(--accent)}
.role-viewer{background:rgba(152,152,176,.15);color:var(--text2);border:1px solid var(--text3)}

/* === CARDS === */
.card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius2);padding:24px;margin-bottom:16px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.card-title{font-size:1.1rem;color:var(--accent);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title .icon{width:28px;height:28px;background:var(--bg3);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1rem}

/* === FORMS === */
.form-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;align-items:end}
.form-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
input,select{background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px 12px;border-radius:6px;font-size:.95rem;width:100%}
input:focus,select:focus{border-color:var(--accent)}

/* === BUTTONS === */
.btn{padding:10px 20px;border-radius:6px;font-size:.95rem;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#0099cc);color:#000}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:var(--bg3);color:var(--text);border:1px solid var(--bg4)}
.btn-ghost:hover{background:var(--bg4)}
.btn-success{background:var(--green);color:#000}
.btn-danger{background:var(--red);color:#fff}
.btn-purple{background:linear-gradient(135deg,#7c4dff,#651fff);color:#fff}
.btn-sm{padding:6px 12px;font-size:.8rem}
.edit-btn{background:transparent;border:1px solid var(--bg4);color:var(--text2);padding:4px 8px;border-radius:4px;font-size:.85rem;cursor:pointer}
.edit-btn:hover{background:var(--bg3);color:var(--accent);border-color:var(--accent)}

/* === STATS === */
.member-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:16px;text-align:center}
.stat-card.highlight{border-color:var(--accent);box-shadow:0 0 20px rgba(0,229,255,.15)}
.stat-label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.stat-value{font-family:'Oswald';font-size:1.8rem;font-weight:600;color:var(--accent)}

/* === TABS === */
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--bg4);padding-bottom:4px;flex-wrap:wrap}
.tab{padding:10px 20px;background:transparent;color:var(--text2);border:none;border-bottom:2px solid transparent;margin-bottom:-6px;transition:all .2s;font-size:.9rem}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* === TABLES === */
.data-table{width:100%;border-collapse:collapse}
.data-table th{padding:10px;text-align:left;font-size:.75rem;color:var(--text2);background:var(--bg3);font-weight:500}
.data-table td{padding:12px;border-bottom:1px solid var(--bg4);font-size:.9rem}

/* === NAV === */
.top-nav{display:flex;justify-content:space-between;align-items:center;padding:12px 0;margin-bottom:16px;border-bottom:1px solid var(--bg4);flex-wrap:wrap;gap:8px}
.nav-tabs{display:flex;gap:4px;flex-wrap:wrap}
.nav-tab{padding:8px 16px;background:transparent;color:var(--text2);border:none;border-radius:6px;font-size:.85rem;transition:all .2s}
.nav-tab:hover{background:var(--bg3);color:var(--text)}
.nav-tab.active{background:var(--bg3);color:var(--accent)}

/* === LOADING === */
.loading{text-align:center;padding:60px;color:var(--text3)}
.spinner{display:inline-block;width:40px;height:40px;border:3px solid var(--bg4);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error-msg{background:rgba(255,23,68,.1);border:1px solid var(--red);color:var(--red);padding:12px;border-radius:var(--radius);margin-bottom:16px;font-size:.9rem}
.success-msg{background:rgba(0,230,118,.1);border:1px solid var(--green);color:var(--green);padding:12px;border-radius:var(--radius);margin-bottom:16px;font-size:.9rem}

/* === MODAL === */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--bg2);border:2px solid var(--accent);border-radius:var(--radius);padding:24px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.modal-box h3{font-family:'Oswald';color:var(--accent);margin-bottom:20px;font-size:1.3rem}

@media(max-width:768px){
  .form-row{flex-direction:column}
  .form-group{min-width:100%}
  .top-nav{flex-direction:column;align-items:stretch}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="header">
    <div class="logo">DARTPRO<span>Team & Kasse</span></div>
  </div>
  <div id="main-content">
    <div class="loading"><div class="spinner"></div><p style="margin-top:16px">Wird geladen...</p></div>
  </div>
</div>

<script>
/* ============================================================
   SUPABASE CONFIG
   ============================================================ */
const SUPABASE_URL = 'https://tywnbjvpspvtdpyuefas.supabase.co';
const SUPABASE_KEY = 'sb_publishable_8S-tGToCdd_gy7VWjkRnjw_XxxLRX1o';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============================================================
   APP STATE
   ============================================================ */
const APP = {
  user: null,
  profile: null,
  currentView: 'login',     // login | superadmin | team
  adminTab: 'teams',         // teams | users
  teamTab: 'kader',          // kader | birthdays | income | expenses
  teams: [],
  members: [],
  paidMonths: [],
  penalties: [],
  otherIncome: [],
  otherExpenses: [],
  allProfiles: [],
  selectedTeamId: null,
};

/* ============================================================
   UTILITY FUNCTIONS
   ============================================================ */
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function formatDate(dateStr) {
  if (!dateStr) return '-';
  const d = new Date(dateStr);
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function showMsg(type, text) {
  const el = document.getElementById('main-content');
  const existing = el.querySelector('.error-msg, .success-msg');
  if (existing) existing.remove();
  const div = document.createElement('div');
  div.className = type === 'error' ? 'error-msg' : 'success-msg';
  div.textContent = text;
  el.insertBefore(div, el.firstChild);
  setTimeout(() => div.remove(), 4000);
}

/* ============================================================
   AUTH FUNCTIONS
   ============================================================ */
let loginMode = 'login'; // login | signup

async function doLogin(email, password) {
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { showMsg('error', 'Login fehlgeschlagen: ' + error.message); return; }
  APP.user = data.user;
  await loadProfile();
}

async function doSignup(email, password) {
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) { showMsg('error', 'Registrierung fehlgeschlagen: ' + error.message); return; }
  if (data.user && !data.session) {
    showMsg('success', 'Registrierung erfolgreich! Bitte bestätige deine E-Mail und logge dich dann ein.');
    loginMode = 'login';
    renderLogin();
    return;
  }
  APP.user = data.user;
  await loadProfile();
}

async function doLogout() {
  await sb.auth.signOut();
  APP.user = null;
  APP.profile = null;
  APP.currentView = 'login';
  renderLogin();
}

async function loadProfile() {
  if (!APP.user) return;
  const { data, error } = await sb.from('profiles').select('*').eq('id', APP.user.id).single();
  if (error || !data) {
    showMsg('error', 'Profil nicht gefunden. Bitte kontaktiere den Superadmin.');
    return;
  }
  APP.profile = data;
  if (data.role === 'superadmin') {
    APP.currentView = 'superadmin';
    await loadSuperadminData();
    renderSuperadmin();
  } else if (data.team_id) {
    APP.currentView = 'team';
    APP.selectedTeamId = data.team_id;
    await loadTeamData(data.team_id);
    renderTeamView();
  } else {
    // Viewer/Admin ohne Team - Info anzeigen
    APP.currentView = 'no-team';
    renderNoTeam();
  }
}

/* ============================================================
   RENDER: LOGIN SCREEN
   ============================================================ */
function renderLogin() {
  const el = document.getElementById('main-content');
  el.innerHTML = `
    <div class="login-wrap">
      <div class="login-box">
        <h2 id="login-title">${loginMode === 'login' ? 'Anmelden' : 'Registrieren'}</h2>
        <div id="login-error"></div>
        <div class="form-group">
          <label>E-Mail</label>
          <input type="email" id="login-email" placeholder="deine@email.de">
        </div>
        <div class="form-group">
          <label>Passwort</label>
          <input type="password" id="login-password" placeholder="Mind. 6 Zeichen">
        </div>
        <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="handleLoginSubmit()">
          ${loginMode === 'login' ? 'Einloggen' : 'Konto erstellen'}
        </button>
        <div class="login-toggle">
          ${loginMode === 'login'
            ? 'Noch kein Konto? <a onclick="toggleLoginMode()">Registrieren</a>'
            : 'Bereits registriert? <a onclick="toggleLoginMode()">Anmelden</a>'
          }
        </div>
      </div>
    </div>
  `;
}

function toggleLoginMode() {
  loginMode = loginMode === 'login' ? 'signup' : 'login';
  renderLogin();
}

async function handleLoginSubmit() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) { showMsg('error', 'Bitte E-Mail und Passwort eingeben.'); return; }
  if (password.length < 6) { showMsg('error', 'Passwort muss mindestens 6 Zeichen haben.'); return; }
  if (loginMode === 'login') {
    await doLogin(email, password);
  } else {
    await doSignup(email, password);
  }
}

function renderNoTeam() {
  const el = document.getElementById('main-content');
  const roleLabel = APP.profile.role === 'admin' ? 'Admin' : 'Viewer';
  el.innerHTML = `
    ${renderTopBar()}
    <div class="card" style="text-align:center;padding:60px 24px">
      <div style="font-size:3rem;margin-bottom:16px">&#128274;</div>
      <h3 style="font-family:'Oswald';font-size:1.4rem;margin-bottom:12px;color:var(--accent)">Kein Team zugewiesen</h3>
      <p style="color:var(--text2);max-width:400px;margin:0 auto">
        Dein Account (${esc(APP.profile.email)}) hat die Rolle <strong>${roleLabel}</strong>,
        aber es ist noch kein Team zugewiesen. Bitte kontaktiere den Superadmin.
      </p>
    </div>
  `;
}

/* ============================================================
   RENDER: SUPERADMIN DASHBOARD
   ============================================================ */
function renderTopBar() {
  const roleClass = 'role-' + (APP.profile?.role || 'viewer');
  const roleLabel = APP.profile?.role === 'superadmin' ? 'Superadmin' : APP.profile?.role === 'admin' ? 'Admin' : 'Viewer';
  return `
    <div class="top-nav">
      <div class="user-info" style="flex:0 1 auto">
        <span class="role-badge ${roleClass}">${roleLabel}</span>
        <span class="email">${esc(APP.profile?.email || APP.user?.email || '')}</span>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        ${APP.profile?.team_id ? `<span style="font-size:.8rem;color:var(--text3)">Team: ${esc(APP.teams.find(t=>t.id===APP.profile.team_id)?.name || '-')}</span>` : ''}
        <button class="btn btn-ghost btn-sm" onclick="doLogout()">Abmelden</button>
      </div>
    </div>
  `;
}

async function loadSuperadminData() {
  const [teamsRes, profilesRes] = await Promise.all([
    sb.from('teams').select('*').order('name'),
    sb.from('profiles').select('*, teams(name)').order('email')
  ]);
  APP.teams = teamsRes.data || [];
  APP.allProfiles = profilesRes.data || [];
}

function renderSuperadmin() {
  const el = document.getElementById('main-content');
  el.innerHTML = `
    ${renderTopBar()}
    <div class="tabs">
      <button class="tab ${APP.adminTab==='teams'?'active':''}" onclick="switchAdminTab('teams')">Mannschaften</button>
      <button class="tab ${APP.adminTab==='users'?'active':''}" onclick="switchAdminTab('users')">Benutzer</button>
    </div>
    <div id="admin-content"></div>
  `;
  renderAdminContent();
}

function switchAdminTab(tab) {
  APP.adminTab = tab;
  renderSuperadmin();
}

function renderAdminContent() {
  const container = document.getElementById('admin-content');
  if (!container) return;
  if (APP.adminTab === 'teams') {
    renderTeamsTab(container);
  } else {
    renderUsersTab(container);
  }
}

function renderTeamsTab(container) {
  let teamsHtml = '';
  if (APP.teams.length === 0) {
    teamsHtml = '<p style="color:var(--text3);text-align:center;padding:40px">Noch keine Mannschaften angelegt</p>';
  } else {
    teamsHtml = APP.teams.map(t => {
      const teamAdmins = APP.allProfiles.filter(p => p.team_id === t.id && p.role === 'admin');
      const teamViewers = APP.allProfiles.filter(p => p.team_id === t.id && p.role === 'viewer');
      return `
        <div style="background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px">
          <div>
            <div style="font-family:'Oswald';font-size:1.2rem;font-weight:600">${esc(t.name)}</div>
            <div style="font-size:.82rem;color:var(--text2);margin-top:4px">
              Felge: ${parseFloat(t.felge_cost).toFixed(2)} € | Monat: ${parseFloat(t.monthly_fee).toFixed(2)} €
              | Admins: ${teamAdmins.length} | Viewer: ${teamViewers.length}
            </div>
          </div>
          <div style="display:flex;gap:6px">
            <button class="btn btn-ghost btn-sm" onclick="openEditTeamModal(${t.id})">Bearbeiten</button>
            <button class="btn btn-danger btn-sm" onclick="deleteTeam(${t.id})">Löschen</button>
          </div>
        </div>
      `;
    }).join('');
  }

  container.innerHTML = `
    <div class="card">
      <div class="card-title"><div class="icon">&#127942;</div> Neue Mannschaft anlegen</div>
      <div class="form-row">
        <div class="form-group" style="flex:2"><label>Name</label><input type="text" id="new-team-name" placeholder="z.B. Team Alpha"></div>
        <div class="form-group"><label>Felge-Preis (€)</label><input type="number" id="new-team-felge" value="0.50" step="0.01" min="0"></div>
        <div class="form-group"><label>Monatsbeitrag (€)</label><input type="number" id="new-team-monthly" value="5.00" step="0.01" min="0"></div>
        <div class="form-group" style="flex:0;min-width:auto"><label>&nbsp;</label><button class="btn btn-primary" onclick="createTeam()">Anlegen</button></div>
      </div>
    </div>
    <div class="card">
      <div class="card-title"><div class="icon">&#128203;</div> Mannschaften (${APP.teams.length})</div>
      ${teamsHtml}
    </div>
  `;
}

function renderUsersTab(container) {
  const usersHtml = APP.allProfiles.length === 0
    ? '<p style="color:var(--text3);text-align:center;padding:40px">Noch keine Benutzer registriert</p>'
    : `<table class="data-table">
        <thead><tr><th>E-Mail</th><th>Rolle</th><th>Team</th><th>Aktionen</th></tr></thead>
        <tbody>
          ${APP.allProfiles.map(p => `
            <tr>
              <td>${esc(p.email)}</td>
              <td><span class="role-badge role-${p.role}" style="font-size:.7rem">${p.role}</span></td>
              <td>${esc(p.teams?.name || '-')}</td>
              <td style="text-align:right">
                <button class="btn btn-ghost btn-sm" onclick="openEditUserModal('${p.id}')">Bearbeiten</button>
                ${p.role !== 'superadmin' ? `<button class="btn btn-danger btn-sm" onclick="deleteUser('${p.id}')">Löschen</button>` : ''}
              </td>
            </tr>
          `).join('')}
        </tbody>
      </table>`;

  container.innerHTML = `
    <div class="card">
      <div class="card-title"><div class="icon">&#128101;</div> Alle Benutzer (${APP.allProfiles.length})</div>
      ${usersHtml}
    </div>
  `;
}

/* --- Superadmin Actions --- */
async function createTeam() {
  const name = document.getElementById('new-team-name').value.trim();
  const felge = parseFloat(document.getElementById('new-team-felge').value) || 0.50;
  const monthly = parseFloat(document.getElementById('new-team-monthly').value) || 5.00;
  if (!name) { showMsg('error', 'Bitte Team-Name eingeben.'); return; }
  const { error } = await sb.from('teams').insert({ name, felge_cost: felge, monthly_fee: monthly });
  if (error) { showMsg('error', 'Fehler: ' + error.message); return; }
  await loadSuperadminData();
  renderSuperadmin();
  showMsg('success', 'Mannschaft "' + name + '" angelegt.');
}

function openEditTeamModal(teamId) {
  const team = APP.teams.find(t => t.id === teamId);
  if (!team) return;
  const modal = document.createElement('div');
  modal.id = 'edit-team-modal';
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal-box">
      <h3>Mannschaft bearbeiten</h3>
      <div class="form-group" style="margin-bottom:12px">
        <label>Name</label>
        <input type="text" id="edit-team-name" value="${esc(team.name)}">
      </div>
      <div class="form-group" style="margin-bottom:12px">
        <label>Felge-Preis (€)</label>
        <input type="number" id="edit-team-felge" value="${parseFloat(team.felge_cost).toFixed(2)}" step="0.01" min="0">
      </div>
      <div class="form-group" style="margin-bottom:20px">
        <label>Monatsbeitrag (€)</label>
        <input type="number" id="edit-team-monthly" value="${parseFloat(team.monthly_fee).toFixed(2)}" step="0.01" min="0">
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="document.getElementById('edit-team-modal').remove()">Abbrechen</button>

/* ============================================================
   RENDER: TEAM VIEW
   ============================================================ */
function renderTeamView() {
  const el = document.getElementById('main-content');
  const team = APP.teams.find(t => t.id === APP.selectedTeamId);
  if (!team) { el.innerHTML = '<div class="card"><p>Team nicht gefunden.</p></div>'; return; }
  const isAdmin = APP.profile.role === 'admin' || APP.profile.role === 'superadmin';
  const FELGE = parseFloat(team.felge_cost);
  const MONTHLY = parseFloat(team.monthly_fee);

  const totalFelge = APP.members.reduce((s,m) => s + (m.felge_count||0) * FELGE, 0);
  const totalMonthly = APP.paidMonths.length * MONTHLY;
  const totalPenalties = APP.penalties.reduce((s,p) => s + parseFloat(p.amount), 0);
  const totalIncome = APP.otherIncome.reduce((s,i) => s + parseFloat(i.amount), 0);
  const totalExpenses = APP.otherExpenses.reduce((s,e) => s + parseFloat(e.amount), 0);
  const totalCash = totalFelge + totalMonthly + totalPenalties + totalIncome - totalExpenses;
  const months = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];

  let membersHtml = '';
  if (APP.members.length === 0) {
    membersHtml = '<p style="color:var(--text3);text-align:center;padding:40px">Noch keine Mitglieder vorhanden</p>';
  } else {
    membersHtml = APP.members.map(m => {
      const mPenalties = APP.penalties.filter(p => p.member_id === m.id);
      const mPaidMonths = APP.paidMonths.filter(pm => pm.member_id === m.id);
      const penaltyTotal = mPenalties.reduce((s,p) => s + parseFloat(p.amount), 0);

      let monthBtns = months.map((mo, idx) => {
        const isPaid = mPaidMonths.some(pm => pm.month_index === idx);
        const clickable = isAdmin ? `onclick="togglePaidMonth(${m.id},${idx})"` : '';
        return `<button class="btn btn-sm" ${clickable} style="min-width:48px;padding:4px 8px;font-size:.75rem;${isPaid ? 'background:var(--green);color:#000' : 'background:var(--bg);color:var(--text2);border:1px solid var(--bg4)'};${!isAdmin?'cursor:default':''}">${mo}</button>`;
      }).join('');

      let penaltiesHtml = mPenalties.length === 0
        ? '<div style="font-size:.82rem;color:var(--text3);margin-bottom:8px">Keine Strafen</div>'
        : mPenalties.map((p, idx) => `
          <div style="background:var(--bg);padding:8px;border-radius:4px;display:flex;justify-content:space-between;align-items:center;font-size:.82rem;margin-bottom:4px">
            <span>${esc(p.type)} - ${formatDate(p.date)}</span>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="color:var(--accent2);font-weight:600">${parseFloat(p.amount).toFixed(2)} €</span>
              ${isAdmin ? `<button class="edit-btn" style="color:var(--red);padding:2px 6px;font-size:.75rem" onclick="deletePenalty(${p.id})">&#128465;</button>` : ''}
            </div>
          </div>
        `).join('');

      return `
        <div style="background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:16px;margin-bottom:10px">
          <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px">
            <div>
              <div style="font-family:'Oswald';font-size:1.2rem;font-weight:600">${esc(m.name)}</div>
              <div style="font-size:.82rem;color:var(--text2);margin-top:4px">
                ${m.birthday ? 'Geburtstag: '+formatDate(m.birthday) : ''}
                ${m.jersey_size ? ' | Trikot: '+m.jersey_size : ''}
                | Felgen: <span style="color:var(--accent2)">${m.felge_count||0}</span> (${((m.felge_count||0)*FELGE).toFixed(2)} €)
              </div>
            </div>
            ${isAdmin ? `<div style="display:flex;gap:4px">
              <button class="edit-btn" onclick="openEditMemberModal(${m.id})">&#9998;</button>
              <button class="edit-btn" style="color:var(--red)" onclick="deleteMember(${m.id})">&#128465;</button>
            </div>` : ''}
          </div>
          <div style="margin-bottom:12px">
            <div style="font-size:.75rem;color:var(--text2);margin-bottom:6px">Monatsbeiträge (${mPaidMonths.length}/${MONTHLY.toFixed(2)} € pro Monat):</div>
            <div style="display:flex;flex-wrap:wrap;gap:4px">${monthBtns}</div>
            <div style="font-size:.82rem;color:var(--green);margin-top:6px;font-weight:600">Gesamt: ${(mPaidMonths.length * MONTHLY).toFixed(2)} €</div>
          </div>
          <div>
            <div style="font-size:.75rem;color:var(--text2);margin-bottom:6px">Strafen: <span style="color:var(--accent2);font-weight:600">${mPenalties.length}</span> (${penaltyTotal.toFixed(2)} €)</div>
            ${penaltiesHtml}
            ${isAdmin ? `<button class="edit-btn btn-sm" onclick="openPenaltyModal(${m.id})">+ Strafe hinzufügen</button>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  // Birthdays
  const membersWithBday = APP.members.filter(m => m.birthday).map(m => {
    const bd = new Date(m.birthday);
    const today = new Date(); today.setHours(0,0,0,0);
    const next = new Date(today.getFullYear(), bd.getMonth(), bd.getDate());
    if (next < today) next.setFullYear(next.getFullYear()+1);
    const days = Math.ceil((next - today) / (1000*60*60*24));
    return { ...m, daysUntil: days };
  }).sort((a,b) => a.daysUntil - b.daysUntil);

  let birthdayHtml = '';
  if (membersWithBday.length === 0) {
    birthdayHtml = '<div class="card"><p style="color:var(--text3);text-align:center;padding:40px">Keine Geburtstage eingetragen</p></div>';
  } else {
    birthdayHtml = '<div class="card"><div class="card-title"><div class="icon">&#127874;</div> Geburtstage</div>';
    birthdayHtml += membersWithBday.map(m => {
      const isToday = m.daysUntil === 0;
      const isWeek = m.daysUntil <= 7;
      const bd = new Date(m.birthday);
      const age = new Date().getFullYear() - bd.getFullYear();
      let badgeColor = 'var(--red)', badgeBg = 'rgba(255,23,68,.15)', badgeText = `in ${m.daysUntil} Tagen`;
      if (isToday) { badgeColor='var(--green)'; badgeBg='rgba(0,230,118,.2)'; badgeText='&#127881; HEUTE!'; }
      else if (isWeek) { badgeColor='var(--accent3)'; badgeBg='rgba(255,170,0,.15)'; badgeText=`in ${m.daysUntil} ${m.daysUntil===1?'Tag':'Tagen'}`; }
      return `
        <div style="background:var(--bg3);border:1px solid ${isToday?'var(--green)':isWeek?'var(--accent3)':'var(--bg4)'};border-radius:var(--radius);padding:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-family:'Oswald';font-size:1.2rem;font-weight:600">${esc(m.name)}</div>
            <div style="font-size:.85rem;color:var(--text2);margin-top:4px">${formatDate(m.birthday)} (${age} Jahre)</div>
          </div>
          <div style="font-family:'Oswald';font-size:1.4rem;font-weight:700;color:${badgeColor};padding:4px 12px;background:${badgeBg};border-radius:var(--radius)">${badgeText}</div>
        </div>
      `;
    }).join('');
    birthdayHtml += '</div>';
  }

  // Income
  let incomeHtml = APP.otherIncome.length === 0
    ? '<p style="color:var(--text3);text-align:center;padding:20px;font-size:.85rem">Keine sonstigen Einnahmen</p>'
    : `<table class="data-table"><thead><tr><th>Beschreibung</th><th>Betrag</th><th>Datum</th>${isAdmin?'<th></th>':''}</tr></thead><tbody>
      ${APP.otherIncome.map(i => `<tr>
        <td>${esc(i.description)}</td>
        <td style="color:var(--green);font-weight:600">+${parseFloat(i.amount).toFixed(2)} €</td>
        <td>${formatDate(i.date)}</td>
        ${isAdmin ? `<td style="text-align:right"><button class="edit-btn" style="color:var(--red)" onclick="deleteIncome(${i.id})">&#128465;</button></td>` : ''}
      </tr>`).join('')}</tbody></table>`;

  // Expenses
  let expenseHtml = APP.otherExpenses.length === 0
    ? '<p style="color:var(--text3);text-align:center;padding:20px;font-size:.85rem">Keine Ausgaben erfasst</p>'
    : `<table class="data-table"><thead><tr><th>Beschreibung</th><th>Betrag</th><th>Datum</th>${isAdmin?'<th></th>':''}</tr></thead><tbody>
      ${APP.otherExpenses.map(e => `<tr>
        <td>${esc(e.description)}</td>
        <td style="color:var(--red);font-weight:600">-${parseFloat(e.amount).toFixed(2)} €</td>
        <td>${formatDate(e.date)}</td>
        ${isAdmin ? `<td style="text-align:right"><button class="edit-btn" style="color:var(--red)" onclick="deleteExpense(${e.id})">&#128465;</button></td>` : ''}
      </tr>`).join('')}</tbody></table>`;

  el.innerHTML = `
    ${renderTopBar()}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:8px">
      <h2 style="font-size:1.8rem">&#128101; ${esc(team.name)}</h2>
    </div>
    <div class="member-stats">
      <div class="stat-card"><div class="stat-label">Mitglieder</div><div class="stat-value">${APP.members.length}</div></div>
      <div class="stat-card"><div class="stat-label">Felgengeld</div><div class="stat-value">${totalFelge.toFixed(2)} €</div><div style="font-size:.75rem;color:var(--text3);margin-top:4px">${APP.members.reduce((s,m)=>s+(m.felge_count||0),0)} Felgen</div></div>
      <div class="stat-card"><div class="stat-label">Monatsbeiträge</div><div class="stat-value">${totalMonthly.toFixed(2)} €</div></div>
      <div class="stat-card"><div class="stat-label">Strafen</div><div class="stat-value">${totalPenalties.toFixed(2)} €</div></div>
      <div class="stat-card"><div class="stat-label">Sonst. Einnahmen</div><div class="stat-value">${totalIncome.toFixed(2)} €</div></div>
      <div class="stat-card"><div class="stat-label">Ausgaben</div><div class="stat-value" style="color:var(--red)">${totalExpenses.toFixed(2)} €</div></div>
      <div class="stat-card highlight"><div class="stat-label">Gesamtkasse</div><div class="stat-value">${totalCash.toFixed(2)} €</div></div>
    </div>
    <div class="tabs">
      <button class="tab ${APP.teamTab==='kader'?'active':''}" onclick="switchTeamTab('kader')">Kader</button>
      <button class="tab ${APP.teamTab==='birthdays'?'active':''}" onclick="switchTeamTab('birthdays')">&#127874; Geburtstage</button>
      ${isAdmin ? `<button class="tab ${APP.teamTab==='income'?'active':''}" onclick="switchTeamTab('income')">Einnahmen</button>` : ''}
      ${isAdmin ? `<button class="tab ${APP.teamTab==='expenses'?'active':''}" onclick="switchTeamTab('expenses')">Ausgaben</button>` : ''}
    </div>
    <div id="team-tab-content">
      ${APP.teamTab === 'kader' ? `
        ${isAdmin ? `<div class="card">
          <div class="card-title"><div class="icon">&#128100;</div> Mitglied hinzufügen</div>
          <div class="form-row">
            <div class="form-group" style="flex:2"><label>Name</label><input type="text" id="member-name" placeholder="Vollständiger Name"></div>
            <div class="form-group"><label>Geburtstag</label><input type="date" id="member-birthday"></div>
            <div class="form-group"><label>Trikotgröße</label><select id="member-jersey"><option value="">-</option><option value="XS">XS</option><option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option><option value="XXXL">XXXL</option></select></div>
            <div class="form-group"><label>Felgen</label><input type="number" id="member-felge" value="0" min="0"></div>
            <div class="form-group" style="flex:0;min-width:auto"><label>&nbsp;</label><button class="btn btn-primary" onclick="addMember()">+ Hinzufügen</button></div>
          </div>
        </div>` : ''}
        <div class="card"><div class="card-title"><div class="icon">&#128101;</div> Mitgliederliste</div>${membersHtml}</div>
      ` : ''}
      ${APP.teamTab === 'birthdays' ? birthdayHtml : ''}
      ${APP.teamTab === 'income' && isAdmin ? `<div class="card">
        <div class="card-title"><div class="icon">&#128176;</div> Sonstige Einnahmen</div>
        <div class="form-row">
          <div class="form-group" style="flex:2"><label>Beschreibung</label><input type="text" id="income-desc" placeholder="z.B. Spende, Verkauf"></div>
          <div class="form-group"><label>Betrag (€)</label><input type="number" id="income-amount" placeholder="0.00" min="0" step="0.01"></div>
          <div class="form-group"><label>Datum</label><input type="date" id="income-date"></div>
          <div class="form-group" style="flex:0;min-width:auto"><label>&nbsp;</label><button class="btn btn-success" onclick="addIncome()">+ Einnahme</button></div>
        </div>
        ${incomeHtml}
      </div>` : ''}
      ${APP.teamTab === 'expenses' && isAdmin ? `<div class="card">
        <div class="card-title"><div class="icon">&#128184;</div> Ausgaben</div>
        <div class="form-row">
          <div class="form-group" style="flex:2"><label>Beschreibung</label><input type="text" id="expense-desc" placeholder="z.B. Dartpfeile, Miete"></div>
          <div class="form-group"><label>Betrag (€)</label><input type="number" id="expense-amount" placeholder="0.00" min="0" step="0.01"></div>
          <div class="form-group"><label>Datum</label><input type="date" id="expense-date"></div>
          <div class="form-group" style="flex:0;min-width:auto"><label>&nbsp;</label><button class="btn btn-danger" onclick="addExpense()">+ Ausgabe</button></div>
        </div>
        ${expenseHtml}
      </div>` : ''}
    </div>
  `;

  // Set today's date on date inputs
  ['income-date','expense-date'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.valueAsDate = new Date();
  });
}

function switchTeamTab(tab) {
  APP.teamTab = tab;
  renderTeamView();
}

/* --- Member Actions (Admin) --- */
function openEditMemberModal(memberId) {
  const m = APP.members.find(x => x.id === memberId);
  if (!m) return;
  const modal = document.createElement('div');
  modal.id = 'edit-member-modal';
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal-box">
      <h3>Mitglied bearbeiten</h3>
      <div class="form-group" style="margin-bottom:12px"><label>Name</label><input type="text" id="em-name" value="${esc(m.name)}"></div>
      <div class="form-group" style="margin-bottom:12px"><label>Geburtstag</label><input type="date" id="em-birthday" value="${m.birthday||''}"></div>
      <div class="form-group" style="margin-bottom:12px"><label>Trikotgröße</label>
        <select id="em-jersey">
          <option value="">-</option>
          ${['XS','S','M','L','XL','XXL','XXXL'].map(s => `<option value="${s}" ${m.jersey_size===s?'selected':''}>${s}</option>`).join('')}
        </select>
      </div>
      <div class="form-group" style="margin-bottom:20px"><label>Felgen</label><input type="number" id="em-felge" value="${m.felge_count||0}" min="0"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="document.getElementById('edit-member-modal').remove()">Abbrechen</button>
        <button class="btn btn-primary" onclick="saveMember(${memberId})">Speichern</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

async function saveMember(memberId) {
  const name = document.getElementById('em-name').value.trim();
  if (!name) { showMsg('error','Name darf nicht leer sein.'); return; }
  const { error } = await sb.from('members').update({
    name,
    birthday: document.getElementById('em-birthday').value || null,
    jersey_size: document.getElementById('em-jersey').value || null,
    felge_count: parseInt(document.getElementById('em-felge').value) || 0
  }).eq('id', memberId);
  if (error) { showMsg('error','Fehler: '+error.message); return; }
  document.getElementById('edit-member-modal')?.remove();
  await loadTeamData(APP.selectedTeamId);
  renderTeamView();
  showMsg('success','Mitglied gespeichert.');
}

async function deleteMember(memberId) {
  if (!confirm('Mitglied wirklich löschen? Alle Daten gehen verloren.')) return;
  const { error } = await sb.from('members').delete().eq('id', memberId);
  if (error) { showMsg('error','Fehler: '+error.message); return; }
  await loadTeamData(APP.selectedTeamId);
  renderTeamView();
  showMsg('success','Mitglied gelöscht.');
}

async function addMember() {
  const name = document.getElementById('member-name').value.trim();
  if (!name) { showMsg('error','Bitte Name eingeben.'); return; }
  const { error } = await sb.from('members').insert({
    team_id: APP.selectedTeamId,
    name,
    birthday: document.getElementById('member-birthday').value || null,
    jersey_size: document.getElementById('member-jersey').value || null,
    felge_count: parseInt(document.getElementById('member-felge').value) || 0
  });
  if (error) { showMsg('error','Fehler: '+error.message); return; }
  await loadTeamData(APP.selectedTeamId);
  renderTeamView();
}

async function togglePaidMonth(memberId, monthIdx) {
  const existing = APP.paidMonths.find(pm => pm.member_id === memberId && pm.month_index === monthIdx);
  if (existing) {
    await sb.from('paid_months').delete().eq('id', existing.id);
  } else {
    await sb.from('paid_months').insert({ member_id: memberId, month_index: monthIdx });
  }
  await loadTeamData(APP.selectedTeamId);
  renderTeamView();
}

function openPenaltyModal(memberId) {
  const modal = document.createElement('div');
  modal.id = 'penalty-modal';
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal-box" style="border-color:var(--accent2)">
      <h3 style="color:var(--accent2)">Strafe hinzufügen</h3>
      <div class="form-group" style="margin-bottom:12px"><label>Grund</label><input type="text" id="pen-type" placeholder="z.B. Zu spät, Vergessen"></div>
      <div class="form-group" style="margin-bottom:12px"><label>Betrag (€)</label><input type="number" id="pen-amount" value="5" min="0" step="0.50"></div>
      <div class="form-group" style="margin-bottom:20px"><label>Datum</label><input type="date" id="pen-date"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="document.getElementById('penalty-modal').remove()">Abbrechen</button>
        <button class="btn btn-danger" onclick="addPenalty(${memberId})">Speichern</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  document.getElementById('pen-date').valueAsDate = new Date();
}

async function addPenalty(memberId) {
  const type = document.getElementById('pen-type').value.trim();
  const amount = parseFloat(document.getElementById('pen-amount').value);
  const date = document.getElementById('pen-date').value;
  if (!type || isNaN(amount) || amount <= 0 || !date) { showMsg('error','Bitte alle Felder korrekt ausfüllen.'); return; }
  const { error } = await sb.from('penalties').insert({ member_id: memberId, type, amount, date });
  if (error) { showMsg('error','Fehler: '+error.message); return; }
  document.getElementById('penalty-modal')?.remove();
  await loadTeamData(APP.selectedTeamId);
  renderTeamView();
}

async function deletePenalty(penaltyId) {
  if (!confirm('Strafe wirklich löschen?')) return;
  await sb.from('penalties').delete().eq('id', penaltyId);
  await loadTeamData(APP.selectedTeamId);
  renderTeamView();
}

async function addIncome() {
  const desc = document.getElementById('income-desc').value.trim();
  const amount = parseFloat(document.getElementById('income-amount').value);
  const date = document.getElementById('income-date').value;
  if (!desc || isNaN(amount) || amount <= 0 || !date) { showMsg('error','Bitte alle Felder korrekt ausfüllen.'); return; }
  const { error } = await sb.from('other_income').insert({ team_id: APP.selectedTeamId, description: desc, amount, date });
  if (error) { showMsg('error','Fehler: '+error.message); return; }
  await loadTeamData(APP.selectedTeamId);
  renderTeamView();
}

async function deleteIncome(id) {
  if (!confirm('Einnahme wirklich löschen?')) return;
  await sb.from('other_income').delete().eq('id', id);
  await loadTeamData(APP.selectedTeamId);
  renderTeamView();
}

async function deleteExpense(id) {

  renderTeamView();
}

/* ============================================================
   DATA LOADING FUNCTIONS
   ============================================================ */
async function loadTeamData(teamId) {
  const [membersRes, pmRes, penRes, incRes, expRes, teamsRes] = await Promise.all([
    sb.from('members').select('*').eq('team_id', teamId).order('name'),
    sb.from('paid_months').select('*'),
    sb.from('penalties').select('*').order('date', { ascending: false }),
    sb.from('other_income').select('*').eq('team_id', teamId).order('date', { ascending: false }),
    sb.from('other_expenses').select('*').eq('team_id', teamId).order('date', { ascending: false }),
    sb.from('teams').select('*').eq('id', teamId).single()
  ]);
  APP.members = membersRes.data || [];
  APP.paidMonths = pmRes.data || [];
  APP.penalties = penRes.data || [];
  APP.otherIncome = incRes.data || [];
  APP.otherExpenses = expRes.data || [];
  if (teamsRes.data) {
    APP.teams = [teamsRes.data];
  }
}

/* ============================================================
   TEAM DATA MUTATION FUNCTIONS
   (Alle Mutation-Funktionen sind bereits im Team-View Bereich)
   ============================================================ */

/* ============================================================
   INIT
   ============================================================ */
async function init() {
  // Check if user is already logged in
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    APP.user = session.user;
    await loadProfile();
  } else {
    renderLogin();
  }
}

// Listen for auth state changes
sb.auth.onAuthStateChange(async (event, session) => {
  if (event === 'SIGNED_IN' && session?.user) {
    APP.user = session.user;
    await loadProfile();
  } else if (event === 'SIGNED_OUT') {
    APP.user = null;
    APP.profile = null;
    renderLogin();
  }
});
