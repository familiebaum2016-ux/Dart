<script>
// Cache-Buster: Lädt Seite neu wenn Version sich geändert hat
(function(){
  const VERSION = '2026.09.24.14';
  const stored = localStorage.getItem('dartpro_version');
  if (stored && stored !== VERSION) {
    localStorage.setItem('dartpro_version', VERSION);
    location.reload(true);
  } else if (!stored) {
    localStorage.setItem('dartpro_version', VERSION);

})();

<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a28;--bg4:#222236;
  --accent:#00e5ff;--accent2:#ff3d71;--accent3:#ffaa00;--green:#00e676;--red:#ff1744;
  --text:#e8e8f0;--text2:#9898b0;--text3:#5a5a78;
  --radius:8px;--radius2:12px;
}
html{font-size:15px}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1,h2,h3,h4{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em}
button{font-family:'Barlow',sans-serif;cursor:pointer;border:none;outline:none;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
input,select,textarea{font-family:'Barlow',sans-serif;outline:none}
.app{max-width:1400px;margin:0 auto;padding:20px}
.screen{display:none}.screen.active{display:block}

.header{text-align:center;padding:30px 0 20px;position:relative}
.header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.logo{font-family:'Oswald',sans-serif;font-size:2.8rem;font-weight:700;letter-spacing:.08em;background:linear-gradient(135deg,var(--accent),#7c4dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo span{font-weight:300;font-size:1.4rem;display:block;letter-spacing:.2em;-webkit-text-fill-color:var(--text2);margin-top:2px}

.card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius2);padding:24px;margin-bottom:16px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.card-title{font-size:1.1rem;color:var(--accent);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title .icon{width:28px;height:28px;background:var(--bg3);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1rem}

.form-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;align-items:end}
.form-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
input,select,textarea{background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px 12px;border-radius:6px;font-size:.95rem;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:80px}

.btn{padding:10px 20px;border-radius:6px;font-size:.95rem;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#0099cc);color:#000}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:var(--bg3);color:var(--text);border:1px solid var(--bg4)}
.btn-ghost:hover{background:var(--bg4)}
.btn-success{background:var(--green);color:#000}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:6px 12px;font-size:.8rem}
.edit-btn{background:transparent;border:1px solid var(--bg4);color:var(--text2);padding:4px 8px;border-radius:4px;font-size:.85rem;cursor:pointer}
.edit-btn:hover{background:var(--bg3);color:var(--accent);border-color:var(--accent)}

.member-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:16px;text-align:center}
.stat-card.highlight{border-color:var(--accent);box-shadow:0 0 20px rgba(0,229,255,.15)}
.stat-label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.stat-value{font-family:'Oswald';font-size:1.8rem;font-weight:600;color:var(--accent)}

.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--bg4);padding-bottom:4px;flex-wrap:wrap}
.tab{padding:10px 20px;background:transparent;color:var(--text2);border:none;border-bottom:2px solid transparent;margin-bottom:-6px;transition:all .2s;font-size:.9rem}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

@media(max-width:768px){
  .form-row{flex-direction:column}
  .form-group{min-width:100%}
}

.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh}
.login-box{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius2);padding:40px;max-width:420px;width:100%;position:relative;overflow:hidden}

.login-box .form-group{margin-bottom:14px}
.login-box label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;font-weight:500;display:block;margin-bottom:4px}
.login-box input{background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px 12px;border-radius:6px;font-size:.95rem;width:100%}
.login-box input:focus{border-color:var(--accent)}
.login-toggle{text-align:center;margin-top:16px;font-size:.85rem;color:var(--text2)}

.user-bar .team-name{font-family:'Oswald';font-size:1rem;color:var(--accent)}
.role-badge{padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.role-superadmin{background:rgba(124,77,255,.2);color:#b388ff;border:1px solid #7c4dff}
.role-admin{background:rgba(0,229,255,.15);color:var(--accent);border:1px solid var(--accent)}
.role-viewer{background:rgba(152,152,176,.15);color:var(--text2);border:1px solid var(--text3)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--bg2);border:2px solid var(--accent);border-radius:var(--radius);padding:24px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.modal-box h3{font-family:'Oswald';color:var(--accent);margin-bottom:20px;font-size:1.3rem}
.error-msg{background:rgba(255,23,68,.1);border:1px solid var(--red);color:var(--red);padding:12px;border-radius:var(--radius);margin-bottom:16px;font-size:.9rem}
.success-msg{background:rgba(0,230,118,.1);border:1px solid var(--green);color:var(--green);padding:12px;border-radius:var(--radius);margin-bottom:16px;font-size:.9rem}

.announcement{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:16px;margin-bottom:12px}
.announcement-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:8px;flex-wrap:wrap;gap:8px}
.announcement-title{font-family:'Oswald';font-size:1.1rem;color:var(--accent3)}
.announcement-meta{font-size:.75rem;color:var(--text3)}
.announcement-content{font-size:.9rem;color:var(--text);line-height:1.5;white-space:pre-wrap;margin-top:8px}
.announcement-team-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;background:rgba(0,229,255,.1);color:var(--accent);border:1px solid var(--accent);margin-left:8px}
.global-badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:.7rem;background:rgba(255,170,0,.15);color:var(--accent3);border:1px solid var(--accent3);font-weight:600}

.member-search{position:relative}
.member-suggestions{position:absolute;z-index:50;top:100%;left:0;right:0;margin-top:4px;background:var(--bg2);border:1px solid var(--accent);border-radius:6px;box-shadow:0 14px 32px rgba(0,0,0,.45);max-height:220px;overflow-y:auto;display:none}
.member-suggestion{display:block;width:100%;padding:10px 12px;background:transparent;color:var(--text);text-align:left;text-transform:none;letter-spacing:0;border-bottom:1px solid var(--bg4)}
.member-suggestion:last-child{border-bottom:none}
.member-suggestion:hover,.member-suggestion:focus{background:var(--bg3);color:var(--accent)}
.table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.readonly-note{color:var(--text3);font-size:.85rem;margin-top:14px}

.felge-ranking{display:grid;gap:10px}
.felge-entry{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:16px}
.felge-entry.rank-1{border-color:var(--accent3);background:rgba(255,170,0,.08)}
.felge-entry.rank-2{border-color:var(--text2);background:rgba(152,152,176,.05)}
.felge-entry.rank-3{border-color:#cd7f32;background:rgba(205,127,50,.08)}
.felge-rank{font-family:'Oswald';font-size:1.8rem;font-weight:700;min-width:50px;text-align:center}
.felge-rank.gold{color:var(--accent3)}
.felge-rank.silver{color:var(--text2)}
.felge-rank.bronze{color:#cd7f32}
.felge-info{flex:1}
.felge-name{font-family:'Oswald';font-size:1.2rem;font-weight:600}
.felge-count{font-size:.85rem;color:var(--text2);margin-top:4px}
.felge-value{font-family:'Oswald';font-size:1.4rem;font-weight:600;color:var(--accent)}
.privacy-mode .private-amount{filter:blur(9px);user-select:none;pointer-events:none}
.privacy-mode .stat-card:has(.private-amount){position:relative}
.privacy-mode .stat-card:has(.private-amount)::after{content:'VERDECKT';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:.68rem;letter-spacing:.14em;color:var(--text2);background:rgba(18,18,26,.35)}
.guest-shell{max-width:1050px;margin:0 auto}
.guest-kicker{text-align:center;color:var(--accent3);font-size:.75rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:8px}
.guest-title{text-align:center;font-size:2rem;margin-bottom:8px}
.guest-subtitle{text-align:center;color:var(--text2);margin-bottom:24px}
.share-qr{width:300px;min-height:300px;margin:18px auto;padding:14px;background:#fff;border-radius:10px;display:flex;align-items:center;justify-content:center}
.share-qr img,.share-qr canvas{display:block;max-width:100%;height:auto!important}
.share-link{font-size:.76rem;word-break:break-all;color:var(--text3);background:var(--bg);border:1px solid var(--bg4);border-radius:6px;padding:10px;margin-top:12px;max-height:82px;overflow:auto}
@media(max-width:520px){.share-qr{width:250px;min-height:250px}.guest-title{font-size:1.55rem}}
</style>

<script>
const SUPABASE_URL = 'https://tywnbjvpspvtdpyuefas.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5d25ianZwc3B2dGRweXVlZmFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MTQxMDUsImV4cCI6MjA5ODM5MDEwNX0.tg9OUzoxFhGVszAPHqKEIlm_zf66Dqn3smznCLDfIxA';
let sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
  auth: {
    persistSession: true,
    autoRefreshToken: true,
    storage: localStorage,
    storageKey: 'sb-dartpro-auth',
    detectSessionInUrl: true
  }
});

// Supabase-Client zurücksetzen und neu erstellen
function resetSupabaseClient() {
  try {
    localStorage.removeItem('sb-dartpro-auth');
    sessionStorage.removeItem('sb-dartpro-auth');
  } catch(_) {}
  sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {
      persistSession: true,
      autoRefreshToken: true,
      storage: localStorage,
      storageKey: 'sb-dartpro-auth',
      detectSessionInUrl: false
    }
  });
}

// ── SESSION MANAGEMENT ──
const SESSION_TIMEOUT = 5 * 60 * 1000;
let inactivityTimer = null;
let warningTimer    = null;
let sessionExpired  = false;

function updateActivity() {
  localStorage.setItem('dartpro_last_active', Date.now().toString());
  resetInactivityTimer();
}
function resetInactivityTimer() {
  if (inactivityTimer) clearTimeout(inactivityTimer);
  if (warningTimer) clearTimeout(warningTimer);
  if (!APP.user || sessionExpired) return;
  warningTimer = setTimeout(() => showSessionWarning(), SESSION_TIMEOUT - 30000);
  inactivityTimer = setTimeout(() => {
    forceLogout('Sitzung abgelaufen - Bitte neu anmelden.');
  }, SESSION_TIMEOUT);
}
function showSessionWarning() {
  if (document.getElementById('session-warning-modal')) return;
  const m = document.createElement('div');
  m.id = 'session-warning-modal';
  m.className = 'modal-overlay';
  m.innerHTML = `<div class="modal-box" style="border-color:var(--accent3)">
    <h3 style="color:var(--accent3)">&#9200; Sitzung läuft ab</h3>
    <p style="color:var(--text);margin-bottom:16px">Deine Sitzung läuft in 30 Sekunden ab. Klicke auf "Weitersurfen" um aktiv zu bleiben.</p>
    <div style="display:flex;gap:10px;justify-content:flex-end">
      <button class="btn btn-primary" onclick="dismissSessionWarning()">Weitersurfen</button>
    </div></div>`;
  document.body.appendChild(m);
}
function dismissSessionWarning() {
  const m = document.getElementById('session-warning-modal');
  if (m) m.remove();
  updateActivity();
}
async function forceLogout(msg) {
  sessionExpired = true;
  localStorage.removeItem('sb-dartpro-auth');
  localStorage.removeItem('dartpro_last_active');
  APP.user=null; APP.profile=null; APP.team=null;
  gameCostsRefreshTeamId=null;
  gameCostsRefreshToken++;
  if (inactivityTimer) clearTimeout(inactivityTimer);
  if (warningTimer) clearTimeout(warningTimer);
  const w = document.getElementById('session-warning-modal');
  if (w) w.remove();
  document.getElementById('login-screen').style.display='';
  document.getElementById('screen-main').classList.remove('active');
  document.getElementById('screen-main').innerHTML='';
  loginMode='login'; renderLogin();
  if (msg) showMsg('error', msg);
}
['click','keydown','mousemove','scroll','touchstart'].forEach(ev => {
  document.addEventListener(ev, () => { if (APP.user && !sessionExpired) updateActivity(); }, {passive:true});
});

const APP = { user: null, profile: null, team: null, members: [], paidMonths: [], monthPayments: [], monthExemptions: [], penalties: [], penaltyCatalog: [], gameCosts: [], gameCostPlayerMeta: [], otherIncome: [], otherExpenses: [], announcements: [], registrations: [], silentMembers: [], felgeEntries: [], felgeSeasonList: [] };
const guestShareEncoded = location.hash.startsWith('#spielkosten=') ? location.hash.slice('#spielkosten='.length) : '';
let guestShareMode = Boolean(guestShareEncoded);
let loginMode = 'login';
let currentTab = 'kader';
let currentKaderYear = 2026;
let currentPenaltyYear = Math.min(2099, Math.max(2026, new Date().getFullYear()));
let currentRegistrationSeason = '2026/2027';
let currentFelgeSeason = 'Saison 1';
let superadminTab = 'teams';
let allTeams = [];
let allProfiles = [];
let saTeamId = null;
let saAnnouncements = [];
let gameCostsRefreshTeamId = null;
let gameCostsRefreshToken = 0;
let gameCostsRefreshInProgress = false;
let gameCostEditEntryId = null;
const gameCostDrafts = { DSAB: null, DKS: null };
const gameCostActionTokens = { DSAB: 0, DKS: 0 };
const REGISTRATION_MARKER_PREFIX = '__ANMELDUNG__|';
const SILENT_MEMBER_MARKER_PREFIX = '__STILLES_MITGLIED__|';
const FELGE_MARKER_PREFIX = '__FELGE__|';
const FELGE_SEASON_MARKER_PREFIX = '__FELGE_SEASON__|';
const MONTH_PAYMENT_MARKER_PREFIX = '__MONATSBEITRAG__|';
const MONTH_EXEMPTION_MARKER_PREFIX = '__MONATSBEITRAG_FREI__|';
const PENALTY_CATALOG_MARKER_PREFIX = '__STRAFKATALOG__|';
const GAME_COST_MARKER_PREFIX = '__SPIELKOSTEN__|';
const GAME_COST_PLAYER_META_PREFIX = '__SPIELKOSTEN_SPIELER__|';
const THREE_K_API_BASES = {
  2: 'https://backend2.3k-darts.com/2k-backend2/api/v1/frontend',
  3: 'https://backend3.3k-darts.com/2k-backend3/api/v1/frontend',

};

function esc(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;'); }
function fmtDate(d) { if (!d) return '-'; const x = new Date(d); return x.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtDateTime(d) { if (!d) return '-'; const x = new Date(d); return x.toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }
function showMsg(t,m) { const el=document.getElementById('login-msg'); if(!el)return; el.innerHTML=`<div class="${t==='error'?'error-msg':'success-msg'}">${esc(m)}</div>`; setTimeout(()=>{if(el)el.innerHTML='';},5000); }

// LOGIN
async function doLogin(e,p) {
  try {
    resetSupabaseClient();
    APP.user = null; APP.profile = null; APP.team = null;
    const loginPromise = sb.auth.signInWithPassword({email:e,password:p});
    const timeoutPromise = new Promise((_, reject) =>
      setTimeout(() => reject(new Error('Login-Timeout - Bitte Seite neu laden und nochmal versuchen')), 10000)
    );
    const {data,error} = await Promise.race([loginPromise, timeoutPromise]);
    if (error) { showMsg('error','Login fehlgeschlagen: '+error.message); return false; }
    if (!data.user) { showMsg('error','Login fehlgeschlagen - Bitte nochmal versuchen'); return false; }
    APP.user = data.user;
    sessionExpired = false;
    updateActivity();
    await loadProfile();
    return true;
  } catch(err) {
    showMsg('error', err.message || 'Fehler beim Einloggen - Bitte Seite neu laden');
    return false;
  }
}
async function doSignup(e,p) {
  try {
    const {data,error} = await sb.auth.signUp({email:e,password:p});
    if (error) { showMsg('error','Registrierung fehlgeschlagen: '+error.message); return; }
    showMsg('success','Registriert! Prüfe deine E-Mail oder logge dich direkt ein.');
    loginMode='login'; renderLogin();
  } catch(err) { showMsg('error','Fehler: '+err.message); }
}
async function doLogout() {
  if (inactivityTimer) clearTimeout(inactivityTimer);
  if (warningTimer) clearTimeout(warningTimer);
  localStorage.removeItem('sb-dartpro-auth');
  localStorage.removeItem('dartpro_last_active');
  sessionExpired = false;
  APP.user=null; APP.profile=null; APP.team=null;
  gameCostsRefreshTeamId=null;
  gameCostsRefreshToken++;
  document.getElementById('login-screen').style.display='';
  document.getElementById('screen-main').classList.remove('active');
  document.getElementById('screen-main').innerHTML='';
  loginMode='login'; renderLogin();
}
async function loadProfile() {
  try {
    const {data,error} = await sb.from('profiles').select('*, teams(*)').eq('id',APP.user.id).single();
    if (error || !data) { showMsg('error','Profil nicht gefunden.'); return; }
    APP.profile = data; APP.team = data.teams;
    document.getElementById('login-screen').style.display='none';
    document.getElementById('screen-main').classList.add('active');
    sessionExpired = false;
    updateActivity();
    if (APP.profile.role==='superadmin') { await renderSuperadmin(); return; }
    if (!APP.team) { renderNoTeam(); return; }
    await loadTeamData(); renderTeamView(); autoRefreshGameCosts();
  } catch(err) { console.error(err); }
}
function renderLogin() {
  document.getElementById('login-screen').style.display='';

async function loadTeamData() {
  if (!APP.team) return;
  const tid = APP.team.id;
  const [mRes,pmRes,penRes,incRes,expRes] = await Promise.all([
    sb.from('members').select('*').eq('team_id',tid).order('name'),
    sb.from('paid_months').select('*'),
    sb.from('penalties').select('*').order('date',{ascending:false}),
    sb.from('other_income').select('*').eq('team_id',tid).order('date',{ascending:false}),
    sb.from('other_expenses').select('*').eq('team_id',tid).order('date',{ascending:false}),
  ]);
  const incomeRows = incRes.data||[];
  APP.members=mRes.data||[]; APP.paidMonths=pmRes.data||[];
  const memberIds = new Set(APP.members.map(m=>String(m.id)));
  APP.penalties=(penRes.data||[]).filter(p=>memberIds.has(String(p.member_id)));
  APP.registrations=incomeRows.map(parseRegistrationMarker).filter(Boolean);
  APP.silentMembers=incomeRows.map(parseSilentMemberMarker).filter(Boolean);
  APP.felgeEntries=incomeRows.map(parseFelgeMarker).filter(Boolean);
  APP.felgeSeasonList=incomeRows.map(parseFelgeSeasonMarker).filter(Boolean);
  APP.monthPayments=incomeRows.map(parseMonthPaymentMarker).filter(Boolean);
  APP.monthExemptions=incomeRows.map(parseMonthExemptionMarker).filter(Boolean);
  APP.penaltyCatalog=incomeRows.map(parsePenaltyCatalogMarker).filter(Boolean).sort((a,b)=>a.type.localeCompare(b.type,'de'));
  APP.gameCosts=incomeRows.map(parseGameCostMarker).filter(Boolean);
  APP.gameCostPlayerMeta=incomeRows.map(parseGameCostPlayerMetaMarker).filter(Boolean);
  APP.otherIncome=incomeRows.filter(i=>!parseRegistrationMarker(i)&&!parseSilentMemberMarker(i)&&!parseFelgeMarker(i)&&!parseFelgeSeasonMarker(i)&&!parseMonthPaymentMarker(i)&&!parseMonthExemptionMarker(i)&&!parsePenaltyCatalogMarker(i)&&!parseGameCostMarker(i)&&!parseGameCostPlayerMetaMarker(i));
  APP.otherExpenses=expRes.data||[];
  currentFelgeSeason = loadCurrentFelgeSeason();
}

function getMemberPM(mid) { return APP.paidMonths.filter(pm=>pm.member_id===mid); }
function getMemberPen(mid) { return APP.penalties.filter(p=>p.member_id===mid); }
function parseRegistrationMarker(row) {
  const desc = row?.description || '';
  if (!desc.startsWith(REGISTRATION_MARKER_PREFIX)) return null;
  const parts = desc.split('|');
  if (parts.length < 3) return null;
  return { id: row.id, season: parts[1], member_id: parts[2] };
}
function parseSilentMemberMarker(row) {
  const desc = row?.description || '';
  if (!desc.startsWith(SILENT_MEMBER_MARKER_PREFIX)) return null;
  const parts = desc.split('|');
  if (parts.length < 3) return null;
  return { id: row.id, season: parts[1], member_id: parts[2] };
}
// Felge-Eintrag: __FELGE__|<season>|<member_id>|<count>
function parseFelgeMarker(row) {
  const desc = row?.description || '';
  if (!desc.startsWith(FELGE_MARKER_PREFIX)) return null;
  const parts = desc.split('|');
  if (parts.length < 4) return null;
  return { id: row.id, season: parts[1], member_id: parts[2], count: parseInt(parts[3],10)||0 };
}
// Felge-Saison-Anlage (nur Marker, damit Saison in DB existiert): __FELGE_SEASON__|<season>
function parseFelgeSeasonMarker(row) {
  const desc = row?.description || '';
  if (!desc.startsWith(FELGE_SEASON_MARKER_PREFIX)) return null;
  const parts = desc.split('|');
  if (parts.length < 2) return null;
  return { id: row.id, season: parts[1] };
}
// Jahresbezogener Monatsbeitrag: __MONATSBEITRAG__|<jahr>|<member_id>|<monat 0-11>
// Die vorhandene paid_months-Tabelle bleibt unverändert und bildet das Bestandsjahr 2026 ab.
function parseMonthPaymentMarker(row) {
  const desc = row?.description || '';
  if (!desc.startsWith(MONTH_PAYMENT_MARKER_PREFIX)) return null;
  const parts = desc.split('|');
  if (parts.length < 4) return null;
  const year = parseInt(parts[1],10);
  const month_index = parseInt(parts[3],10);
  if (!Number.isInteger(year) || !Number.isInteger(month_index) || month_index < 0 || month_index > 11) return null;
  return { id: row.id, year, member_id: parts[2], month_index };
}
// Beitragsfreier Monat: __MONATSBEITRAG_FREI__|<jahr>|<member_id>|<monat 0-11>
function parseMonthExemptionMarker(row) {
  const desc = row?.description || '';
  if (!desc.startsWith(MONTH_EXEMPTION_MARKER_PREFIX)) return null;
  const parts = desc.split('|');
  if (parts.length < 4) return null;
  const year = parseInt(parts[1],10);
  const month_index = parseInt(parts[3],10);
  if (!Number.isInteger(year) || !Number.isInteger(month_index) || month_index < 0 || month_index > 11) return null;
  return { id: row.id, year, member_id: parts[2], month_index };
}
function parsePenaltyCatalogMarker(row) {
  const desc = row?.description || '';
  if (!desc.startsWith(PENALTY_CATALOG_MARKER_PREFIX)) return null;
  const parts = desc.split('|');
  if (parts.length < 3) return null;
  const amount = parseFloat(parts[2]);
  if (!Number.isFinite(amount) || amount <= 0) return null;
  try {
    return { id: row.id, type: decodeURIComponent(parts[1]), amount, date: row.date };
  } catch (_) { return null; }
}
function parseGameCostMarker(row) {
  const desc = row?.description || '';
  if (!desc.startsWith(GAME_COST_MARKER_PREFIX)) return null;
  try {
    const data = JSON.parse(decodeURIComponent(desc.slice(GAME_COST_MARKER_PREFIX.length)));
    if (!data?.sourceUrl || !data?.matchId || !Array.isArray(data.games)) return null;
    return {...data,id:row.id};
  } catch (_) { return null; }
}
function gameCostMarker(entry) {
  const stored={...entry}; delete stored.id;
  return GAME_COST_MARKER_PREFIX+encodeURIComponent(JSON.stringify(stored));
}
function parseGameCostPlayerMetaMarker(row) {
  const desc=row?.description||'';
  if (!desc.startsWith(GAME_COST_PLAYER_META_PREFIX)) return null;
  try {
    const data=JSON.parse(decodeURIComponent(desc.slice(GAME_COST_PLAYER_META_PREFIX.length)));
    if (!data?.league||!data?.matchId||!Array.isArray(data.players)) return null;
    return {...data,id:row.id};
  } catch (_) { return null; }
}
function gameCostPlayerMetaMarker(meta) {
  const stored={...meta}; delete stored.id;
  return GAME_COST_PLAYER_META_PREFIX+encodeURIComponent(JSON.stringify(stored));
}
function isGameCostGameSelected(entry,gameId) {
  return entry.selection?.[String(gameId)] !== false;
}
function getGameCostLeague(entry) {
  return entry?.league==='DKS'?'DKS':'DSAB';
}
function getActiveGameCostEntry(league=null) {
  if (league && gameCostDrafts[league]?.loading) return null;
  const entries=league?APP.gameCosts.filter(entry=>getGameCostLeague(entry)===league):APP.gameCosts;
  return [...entries].sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')))[0]||null;
}
function getActiveGameCostEntries() {
  return ['DSAB','DKS'].map(getActiveGameCostEntry).filter(Boolean);
}
function summarizeGameCosts(entries) {
  if (!entries) {
    entries=getActiveGameCostEntries();
  }
  const teams=new Map();
  for (const entry of entries) {
    for (const game of entry.games||[]) {
      if (!isGameCostGameSelected(entry,game.id)) continue;
      for (const [teamName,players] of [[entry.homeTeam,game.homePlayers],[entry.awayTeam,game.awayPlayers]]) {
        if (!teamName || !Array.isArray(players)) continue;
        const league=getGameCostLeague(entry), key=`${league}|${teamName}`;
        if (!teams.has(key)) teams.set(key,{name:teamName,league,players:new Map()});
        const team=teams.get(key).players;
        players.forEach(name=>team.set(name,(team.get(name)||0)+1));
      }
    }
  }
  const result=Array.from(teams.values(),team=>{
    const players=Array.from(team.players,([name,games])=>({name,games,cost:games})).sort((a,b)=>b.games-a.games||a.name.localeCompare(b.name,'de'));
    return {name:team.name,league:team.league,players,total:players.reduce((sum,p)=>sum+p.cost,0)};
  }).sort((a,b)=>a.league.localeCompare(b.league)||b.total-a.total||a.name.localeCompare(b.name,'de'));
  return {teams:result,total:result.reduce((sum,t)=>sum+t.total,0)};
}
function normalizePlayerName(value) {
  return String(value||'').trim().replace(/\s+/g,' ').toLocaleLowerCase('de');
}
function gameCostPlayerKey(team,name) {
  return `${String(team||'').trim()}\u001f${normalizePlayerName(name)}`;
}
function findMemberForGameCostPlayer(name) {
  const normalized=normalizePlayerName(name);
  return APP.members.find(member=>normalizePlayerName(member.name)===normalized)||null;
}
function getGameCostPlayerMeta(entry) {
  const league=getGameCostLeague(entry);

function bytesToBase64Url(bytes) {
  let binary='';
  for (let i=0;i<bytes.length;i+=8192) binary+=String.fromCharCode(...bytes.subarray(i,i+8192));
  return btoa(binary).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
function base64UrlToBytes(value) {
  const base64=value.replace(/-/g,'+').replace(/_/g,'/').padEnd(Math.ceil(value.length/4)*4,'=');
  const binary=atob(base64), bytes=new Uint8Array(binary.length);
  for (let i=0;i<binary.length;i++) bytes[i]=binary.charCodeAt(i);
  return bytes;
}
async function encodeGameCostShare(payload) {
  const bytes=new TextEncoder().encode(JSON.stringify(payload));
  if (typeof CompressionStream==='undefined') return 'j'+bytesToBase64Url(bytes);
  const stream=new Blob([bytes]).stream().pipeThrough(new CompressionStream('gzip'));
  return 'z'+bytesToBase64Url(new Uint8Array(await new Response(stream).arrayBuffer()));
}
async function decodeGameCostShare(value) {
  if (!value||value.length<2) throw new Error('Freigabelink ist ungültig.');
  let bytes=base64UrlToBytes(value.slice(1));
  if (value[0]==='z') {
    if (typeof DecompressionStream==='undefined') throw new Error('Dieser Browser unterstützt den Freigabelink nicht.');
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    bytes=new Uint8Array(await new Response(stream).arrayBuffer());
  } else if (value[0]!=='j') throw new Error('Freigabelink ist ungültig.');
  const payload=JSON.parse(new TextDecoder().decode(bytes));
  if (payload?.v!==1||!payload?.entry||!Array.isArray(payload.entry.games)) throw new Error('Freigabelink ist ungültig.');
  return payload;
}

function parseThreeKSourceUrl(value) {
  let url;
  try { url=new URL(String(value||'').trim()); } catch (_) { throw new Error('Bitte einen gültigen 3K-Link eingeben.'); }
  if (url.protocol!=='https:' || url.hostname!=='portal.3k-darts.com') throw new Error('Es sind nur Links von portal.3k-darts.com erlaubt.');
  const match=url.pathname.match(/^\/frontend\/events\/(\d+)\/event\/(\d+)\/phase\/(\d+)\/group\/(\d+)\/?$/);
  if (!match) throw new Error('Der Link muss zu einem 3K-Spieltag führen.');
  return {sourceUrl:url.origin+url.pathname.replace(/\/$/,''),dbId:parseInt(match[1],10),eventId:parseInt(match[2],10),phaseId:parseInt(match[3],10),roundId:parseInt(match[4],10)};
}
async function fetchThreeKJson(url,allowMissing=false) {
  const response=await fetch(url,{headers:{Accept:'application/json'}});
  if (allowMissing && (response.status===404||response.status===204)) return [];
  if (!response.ok) throw new Error(`3K-Daten konnten nicht geladen werden (${response.status}).`);
  return response.json();
}
function splitThreeKPlayers(value) {
  return String(value||'').split(/\s*&\s*/).map(name=>name.trim()).filter(Boolean);
}
async function fetchThreeKRound(sourceUrl,league) {
  const source=parseThreeKSourceUrl(sourceUrl);
  const apiBase=THREE_K_API_BASES[source.dbId];
  if (!apiBase) throw new Error(`Die 3K-Datenbank ${source.dbId} wird noch nicht unterstützt.`);
  const round=await fetchThreeKJson(`${apiBase}/event/${source.eventId}/phase/${source.phaseId}/round/${source.roundId}`);
  return {source,round,apiBase};
}
function getThreeKRoundTeams(round) {
  const teams=new Set();
  (round.matches||[]).forEach(match=>{
    const home=String(match.participantHome?.displayName||'').trim();
    const away=String(match.participantGuest?.displayName||'').trim();
    if (home) teams.add(home); if (away) teams.add(away);
  });
  return Array.from(teams).sort((a,b)=>a.localeCompare(b,'de'));
}
async function fetchGameCostSource(sourceUrl,existing=null,selectedTeam=existing?.selectedTeam,league=existing?.league) {
  const {source,round,apiBase}=await fetchThreeKRound(sourceUrl,league);

  const target=String(selectedTeam).trim().toLocaleLowerCase('de');
  const matches=(round.matches||[]).filter(match=>{
    const home=String(match.participantHome?.displayName||'').trim().toLocaleLowerCase('de');
    const away=String(match.participantGuest?.displayName||'').trim().toLocaleLowerCase('de');
    return home===target||away===target;
  });
  if (matches.length===0) throw new Error(`In diesem Spieltag wurde keine Begegnung von ${selectedTeam} gefunden.`);
  const match=matches[0];
  let report=[];
  try { report=await fetchThreeKJson(`${apiBase}/event/${source.eventId}/match/${match.id}/report`,true); } catch (error) {
    if (!existing?.games?.length) throw error;

    const homePlayers=splitThreeKPlayers(game.participantHome?.displayName);
    const awayPlayers=splitThreeKPlayers(game.participantGuest?.displayName);
    if (!homePlayers.length||!awayPlayers.length) return null;

  }).filter(Boolean);

    matchDate:match.datePlanned||match.endDate||'',status:match.statusCd||'',
    matchResult:Number.isFinite(match.setsHome)&&Number.isFinite(match.setsAway)?`${match.setsHome}-${match.setsAway}`:'Noch kein Ergebnis',
    legsResult:Number.isFinite(match.legsHome)&&Number.isFinite(match.legsAway)?`${match.legsHome}-${match.legsAway}`:'',
    games,selection,updatedAt:new Date().toISOString()

  let total = parseInt((APP.members.find(x=>String(x.id)===String(memberId))||{}).felge_count||0,10)||0;
  (APP.felgeEntries||[]).forEach(r=>{
    if (String(r.member_id)===String(memberId)) total += parseInt(r.count||0,10)||0;
  });
  (APP.gameCostPlayerMeta||[]).forEach(meta=>{
    (meta.players||[]).forEach(player=>{
      const resolved=player.memberId||findMemberForGameCostPlayer(player.name)?.id;
      if (String(resolved)===String(memberId)) total+=Math.max(0,parseInt(player.felges,10)||0);
    });
  });
  return total;
}

function renderBirthdaysView() {
  if (APP.members.length===0) return '<div class="card"><p style="color:var(--text3);text-align:center;padding:40px">Noch keine Mitglieder</p></div>';
  const mwb = APP.members.filter(m=>m.birthday).map(m=>{
    const bd=new Date(m.birthday); const today=new Date(); today.setHours(0,0,0,0);
    const next=new Date(today.getFullYear(),bd.getMonth(),bd.getDate());
    if (next<today) next.setFullYear(next.getFullYear()+1);
    return {...m, days: Math.ceil((next-today)/(1000*60*60*24))};
  }).sort((a,b)=>a.days-b.days);
  if (mwb.length===0) return '<div class="card"><p style="color:var(--text3);text-align:center;padding:40px">Keine Geburtstage</p></div>';
  let html='<div class="card"><div class="card-title"><div class="icon">&#127874;</div> Geburtstage</div>';
  mwb.forEach((m,idx)=>{
    const isT=m.days===0, isW=m.days<=7;
    const age=new Date().getFullYear()-new Date(m.birthday).getFullYear();
    let bc='var(--red)',bbg='rgba(255,23,68,.15)',bt=`in ${m.days} Tagen`;
    if(isT){bc='var(--green)';bbg='rgba(0,230,118,.2)';bt='&#127881; HEUTE!';}
    else if(isW){bc='var(--accent3)';bbg='rgba(255,170,0,.15)';bt=`in ${m.days} ${m.days===1?'Tag':'Tagen'}`;}
    html+=`<div style="background:var(--bg3);border:${isT?'2px':isW?'2px':'1px'} solid ${bc};border-radius:var(--radius);padding:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center">
      <div><div style="font-family:'Oswald';font-size:1.2rem;font-weight:600${isT?';color:var(--green)':''}">${esc(m.name)}</div>
      <div style="font-size:.85rem;color:var(--text2);margin-top:4px">${fmtDate(m.birthday)} (${age} Jahre)</div></div>
      <div style="font-family:'Oswald';font-size:1.4rem;font-weight:700;color:${bc};padding:4px 12px;background:${bbg};border-radius:var(--radius)">${bt}</div></div>`;
  });
  return html+'</div>';
}

function renderFelgeKing() {
  if (APP.members.length===0) return '<div class="card"><p style="color:var(--text3);text-align:center;padding:40px">Noch keine Mitglieder</p></div>';
  const FC = parseFloat(APP.team.felge_cost);
  const admin = isTeamAdmin();
  const season = currentFelgeSeason;
  const seasonList = felgeAvailableSeasons();
  const seasonOptions = seasonList.map(s=>`<option value="${esc(s)}" ${s===season?'selected':''}>${esc(s)}</option>`).join('');
  const isSeason1 = season === 'Saison 1';

  const enriched = APP.members.map(m=>({m, fc: getFelgeCountForMember(m.id, season)}));
  const sorted = [...enriched].sort((a,b)=>b.fc-a.fc);

  let html = `<div class="card">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px">
      <div>
        <div class="card-title" style="margin-bottom:8px"><div class="icon">&#128081;</div> Felgenkönig</div>
        <h2 style="font-size:1.6rem;color:var(--accent);margin-bottom:4px">${esc(season)}</h2>
        <p style="color:var(--text2);font-size:.88rem">${isSeason1?'Bestandsdaten aus Saison 1 (nur einsehbar).':'Felgen pro Spieler in dieser Saison.'}</p>
      </div>
      <div style="display:flex;gap:8px;align-items:end;flex-wrap:wrap">
        <div class="form-group" style="min-width:170px;flex:0">
          <label>Saison wählen</label>
          <select id="felge-season-select" onchange="setFelgeSeason(this.value)">${seasonOptions}</select>
        </div>
        ${admin?`<div class="form-group" style="min-width:150px;flex:0">
          <label>Neue Saison starten</label>
          <div style="display:flex;gap:6px">
            <input type="text" id="felge-new-season" placeholder="z.B. Saison 3">
            <button class="btn btn-primary btn-sm" onclick="addFelgeSeason()">+</button>
          </div>
        </div>`:''}
      </div>
    </div>`;

  if (admin && !isSeason1) {
    html += `<div class="card-title" style="margin-top:8px"><div class="icon">&#9998;</div> Felgen eintragen (${esc(season)})</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;margin-bottom:20px">`;
    APP.members.forEach(m=>{
      const val = getFelgeCountForMember(m.id, season);
      html += `<div style="background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;gap:10px">
        <div style="flex:1;font-family:'Oswald';font-size:1rem">${esc(m.name)}</div>
        <input type="number" min="0" value="${val}" id="felge-input-${m.id}" style="width:80px;text-align:center">
        <button class="btn btn-primary btn-sm" onclick="saveFelgeInput(${m.id})">OK</button>
      </div>`;
    });
    html += `</div>`;
  } else if (admin && isSeason1) {
    html += `<div style="background:var(--bg3);border:1px dashed var(--bg4);border-radius:var(--radius);padding:12px;margin-bottom:20px;font-size:.85rem;color:var(--text2)">
      Saison 1 zeigt den Bestand aus der Mitglieder-Tabelle. Für neue Einträge oben eine andere Saison auswählen oder eine neue Saison starten.
    </div>`;
  }

  html += `<div class="felge-ranking">`;
  sorted.forEach((row,i)=>{
    const m=row.m, fc=row.fc, fv=fc*FC;
    const r=i+1;
    let rc='',rcc='';
    if(r===1){rc='rank-1';rcc='gold';}else if(r===2){rc='rank-2';rcc='silver';}else if(r===3){rc='rank-3';rcc='bronze';}
    const medal = r===1?'&#129351;':r===2?'&#129352;':r===3?'&#129353;':'';
    html+=`<div class="felge-entry ${rc}"><div class="felge-rank ${rcc}">${medal||'#'+r}</div>
      <div class="felge-info"><div class="felge-name">${esc(m.name)}</div><div class="felge-count">${fc} Felgen</div></div>
      <div class="felge-value">${fv.toFixed(2)} €</div></div>`;
  });
  html += `</div></div>`;
  return html;
}

function setFelgeSeason(s){
  currentFelgeSeason = s;
  saveCurrentFelgeSeason(s);
  renderTeamView();
}
async function addFelgeSeason(){
  const inp = document.getElementById('felge-new-season');
  if (!inp) return;
  let raw = (inp.value||'').trim();
  if (!raw) { alert('Bitte Namen für die neue Saison eingeben (z.B. "Saison 3").'); return; }
  if (/^\d+$/.test(raw)) raw = 'Saison '+raw;
  if (!/^Saison\s+\d+$/i.test(raw)) {
    if (!confirm('Der Name entspricht nicht dem Muster "Saison X". Trotzdem anlegen?')) return;
  }
  await ensureFelgeSeasonExists(raw);
  currentFelgeSeason = raw;
  saveCurrentFelgeSeason(raw);
  await loadTeamData(); renderTeamView();
}
async function saveFelgeInput(memberId){
  const el = document.getElementById('felge-input-'+memberId);
  if (!el) return;
  const v = parseInt(el.value,10)||0;
  await ensureFelgeSeasonExists(currentFelgeSeason);
  await setFelgeCountForMember(memberId, currentFelgeSeason, v);
  await loadTeamData(); renderTeamView();
}

async function createAnnouncement() {
  const title = document.getElementById('ann-title').value.trim();

}

async function replaceGameCostPlayerMeta(entry,meta) {
  const league=getGameCostLeague(entry);
  const existingRows=(APP.gameCostPlayerMeta||[]).filter(item=>item.league===league&&String(item.matchId)===String(entry.matchId));
  for (const existing of existingRows) {
    const {error}=await sb.from('other_income').delete().eq('id',existing.id).eq('team_id',APP.team.id);
    if (error) throw new Error(error.message);
  }
  const values={team_id:APP.team.id,description:gameCostPlayerMetaMarker(meta),amount:0,date:String(entry.matchDate||new Date().toISOString()).slice(0,10)};
  const {error}=await sb.from('other_income').insert(values);
  if (error) throw new Error(error.message);
}
async function toggleGameCostPlayerPaid(entryId,encodedTeam,encodedName) {
  if (!isTeamAdmin()) return;
  const entry=APP.gameCosts.find(item=>String(item.id)===String(entryId));
  if (!entry) return;
  const team=decodeURIComponent(encodedTeam), name=decodeURIComponent(encodedName);
  const rows=getGameCostPlayerRows(entry);
  const target=rows.find(row=>gameCostPlayerKey(row.team,row.name)===gameCostPlayerKey(team,name));
  if (!target) return;
  target.paid=!target.paid;
  const current=getGameCostPlayerMeta(entry);
  const meta={league:getGameCostLeague(entry),matchId:String(entry.matchId),roundName:entry.roundName||'',
    felgeSeason:current?.felgeSeason||currentFelgeSeason||'Saison 1',
    players:rows.map(row=>({team:row.team,name:row.name,memberId:row.memberId||null,paid:row.paid,felges:row.felges})),updatedAt:new Date().toISOString()};
  try {
    await replaceGameCostPlayerMeta(entry,meta);
    await loadTeamData(); renderTeamView();
  } catch (error) { alert('Fehler beim Speichern: '+error.message); }
}
async function saveGameCostPlayerAccounting(entryId) {
  if (!isTeamAdmin()) return;
  const entry=APP.gameCosts.find(item=>String(item.id)===String(entryId));
  const editor=document.getElementById('game-cost-player-editor-'+entryId);
  if (!entry||!editor) return;
  const players=[...editor.querySelectorAll('.game-cost-player-edit')].map(row=>({
    team:row.dataset.team||'',name:row.dataset.name||'',
    memberId:row.querySelector('.game-player-member')?.value||null,

  }));

    felgeSeason:editor.querySelector('.game-player-season')?.value||currentFelgeSeason||'Saison 1',players,updatedAt:new Date().toISOString()};
  try {
    await replaceGameCostPlayerMeta(entry,meta);
    gameCostEditEntryId=null;
    await loadTeamData(); renderTeamView();
  } catch (error) { alert('Fehler beim Speichern: '+error.message); }
}

function switchTab(t) {
  currentTab=t;
  ['tab-kader','tab-registration','tab-birthdays','tab-felgeking','tab-penalties','tab-penaltycatalog','tab-gamecosts'].forEach(id=>{const el=document.getElementById(id);if(el)el.style.display=id==='tab-'+t?'':'none';});
  document.querySelectorAll('.tabs .tab').forEach(tb=>tb.classList.remove('active'));
  const at=document.querySelector(`.tabs .tab[onclick*="${t}"]`);if(at)at.classList.add('active');
  document.querySelector('.member-stats')?.classList.toggle('privacy-mode',t==='gamecosts');
}

// DATA ACTIONS
async function deleteMember(id) { if(!confirm('Mitglied löschen?'))return; await sb.from('members').delete().eq('id',id); await loadTeamData(); renderTeamView(); }
function setKaderYear(year) {
  const parsed = parseInt(year,10);
  if (!Number.isInteger(parsed) || parsed < 2026 || parsed > 2099) return;
  currentKaderYear = parsed;
  renderTeamView();
}
async function togglePM(mid,mi,year=currentKaderYear) {
  const paid = year === 2026
    ? APP.paidMonths.find(pm=>String(pm.member_id)===String(mid)&&pm.month_index===mi)
    : APP.monthPayments.find(pm=>pm.year===year&&String(pm.member_id)===String(mid)&&pm.month_index===mi);
  const exempt = APP.monthExemptions.find(pm=>pm.year===year&&String(pm.member_id)===String(mid)&&pm.month_index===mi);
  let error = null;

  if (paid) {
    // Bezahlt -> beitragsfrei
    const deleteResult = year === 2026
      ? await sb.from('paid_months').delete().eq('id',paid.id)
      : await sb.from('other_income').delete().eq('id',paid.id);
    if (deleteResult.error) error = deleteResult.error;
    if (!error) {
      const marker = `${MONTH_EXEMPTION_MARKER_PREFIX}${year}|${mid}|${mi}`;
      const date = `${year}-${String(mi+1).padStart(2,'0')}-01`;
      const result = await sb.from('other_income').insert({team_id:APP.team.id,description:marker,amount:0,date});
      error = result.error;
    }
  } else if (exempt) {
    // Beitragsfrei -> offen
    const result = await sb.from('other_income').delete().eq('id',exempt.id);
    error = result.error;
  } else {
    // Offen -> bezahlt
    if (year === 2026) {
      const result = await sb.from('paid_months').insert({member_id:mid,month_index:mi});
      error = result.error;
    } else {
      const marker = `${MONTH_PAYMENT_MARKER_PREFIX}${year}|${mid}|${mi}`;
      const date = `${year}-${String(mi+1).padStart(2,'0')}-01`;
      const result = await sb.from('other_income').insert({team_id:APP.team.id,description:marker,amount:0,date});
      error = result.error;
    }
  }
  if (error) { alert('Fehler beim Speichern: '+error.message); }
  await loadTeamData(); renderTeamView();
}

async function stopPendingGameCostRefresh() {
  gameCostsRefreshToken++;
  while (gameCostsRefreshInProgress) await new Promise(resolve=>setTimeout(resolve,25));
}
async function persistGameCostEntry(entry) {
  const date=String(entry.matchDate||new Date().toISOString()).slice(0,10);
  const values={team_id:APP.team.id,description:gameCostMarker(entry),amount:0,date};
  if (entry.id) return sb.from('other_income').update({description:values.description,date}).eq('id',entry.id).eq('team_id',APP.team.id);
  return sb.from('other_income').insert(values);
}
async function replaceGameCostLeague(league,sourceUrl,selectedTeam) {
  if (!['DKS','DSAB'].includes(league)) throw new Error('Bitte DKS oder DSAB auswählen.');
  if (!selectedTeam) throw new Error('Bitte zuerst die Mannschaften laden und die eigene Mannschaft auswählen.');
  const source=parseThreeKSourceUrl(sourceUrl);
  const previousEntries=APP.gameCosts.filter(item=>getGameCostLeague(item)===league);
  const active=[...previousEntries].sort((a,b)=>String(b.updatedAt||'').localeCompare(String(a.updatedAt||'')))[0]||null;
  const sameSource=active&&active.eventId===source.eventId&&active.roundId===source.roundId;
  const actionToken=++gameCostActionTokens[league];

  // Eine laufende automatische Aktualisierung darf den manuell gewählten Link nicht zurücksetzen.
  gameCostsRefreshToken++;
  gameCostDrafts[league]={
    sourceUrl:source.sourceUrl,
    selectedTeam,
    availableTeams:active?.availableTeams?.length?active.availableTeams:[...new Set([active?.homeTeam,active?.awayTeam].filter(Boolean))],
    loading:true
  };

  // Den alten Spieltag sofort aus der sichtbaren Auflistung nehmen.
  APP.gameCosts=APP.gameCosts.filter(item=>getGameCostLeague(item)!==league);
  renderTeamView();

  try {
    const fresh=await fetchGameCostSource(source.sourceUrl,sameSource?active:null,selectedTeam,league);
    if (actionToken!==gameCostActionTokens[league]) return;

    // Zuerst den neuen Datensatz anlegen. Erst wenn das geklappt hat, werden die alten gelöscht.
    const date=String(fresh.matchDate||new Date().toISOString()).slice(0,10);
    const values={team_id:APP.team.id,description:gameCostMarker(fresh),amount:0,date};
    const {data,error}=await sb.from('other_income').insert(values).select('id').single();
    if (error) throw new Error(error.message);
    fresh.id=data?.id;

    if (actionToken!==gameCostActionTokens[league]) {
      if (fresh.id) await sb.from('other_income').delete().eq('id',fresh.id).eq('team_id',APP.team.id);
      return;
    }
    for (const old of previousEntries) {
      const {error:deleteError}=await sb.from('other_income').delete().eq('id',old.id).eq('team_id',APP.team.id);
      if (deleteError) console.warn('Alter Spielkosten-Eintrag konnte nicht entfernt werden:',deleteError);
    }
    await loadTeamData();
    if (actionToken!==gameCostActionTokens[league]) return;
    gameCostDrafts[league]=null;
    renderTeamView();
  } catch (error) {
    if (actionToken!==gameCostActionTokens[league]) return;
    gameCostDrafts[league]=null;
    await loadTeamData();
    renderTeamView();
    throw error;
  }
}
async function loadGameCostTeams(league) {
  if (!isTeamAdmin()) return;
  const key=String(league||'').toLowerCase();
  const input=document.getElementById('game-cost-url-'+key);
  const select=document.getElementById('game-cost-team-'+key);
  const button=document.getElementById('game-cost-teams-btn-'+key);
  const message=document.getElementById('game-cost-setup-msg-'+key);
  if (!['DKS','DSAB'].includes(league)) { alert('Bitte zuerst DKS oder DSAB auswählen.'); return; }
  if (!input||!select) return;
  const oldText=button?.textContent;
  if (button) { button.disabled=true; button.textContent='Wird geladen…'; }
  if (message) message.innerHTML='';
  try {
    const {round}=await fetchThreeKRound(input.value,league);
    const teams=getThreeKRoundTeams(round);
    if (!teams.length) throw new Error('In diesem Link wurden keine Mannschaften gefunden.');
    const previous=getActiveGameCostEntry(league)?.selectedTeam||'';
    select.innerHTML='';
    select.appendChild(new Option('Mannschaft wählen',''));
    teams.forEach(team=>select.appendChild(new Option(team,team,team===previous,team===previous)));
    select.disabled=false;
    if (message) message.innerHTML=`<div class="success-msg" style="margin-top:10px">${teams.length} Mannschaften gefunden. Bitte die eigene Mannschaft auswählen.</div>`;
  } catch (error) {
    if (message) message.innerHTML=`<div class="error-msg" style="margin-top:10px">${esc(error.message||'Mannschaften konnten nicht geladen werden.')}</div>`;
  } finally {
    if (button?.isConnected) { button.disabled=false; button.textContent=oldText; }
  }
}
async function shiftGameCostRound(league,delta) {
  if (!isTeamAdmin()) return;
  const key=String(league||'').toLowerCase();
  const input=document.getElementById('game-cost-url-'+key);
  if (!input) return;
  try {
    const source=parseThreeKSourceUrl(input.value);
    const nextRound=source.roundId+parseInt(delta,10);
    if (!Number.isInteger(nextRound)||nextRound<1) throw new Error('Dieser Spieltag ist nicht gültig.');
    const url=new URL(source.sourceUrl);
    url.pathname=url.pathname.replace(/\/group\/\d+\/?$/,`/group/${nextRound}`);
    const nextUrl=url.toString().replace(/\/$/,'');
    const selectedTeam=document.getElementById('game-cost-team-'+key)?.value;
    input.value=nextUrl;
    await replaceGameCostLeague(league,nextUrl,selectedTeam);
  } catch (error) {
    alert(error.message||'Der Spieltag konnte nicht gewechselt werden.');
  }
}
async function importGameCostUrl(league) {
  if (!isTeamAdmin()) { alert('Nur Admins dürfen 3K-Spieltermine importieren.'); return; }
  const key=String(league||'').toLowerCase();
  const input=document.getElementById('game-cost-url-'+key);
  if (!input) return;
  try {
    const selectedTeam=document.getElementById('game-cost-team-'+key)?.value;
    await replaceGameCostLeague(league,input.value,selectedTeam);
  } catch (error) {
    alert(error.message||'Die 3K-Daten konnten nicht übernommen werden.');
  }
}
async function refreshGameCostEntry(id) {
  if (!isTeamAdmin()) return;
  await stopPendingGameCostRefresh();
  const entry=APP.gameCosts.find(item=>String(item.id)===String(id));
  if (!entry) return;
  try {
    const league=getGameCostLeague(entry), key=league.toLowerCase();
    const visibleLink=document.getElementById('game-cost-url-'+key)?.value||entry.sourceUrl;
    const selectedTeam=document.getElementById('game-cost-team-'+key)?.value||entry.selectedTeam;
    const source=parseThreeKSourceUrl(visibleLink);
    const sameSource=entry.eventId===source.eventId&&entry.roundId===source.roundId;
    const fresh=await fetchGameCostSource(source.sourceUrl,sameSource?entry:null,selectedTeam,league); fresh.id=entry.id;
    const {error}=await persistGameCostEntry(fresh);
    if (error) throw new Error(error.message);
    await loadTeamData(); renderTeamView();
  } catch (error) { alert(error.message||'Aktualisierung fehlgeschlagen.'); }
}
async function toggleGameCostGame(entryId,gameId,selected) {
  if (!isTeamAdmin()) return;
  await stopPendingGameCostRefresh();
  const entry=APP.gameCosts.find(item=>String(item.id)===String(entryId));
  if (!entry) return;
  const key=String(gameId), previous=entry.selection?.[key]!==false;
  entry.selection={...(entry.selection||{}),[key]:Boolean(selected)};
  const {error}=await persistGameCostEntry(entry);
  if (error) { entry.selection[key]=previous; alert('Fehler beim Speichern: '+error.message); }
  renderTeamView();
}
async function setAllGameCostGames(entryId,selected) {
  if (!isTeamAdmin()) return;
  await stopPendingGameCostRefresh();
  const entry=APP.gameCosts.find(item=>String(item.id)===String(entryId));
  if (!entry) return;
  const previous={...(entry.selection||{})};
  entry.selection={}; (entry.games||[]).forEach(game=>{entry.selection[String(game.id)]=Boolean(selected);});
  const {error}=await persistGameCostEntry(entry);
  if (error) { entry.selection=previous; alert('Fehler beim Speichern: '+error.message); }
  renderTeamView();
}
async function deleteGameCostEntry(id) {
  if (!isTeamAdmin()) return;
  await stopPendingGameCostRefresh();
  if (!confirm('Diesen 3K-Spieltag aus den Spielkosten entfernen?')) return;
  const {error}=await sb.from('other_income').delete().eq('id',id).eq('team_id',APP.team.id);
  if (error) { alert('Fehler beim Löschen: '+error.message); return; }
  await loadTeamData(); renderTeamView();
}
async function autoRefreshGameCosts() {
  const teamId=APP.team?.id;
  if (!teamId||gameCostsRefreshTeamId===teamId) return;
  gameCostsRefreshTeamId=teamId;
  const activeEntries=getActiveGameCostEntries();
  if (!activeEntries.length) return;
  const refreshToken=++gameCostsRefreshToken;
  gameCostsRefreshInProgress=true;
  try {
    let changed=false;
    for (const entry of activeEntries) {
      try {
        const fresh=await fetchGameCostSource(entry.sourceUrl,entry); fresh.id=entry.id;
        if (refreshToken!==gameCostsRefreshToken) return;
        if (isTeamAdmin()) {
          const {error}=await persistGameCostEntry(fresh);
          if (error) throw error;
          if (refreshToken!==gameCostsRefreshToken) return;
          for (const old of APP.gameCosts.filter(item=>getGameCostLeague(item)===getGameCostLeague(entry)&&String(item.id)!==String(entry.id))) {
            const {error:deleteError}=await sb.from('other_income').delete().eq('id',old.id).eq('team_id',APP.team.id);
            if (deleteError) console.warn('Alter Spielkosten-Eintrag konnte nicht entfernt werden:',deleteError);
          }
        } else {
          const index=APP.gameCosts.findIndex(item=>String(item.id)===String(entry.id));
          if (index>=0) APP.gameCosts[index]=fresh;
        }
        changed=true;
      } catch (error) { console.warn('3K-Aktualisierung fehlgeschlagen:',error); }
    }
    if (refreshToken!==gameCostsRefreshToken) return;
    if (changed&&isTeamAdmin()) await loadTeamData();
    if (refreshToken===gameCostsRefreshToken&&changed) renderTeamView();
  } finally {
    gameCostsRefreshInProgress=false;
  }
}
async function deletePenalty(id) {
  if (!isTeamAdmin()) { alert('Nur Admins dürfen Strafen löschen.'); return; }
  if(!confirm('Strafe löschen?')) return;
  const penalty=APP.penalties.find(p=>String(p.id)===String(id));
  if (!penalty) return;

  await loadTeamData(); renderTeamView();
}

async function saveMember(id) {

    <div style="margin-bottom:20px"><label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Monatsbeitrag (€)</label><input type="number" id="set-monthly" value="${parseFloat(APP.team.monthly_fee).toFixed(2)}" step="0.01" min="0"></div>
    <div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn btn-ghost" onclick="document.getElementById('modal').remove()">Abbrechen</button><button class="btn btn-primary" onclick="saveSettings()">Speichern</button></div></div>`;

}
async function saveSettings() {

// INIT
async function init() {
  if (guestShareMode) {
    document.getElementById('login-screen').style.display='none';
    try {
      renderGuestGameCosts(await decodeGameCostShare(guestShareEncoded));
    } catch (error) {
      const main=document.getElementById('screen-main'); main.classList.add('active');
      main.innerHTML=`<div class="guest-shell"><div class="error-msg">${esc(error.message||'Die Gegneransicht konnte nicht geöffnet werden.')}</div></div>`;
    }
    return;
  }
  renderLogin();
  try {
    const sessionPromise = sb.auth.getSession();
    const timeoutPromise = new Promise((_, reject) => setTimeout(() => reject(new Error('timeout')), 8000));
    const {data} = await Promise.race([sessionPromise, timeoutPromise]);
    const session = data?.session;

    if (session?.user) {
      const lastActive = parseInt(localStorage.getItem('dartpro_last_active') || '0');
      const now = Date.now();
      const withinGracePeriod = (now - lastActive) < SESSION_TIMEOUT;

      if (withinGracePeriod) {
        APP.user = session.user;
        await loadProfile();
      } else {
        localStorage.removeItem('sb-dartpro-auth');
        localStorage.removeItem('dartpro_last_active');
        renderLogin();
      }
    } else {
      renderLogin();
    }
  } catch(err) {
    console.error('Init error:', err);
    localStorage.removeItem('sb-dartpro-auth');
    localStorage.removeItem('dartpro_last_active');
    renderLogin();
  }
}

let initDone = false;
sb.auth.onAuthStateChange(async (ev, session) => {
  if (guestShareMode) return;
  if (ev === 'INITIAL_SESSION') return;
  if (ev === 'SIGNED_IN' && session?.user && APP.user === null) {
    if (!initDone) { initDone = true; APP.user = session.user; await loadProfile(); }
  } else if (ev === 'SIGNED_OUT' && !sessionExpired) {
    APP.user=null; APP.profile=null; APP.team=null;
    if (inactivityTimer) clearTimeout(inactivityTimer);
    if (warningTimer) clearTimeout(warningTimer);
    localStorage.removeItem('dartpro_last_active');
    renderLogin();
  } else if (ev === 'TOKEN_REFRESHED' && session?.user) {
    updateActivity();
  }
});

document.getElementById('login-btn').addEventListener('click',handleLogin);
document.getElementById('toggle-login-link').addEventListener('click',toggleLogin);
document.getElementById('login-password').addEventListener('keypress',e=>{if(e.key==='Enter')handleLogin();});
