<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DartPro - Team & Kasse</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a28;--bg4:#222236;
  --accent:#00e5ff;--accent2:#ff3d71;--accent3:#ffaa00;--green:#00e676;--red:#ff1744;
  --text:#e8e8f0;--text2:#9898b0;--text3:#5a5a78;
  --radius:8px;--radius2:12px;
}
html{font-size:15px}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1,h2,h3,h4{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em}
button{font-family:'Barlow',sans-serif;cursor:pointer;border:none;outline:none;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
input,select{font-family:'Barlow',sans-serif;outline:none}
.app{max-width:1400px;margin:0 auto;padding:20px}
.screen{display:none}
.screen.active{display:block}

.header{text-align:center;padding:30px 0 20px;position:relative}
.header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.logo{font-family:'Oswald',sans-serif;font-size:2.8rem;font-weight:700;letter-spacing:.08em;background:linear-gradient(135deg,var(--accent),#7c4dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo span{font-weight:300;font-size:1.4rem;display:block;letter-spacing:.2em;-webkit-text-fill-color:var(--text2);margin-top:2px}

.card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius2);padding:24px;margin-bottom:16px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.card-title{font-size:1.1rem;color:var(--accent);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title .icon{width:28px;height:28px;background:var(--bg3);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1rem}

.form-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;align-items:end}
.form-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
input,select{background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px 12px;border-radius:6px;font-size:.95rem;width:100%}
input:focus,select:focus{border-color:var(--accent)}

.btn{padding:10px 20px;border-radius:6px;font-size:.95rem;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#0099cc);color:#000}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:var(--bg3);color:var(--text);border:1px solid var(--bg4)}
.btn-ghost:hover{background:var(--bg4)}
.btn-success{background:var(--green);color:#000}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:6px 12px;font-size:.8rem}

.member-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:16px;text-align:center}
.stat-card.highlight{border-color:var(--accent);box-shadow:0 0 20px rgba(0,229,255,.15)}
.stat-label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.stat-value{font-family:'Oswald';font-size:1.8rem;font-weight:600;color:var(--accent)}

.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--bg4);padding-bottom:4px;flex-wrap:wrap}
.tab{padding:10px 20px;background:transparent;color:var(--text2);border:none;border-bottom:2px solid transparent;margin-bottom:-6px;transition:all .2s;font-size:.9rem}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.edit-btn{background:transparent;border:1px solid var(--bg4);color:var(--text2);padding:4px 8px;border-radius:4px;font-size:.85rem;cursor:pointer}
.edit-btn:hover{background:var(--bg3);color:var(--accent);border-color:var(--accent)}

/* LOGIN SCREEN */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}
.login-box{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius2);padding:40px;max-width:420px;width:100%;text-align:center;position:relative;overflow:hidden}
.login-box::before{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--accent),#7c4dff,var(--accent2))}
.login-box .logo{font-size:2.4rem;margin-bottom:8px}
.login-box .logo span{-webkit-text-fill-color:var(--text2)}
.login-subtitle{color:var(--text2);margin-bottom:30px;font-size:.9rem}
.login-box .form-group{text-align:left;margin-bottom:16px}
.login-box .btn{width:100%;margin-top:8px}
.login-error{color:var(--red);font-size:.85rem;margin-top:12px;display:none}

/* TOP NAV */
.top-nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;padding:12px 0;border-bottom:1px solid var(--bg4);flex-wrap:wrap;gap:12px}
.top-nav-left{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top-nav-right{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.user-badge{background:var(--bg3);padding:6px 14px;border-radius:20px;font-size:.82rem;color:var(--text2);display:flex;align-items:center;gap:8px}
.role-tag{padding:2px 8px;border-radius:10px;font-size:.75rem;font-weight:600}
.role-tag.superadmin{background:rgba(255,61,113,.15);color:var(--accent2)}
.role-tag.captain{background:rgba(255,170,0,.15);color:var(--accent3)}
.role-tag.viewer{background:rgba(0,229,255,.15);color:var(--accent)}

.team-selector{background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:8px 12px;border-radius:6px;font-size:.9rem;font-family:'Barlow',sans-serif}

.user-table{width:100%;border-collapse:collapse}
.user-table th{padding:10px;text-align:left;font-size:.75rem;color:var(--text2);background:var(--bg3);border-bottom:1px solid var(--bg4)}
.user-table td{padding:12px;border-bottom:1px solid var(--bg4);font-size:.9rem}

@media(max-width:768px){
  .form-row{flex-direction:column}
  .form-group{min-width:100%}
  .top-nav{flex-direction:column;align-items:stretch}
  .top-nav-left,.top-nav-right{justify-content:space-between}
}
</style>
</head>
<body>

<!-- ============ LOGIN SCREEN ============ -->
<div id="screen-login" class="screen active">
  <div class="login-wrap">
    <div class="login-box">
      <div class="logo">DARTPRO<span>Team & Kasse</span></div>
      <p class="login-subtitle">Bitte einloggen</p>
      <div class="form-group">
        <label>Benutzername</label>
        <input type="text" id="login-email" placeholder="Benutzername" autocomplete="username">
      </div>
      <div class="form-group">
        <label>Passwort</label>
        <input type="password" id="login-password" placeholder="Passwort" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" onclick="doLogin()">Einloggen</button>
      <div id="login-error" class="login-error"></div>
    </div>
  </div>
</div>

<!-- ============ SETUP SCREEN ============ -->
<div id="screen-setup" class="screen">
  <div class="login-wrap">
    <div class="login-box">
      <div class="logo">DARTPRO<span>Ersteinrichtung</span></div>
      <p class="login-subtitle">Erstelle den ersten Admin-Account</p>
      <div class="form-group">
        <label>Benutzername</label>
        <input type="text" id="setup-email" placeholder="Admin Benutzername">
      </div>
      <div class="form-group">
        <label>Passwort (mind. 6 Zeichen)</label>
        <input type="password" id="setup-password" placeholder="Passwort">
      </div>
      <div class="form-group">
        <label>Passwort wiederholen</label>
        <input type="password" id="setup-password2" placeholder="Passwort wiederholen">
      </div>
      <div class="form-group">
        <label>Team-Name</label>
        <input type="text" id="setup-team" placeholder="z.B. DartPro Team 1">
      </div>
      <button class="btn btn-primary" onclick="doSetup()">Admin erstellen</button>
      <div id="setup-error" class="login-error"></div>
    </div>
  </div>
</div>

<!-- ============ MAIN APP SCREEN ============ -->
<div id="screen-app" class="screen">
  <div class="app">
    <div class="top-nav">
      <div class="top-nav-left">
        <div class="logo" style="font-size:1.6rem">DARTPRO<span style="font-size:.9rem">Team &amp; Kasse</span></div>
        <select id="team-selector" class="team-selector" onchange="switchTeam(this.value)" style="display:none"></select>
      </div>
      <div class="top-nav-right">
        <div id="user-badge" class="user-badge"></div>
        <button id="btn-admin" class="btn btn-ghost btn-sm" onclick="showAdmin()" style="display:none">&#9881; Admin</button>
        <button class="btn btn-ghost btn-sm" onclick="doLogout()">&#128682; Logout</button>
      </div>
    </div>
    <div id="screen-members"></div>
  </div>
</div>

<!-- ============ ADMIN SCREEN ============ -->
<div id="screen-admin" class="screen">
  <div class="app">
    <div class="top-nav">
      <div class="top-nav-left">
        <div class="logo" style="font-size:1.6rem">DARTPRO<span style="font-size:.9rem">Administration</span></div>
      </div>
      <div class="top-nav-right">
        <button class="btn btn-ghost btn-sm" onclick="hideAdmin()">&#8592; Zurück</button>
        <button class="btn btn-ghost btn-sm" onclick="doLogout()">&#128682; Logout</button>
      </div>
    </div>
    <div id="admin-content"></div>
  </div>
</div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>

<script>
// ============================================================
// FIREBASE CONFIG - HIER DEINE DATEN EINTRAGEN
// ============================================================
const firebaseConfig = {
  apiKey: "AIzaSyAV3dPWd-hhzE-mcs0jKHrAz4Gt9m72gcQ",
  authDomain: "dart-manager-8e508.firebaseapp.com",
  projectId: "dart-manager-8e508",
  storageBucket: "dart-manager-8e508.firebasestorage.app",
  messagingSenderId: "957391204858",
  appId: "1:957391204858:web:14588e6e1e9f47a5537443",
  measurementId: "G-ZMPC2S35K3"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ============================================================
// GLOBAL STATE
// ============================================================
let currentUser = null;
let userData = null;
let currentTeamId = null;
let currentTeamData = null;
let membersCache = [];
let incomeCache = [];
let expensesCache = [];
let usersCache = [];
let teamsCache = [];
let currentAppTab = 'tab-kader';
let nextMemberId = 1;
let nextIncomeId = 1;
let nextExpenseId = 1;

// ============================================================
// HELPER
// ============================================================
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function formatDate(dateStr) {
  if (!dateStr) return '-';
  const d = new Date(dateStr);
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById(id);
  if (el) el.classList.add('active');
}

function showFormError(elId, msg) {
  const el = document.getElementById(elId);
  if (el) { el.textContent = msg; el.style.display = 'block'; }
}

function hideFormError(elId) {
  const el = document.getElementById(elId);
  if (el) el.style.display = 'none';
}

function isAdmin() { return userData && userData.role === 'superadmin'; }
function isCaptain() { return userData && (userData.role === 'superadmin' || userData.role === 'captain'); }

function canEdit() { return isCaptain(); }

// ============================================================
// AUTH FUNCTIONS
// ============================================================
// Firebase Auth nutzt Email+Password. Wir speichern Username als user@team.dartpro
function usernameToEmail(username) {
  return username.toLowerCase().trim().replace(/\s+/g, '.') + '@dartpro.local';
}

async function doLogin() {
  hideFormError('login-error');
  const username = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!username || !password) { showFormError('login-error', 'Bitte alle Felder ausfüllen'); return; }
  const email = usernameToEmail(username);
  try {
    const cred = await auth.signInWithEmailAndPassword(email, password);
    // Login erfolgreich -> onAuthStateChanged lädt userData
  } catch (err) {
    const msg = err.code === 'auth/user-not-found' || err.code === 'auth/wrong-password' || err.code === 'auth/invalid-credential'
      ? 'Benutzername oder Passwort falsch'
      : err.message;
    showFormError('login-error', msg);
  }
}

function doLogout() {
  auth.signOut();
}

async function doSetup() {
  hideFormError('setup-error');
  const username = document.getElementById('setup-email').value.trim();
  const pw = document.getElementById('setup-password').value;
  const pw2 = document.getElementById('setup-password2').value;
  const teamName = document.getElementById('setup-team').value.trim();
  if (!username || !pw || !teamName) { showFormError('setup-error', 'Bitte alle Felder ausfüllen'); return; }
  if (pw.length < 6) { showFormError('setup-error', 'Passwort muss mind. 6 Zeichen haben'); return; }
  if (pw !== pw2) { showFormError('setup-error', 'Passwörter stimmen nicht überein'); return; }

  try {
    const email = usernameToEmail(username);
    const cred = await auth.createUserWithEmailAndPassword(email, pw);
    const teamRef = await db.collection('teams').add({ name: teamName, felgeCost: 0.50, monthlyFee: 5.00, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
    await db.collection('users').doc(cred.user.uid).set({
      username: username,
      email: email,
      role: 'superadmin',
      teamIds: [teamRef.id],
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    // Team-Selector auf das neue Team setzen
    currentTeamId = teamRef.id;
  } catch (err) {
    showFormError('setup-error', err.message);
  }
}

// Enter-Taste für Login und Setup
document.getElementById('login-password').addEventListener('keydown', function(e) { if (e.key === 'Enter') doLogin(); });
document.getElementById('setup-password2').addEventListener('keydown', function(e) { if (e.key === 'Enter') doSetup(); });

// ============================================================
// FIRESTORE DATA FUNCTIONS
// ============================================================
// Load user profile from Firestore
async function loadUserProfile(uid) {
  const doc = await db.collection('users').doc(uid).get();
  if (doc.exists) {
    return doc.data();
  }
  return null;
}

// Load all teams the user has access to
async function loadUserTeams(teamIds) {
  if (!teamIds || teamIds.length === 0) return [];
  const teams = [];
  for (const tid of teamIds) {
    const doc = await db.collection('teams').doc(tid).get();
    if (doc.exists) teams.push({ id: doc.id, ...doc.data() });
  }
  return teams;
}

// Load team members
async function loadMembers(teamId) {
  const snap = await db.collection('teams').doc(teamId).collection('members').orderBy('name').get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

// Load team income
async function loadIncome(teamId) {
  const snap = await db.collection('teams').doc(teamId).collection('income').orderBy('date', 'desc').get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

// Load team expenses
async function loadExpenses(teamId) {
  const snap = await db.collection('teams').doc(teamId).collection('expenses').orderBy('date', 'desc').get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

// Load all users (admin only)
async function loadAllUsers() {
  const snap = await db.collection('users').orderBy('username').get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

// Load all teams (admin only)
async function loadAllTeams() {
  const snap = await db.collection('teams').orderBy('name').get();
  return snap.docs.map(d => ({ id: d.id, ...d.data() }));
}

// Switch active team
async function switchTeam(teamId) {
  currentTeamId = teamId;
  if (userData && userData.teamIds) {
    localStorage.setItem('dartpro_lastTeam', teamId);
  }
  await loadTeamData();
  renderApp();
}

// Load all data for current team
async function loadTeamData() {
  if (!currentTeamId) return;
  const teamDoc = await db.collection('teams').doc(currentTeamId).get();
  if (teamDoc.exists) {
    currentTeamData = { id: teamDoc.id, ...teamDoc.data() };
  }
  membersCache = await loadMembers(currentTeamId);
  incomeCache = await loadIncome(currentTeamId);
  expensesCache = await loadExpenses(currentTeamId);
  // Calculate next IDs
  nextMemberId = membersCache.length > 0 ? Math.max(...membersCache.map(m => parseInt(m.id) || 0)) + 1 : 1;
  nextIncomeId = incomeCache.length > 0 ? Math.max(...incomeCache.map(i => parseInt(i.id) || 0)) + 1 : 1;
  nextExpenseId = expensesCache.length > 0 ? Math.max(...expensesCache.map(e => parseInt(e.id) || 0)) + 1 : 1;
}

// MEMBER CRUD
async function addMemberToFirestore(data) {
  const ref = await db.collection('teams').doc(currentTeamId).collection('members').add(data);
  membersCache.push({ id: ref.id, ...data });
}

async function updateMemberInFirestore(memberId, data) {
  await db.collection('teams').doc(currentTeamId).collection('members').doc(memberId).update(data);
  const idx = membersCache.findIndex(m => m.id === memberId);
  if (idx >= 0) Object.assign(membersCache[idx], data);
}

async function deleteMemberFromFirestore(memberId) {
  await db.collection('teams').doc(currentTeamId).collection('members').doc(memberId).delete();
  membersCache = membersCache.filter(m => m.id !== memberId);
}

// INCOME CRUD
async function addIncomeToFirestore(data) {
  const ref = await db.collection('teams').doc(currentTeamId).collection('income').add(data);
  incomeCache.push({ id: ref.id, ...data });
}

async function deleteIncomeFromFirestore(incomeId) {
  await db.collection('teams').doc(currentTeamId).collection('income').doc(incomeId).delete();
  incomeCache = incomeCache.filter(i => i.id !== incomeId);
}

// EXPENSE CRUD
async function addExpenseToFirestore(data) {
  const ref = await db.collection('teams').doc(currentTeamId).collection('expenses').add(data);
  expensesCache.push({ id: ref.id, ...data });
}

async function deleteExpenseFromFirestore(expenseId) {
  await db.collection('teams').doc(currentTeamId).collection('expenses').doc(expenseId).delete();
  expensesCache = expensesCache.filter(e => e.id !== expenseId);
}

// TEAM SETTINGS
async function updateTeamSettings(data) {
  await db.collection('teams').doc(currentTeamId).update(data);
  Object.assign(currentTeamData, data);
}

// ============================================================
// MEMBER EDIT FUNCTIONS (Modal)
// ============================================================
function editMember(id) {
  const member = membersCache.find(m => m.id === id);
  if (!member) return;
  const canDo = canEdit();
  const modal = document.createElement('div');
  modal.id = 'edit-modal-' + id;
  modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px';
  modal.innerHTML = `
    <div style="background:var(--bg2);border:2px solid var(--accent);border-radius:var(--radius);padding:24px;max-width:500px;width:100%">
      <h3 style="font-family:'Oswald';color:var(--accent);margin-bottom:20px;font-size:1.3rem">Mitglied bearbeiten</h3>
      <div style="margin-bottom:12px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Name</label>
        <input type="text" id="edit-member-name" value="${esc(member.name)}" ${canDo ? '' : 'disabled'} style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px">
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Geburtstag</label>
        <input type="date" id="edit-member-birthday" value="${member.birthday || ''}" ${canDo ? '' : 'disabled'} style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px">
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Trikotgröße</label>
        <select id="edit-member-jersey" ${canDo ? '' : 'disabled'} style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px">
          <option value="">-</option>
          ${['XS','S','M','L','XL','XXL','XXXL'].map(s => `<option value="${s}" ${member.jerseySize === s ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
      </div>
      <div style="margin-bottom:20px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Felgen</label>
        <input type="number" id="edit-member-felge" value="${member.felgeCount || 0}" min="0" step="1" ${canDo ? '' : 'disabled'} style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px">
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="document.getElementById('edit-modal-${id}').remove()">Schließen</button>
        ${canDo ? `<button class="btn btn-primary" onclick="saveMember('${id}')">Speichern</button>` : ''}
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

async function saveMember(id) {
  const member = membersCache.find(m => m.id === id);
  if (!member) return;
  const newName = document.getElementById('edit-member-name').value.trim();

async function togglePaidMonth(memberId, monthIdx) {
  if (!canEdit()) return;
  const member = membersCache.find(m => m.id === memberId);
  if (!member) return;
  if (!member.paidMonths) member.paidMonths = [];
  const idx = member.paidMonths.indexOf(monthIdx);
  if (idx >= 0) {
    member.paidMonths.splice(idx, 1);
  } else {
    member.paidMonths.push(monthIdx);
    member.paidMonths.sort((a, b) => a - b);
  }
  await updateMemberInFirestore(memberId, { paidMonths: member.paidMonths });
  renderApp();
}

async function savePenalty(memberId) {
  const member = membersCache.find(m => m.id === memberId);
  if (!member) return;
  const type = document.getElementById('penalty-type').value;
  const amount = parseFloat(document.getElementById('penalty-amount').value);
  const date = document.getElementById('penalty-date').value;
  if (!type || isNaN(amount) || amount <= 0 || !date) { alert('Bitte alle Felder korrekt ausfüllen'); return; }
  if (!member.penalties) member.penalties = [];
  member.penalties.push({ type, amount, date });
  await updateMemberInFirestore(memberId, { penalties: member.penalties });
  const modal = document.getElementById('penalty-modal-' + memberId);
  if (modal) modal.remove();
  renderApp();
}

async function deletePenalty(memberId, penaltyIdx) {
  if (!canEdit()) return;
  if (!confirm('Diese Strafe wirklich löschen?')) return;
  const member = membersCache.find(m => m.id === memberId);
  if (!member) return;
  member.penalties.splice(penaltyIdx, 1);

  renderApp();
}

function renderBirthdaysView() {
  if (membersCache.length === 0) return '<div class="card"><p style="color:var(--text3);text-align:center;padding:40px">Noch keine Mitglieder vorhanden</p></div>';
  const withBdays = membersCache.filter(m => m.birthday).map(m => {
    const bd = new Date(m.birthday);
    const today = new Date(); today.setHours(0,0,0,0);
    const next = new Date(today.getFullYear(), bd.getMonth(), bd.getDate());
    if (next < today) next.setFullYear(next.getFullYear() + 1);
    const days = Math.ceil((next - today) / (1000*60*60*24));
    return { ...m, daysUntil: days };
  });
  if (withBdays.length === 0) return '<div class="card"><p style="color:var(--text3);text-align:center;padding:40px">Keine Geburtstage eingetragen</p></div>';
  withBdays.sort((a,b) => a.daysUntil - b.daysUntil);
  let html = '<div class="card"><div class="card-title"><div class="icon">&#127874;</div> Geburtstage</div>';
  withBdays.forEach((m, idx) => {
    const isToday = m.daysUntil === 0;
    const isSoon = m.daysUntil <= 7;
    const age = new Date().getFullYear() - new Date(m.birthday).getFullYear();
    let badgeColor = 'var(--red)', badgeBg = 'rgba(255,23,68,.15)', badgeText = `in ${m.daysUntil} Tagen`;
    if (isToday) { badgeColor = 'var(--green)'; badgeBg = 'rgba(0,230,118,.2)'; badgeText = '&#127881; HEUTE!'; }
    else if (isSoon) { badgeColor = 'var(--accent3)'; badgeBg = 'rgba(255,170,0,.15)'; badgeText = `in ${m.daysUntil} ${m.daysUntil===1?'Tag':'Tagen'}`; }
    html += `<div style="background:var(--bg3);border:${isToday?'2px':'1px'} solid ${isToday?'var(--green)':(isSoon?'var(--accent3)':'var(--bg4)')};border-radius:var(--radius);padding:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;${idx===0&&!isToday?'border-color:var(--red);border-width:2px;background:rgba(255,23,68,.05)':''}">
      <div style="display:flex;align-items:center;gap:16px">
        ${idx===0&&!isToday?'<div style="font-size:1.5rem">&#128293;</div>':''}
        <div>
          <div style="font-family:'Oswald';font-size:1.2rem;font-weight:600;${idx===0?'color:var(--red)':''}">${esc(m.name)}</div>
          <div style="font-size:.85rem;color:var(--text2);margin-top:4px">${formatDate(m.birthday)} (${age} Jahre)</div>
        </div>
      </div>
      <div style="text-align:right"><div style="font-family:'Oswald';font-size:1.6rem;font-weight:700;color:${badgeColor};padding:4px 12px;background:${badgeBg};border-radius:var(--radius)">${badgeText}</div></div>
    </div>`;
  });
  html += '</div>';
  return html;
}

let currentAdminTab = 'admin-users';

function showAdmin() {
  if (!isAdmin()) return;
  showScreen('screen-admin');
  loadAdminData();
}

function hideAdmin() {
  showScreen('screen-app');
  renderApp();
}

async function loadAdminData() {
  usersCache = await loadAllUsers();
  const snap = await db.collection('teams').orderBy('name').get();
  teamsCache = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  renderAdmin();
}

function switchAdminTab(tabId) {
  currentAdminTab = tabId;
  renderAdmin();
}

function renderAdmin() {
  const el = document.getElementById('admin-content');
  el.innerHTML = `
    <div class="tabs">
      <button class="tab ${currentAdminTab==='admin-users'?'active':''}" onclick="switchAdminTab('admin-users')">&#128101; Benutzer</button>
      <button class="tab ${currentAdminTab==='admin-teams'?'active':''}" onclick="switchAdminTab('admin-teams')">&#127942; Teams</button>
    </div>
    <div id="admin-users-tab" style="display:${currentAdminTab==='admin-users'?'':'none'}">${renderAdminUsers()}</div>
    <div id="admin-teams-tab" style="display:${currentAdminTab==='admin-teams'?'':'none'}">${renderAdminTeams()}</div>
  `;
}

  let html = `<div class="card">

    <div class="form-row">
      <div class="form-group" style="flex:3"><label>Team-Name</label><input type="text" id="new-team-name" placeholder="z.B. DartPro Team 2"></div>

async function createUser() {
  const username = document.getElementById('new-user-name').value.trim();
  const pw = document.getElementById('new-user-pw').value;
  const role = document.getElementById('new-user-role').value;
  const teamId = document.getElementById('new-user-team').value;
  if (!username || !pw || !teamId) { alert('Bitte alle Felder ausfüllen'); return; }
  if (pw.length < 6) { alert('Passwort muss mind. 6 Zeichen haben'); return; }
  try {
    // Admin erstellt User über Firebase Admin... 
    // Da wir Compat SDK nutzen, müssen wir einen Trick anwenden:
    // Wir erstellen den User mit createUserWithEmailAndPassword und loggen ihn sofort wieder aus
    // Besser: Wir nutzen eine Cloud Function oder der Admin loggt sich temporär aus
    // Pragmatische Lösung: Admin kann temporäre Credentials erstellen
    const email = usernameToEmail(username);
    // Da Firebase Auth nicht direkt andere User erstellen kann im Client-SDK,
    // nutzen wir einen Workaround: Second App Instance
    const tempApp = firebase.initializeApp(firebaseConfig, 'TempApp' + Date.now());
    const tempAuth = tempApp.auth();
    const tempCred = await tempAuth.createUserWithEmailAndPassword(email, pw);
    await db.collection('users').doc(tempCred.user.uid).set({
      username: username,
      email: email,
      role: role,
      teamIds: [teamId],
      createdBy: currentUser.uid,
      createdAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    await tempAuth.signOut();
    await tempApp.delete();
    await loadAdminData();
    alert(`Benutzer "${username}" erfolgreich angelegt!`);
  } catch (err) {
    if (err.code === 'auth/email-already-in-use') {
      alert('Dieser Benutzername ist bereits vergeben.');
    } else {
      alert('Fehler: ' + err.message);
    }
  }
}

async function editUser(uid) {
  const user = usersCache.find(u => u.id === uid);
  if (!user) return;
  const roleLabels = { superadmin: 'Super-Admin', captain: 'Kapitän', viewer: 'Leser' };
  const modal = document.createElement('div');
  modal.id = 'edit-user-modal';
  modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px';
  modal.innerHTML = `
    <div style="background:var(--bg2);border:2px solid var(--accent);border-radius:var(--radius);padding:24px;max-width:500px;width:100%">
      <h3 style="font-family:'Oswald';color:var(--accent);margin-bottom:20px;font-size:1.3rem">Benutzer bearbeiten</h3>
      <div style="margin-bottom:16px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Benutzername</label>
        <input type="text" id="edit-user-name" value="${esc(user.username)}" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px">
      </div>
      <div style="margin-bottom:16px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Rolle</label>
        <select id="edit-user-role" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px">
          <option value="viewer" ${user.role==='viewer'?'selected':''}>Leser (nur sehen)</option>
          <option value="captain" ${user.role==='captain'?'selected':''}>Kapitän (bearbeiten)</option>
          <option value="superadmin" ${user.role==='superadmin'?'selected':''}>Super-Admin</option>
        </select>
      </div>
      <div style="margin-bottom:16px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Teams</label>
        <div id="edit-user-teams" style="display:grid;gap:6px">
          ${teamsCache.map(t => {
            const checked = (user.teamIds || []).includes(t.id) ? 'checked' : '';
            return `<label style="display:flex;align-items:center;gap:8px;font-size:.9rem;color:var(--text);cursor:pointer">
              <input type="checkbox" value="${t.id}" ${checked} style="width:auto;accent-color:var(--accent)"> ${esc(t.name)}
            </label>`;
          }).join('')}
        </div>
      </div>
      <div style="margin-bottom:20px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Neues Passwort (leer lassen = nicht ändern)</label>
        <input type="password" id="edit-user-pw" placeholder="Neues Passwort" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px">
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="document.getElementById('edit-user-modal').remove()">Abbrechen</button>
        <button class="btn btn-primary" onclick="saveUserEdit('${uid}')">Speichern</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

async function saveUserEdit(uid) {
  const username = document.getElementById('edit-user-name').value.trim();
  const role = document.getElementById('edit-user-role').value;
  const newPw = document.getElementById('edit-user-pw').value;
  const teamCheckboxes = document.querySelectorAll('#edit-user-teams input[type=checkbox]:checked');
  const teamIds = Array.from(teamCheckboxes).map(cb => cb.value);
  if (!username) { alert('Benutzername darf nicht leer sein'); return; }
  if (teamIds.length === 0) { alert('Mindestens ein Team muss zugewiesen sein'); return; }

  await db.collection('users').doc(uid).update({ username, role, teamIds });

  if (newPw && newPw.length >= 6) {
    try {
      const email = usernameToEmail(username);
      const tempApp = firebase.initializeApp(firebaseConfig, 'TempPw' + Date.now());
      // Password can only be changed by the user themselves or via Admin SDK
      // We need to use a workaround: sign in as that user temporarily
      // Actually, Firebase doesn't allow admin to change user passwords from client
      // We'd need Cloud Functions for this. For now, alert the user.
      await tempApp.delete();
      alert('Hinweis: Passwort-Änderung durch Admin ist nur über Firebase Console möglich. Der Benutzer muss sein Passwort selbst ändern.');
    } catch(e) { /* ignore */ }
  }

  const m = document.getElementById('edit-user-modal');
  if (m) m.remove();
  await loadAdminData();
}

async function deleteUser(uid) {
  if (uid === currentUser.uid) { alert('Du kannst dich nicht selbst löschen!'); return; }
  const user = usersCache.find(u => u.id === uid);
  if (!confirm(`Benutzer "${user ? user.username : uid}" wirklich löschen?`)) return;
  await db.collection('users').doc(uid).delete();
  // Note: Firebase Auth User deletion requires Admin SDK or Cloud Functions
  // The Firestore profile is deleted, but the Auth account remains
  alert('Benutzer-Profil gelöscht. Hinweis: Der Firebase Auth Account muss ggf. manuell in der Firebase Console gelöscht werden.');
  await loadAdminData();
}

async function createTeam() {
  const name = document.getElementById('new-team-name').value.trim();
  if (!name) { alert('Bitte Team-Name eingeben'); return; }
  await db.collection('teams').add({ name, felgeCost: 0.50, monthlyFee: 5.00, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
  await loadAdminData();
}

async function renameTeam(teamId) {
  const team = teamsCache.find(t => t.id === teamId);
  const newName = prompt('Neuer Team-Name:', team ? team.name : '');
  if (!newName || !newName.trim()) return;
  await db.collection('teams').doc(teamId).update({ name: newName.trim() });
  await loadAdminData();
}

async function deleteTeam(teamId) {
  const team = teamsCache.find(t => t.id === teamId);
  if (!confirm(`Team "${team ? team.name : teamId}" wirklich löschen? Alle Mitglieder-Daten gehen verloren!`)) return;
  // Delete all members
  const membersSnap = await db.collection('teams').doc(teamId).collection('members').get();
  const batch = db.batch();
  membersSnap.docs.forEach(d => batch.delete(d.ref));
  const incomeSnap = await db.collection('teams').doc(teamId).collection('income').get();
  incomeSnap.docs.forEach(d => batch.delete(d.ref));
  const expenseSnap = await db.collection('teams').doc(teamId).collection('expenses').get();
  expenseSnap.docs.forEach(d => batch.delete(d.ref));
  await batch.commit();
  await db.collection('teams').doc(teamId).delete();
  // Remove team from all users
  const allUsers = await db.collection('users').get();
  const batch2 = db.batch();
  allUsers.docs.forEach(d => {
    const u = d.data();
    if ((u.teamIds || []).includes(teamId)) {
      batch2.update(d.ref, { teamIds: u.teamIds.filter(t => t !== teamId) });
    }
  });
  await batch2.commit();
  await loadAdminData();
}

// INIT

// Auth State Observer
auth.onAuthStateChanged(async function(user) {
  if (user) {
    currentUser = user;
    // Load user profile
    userData = await loadUserProfile(user.uid);
    if (!userData) {
      // No profile found - show error
      showScreen('screen-login');
      showFormError('login-error', 'Kein Profil gefunden. Bitte Admin kontaktieren.');
      await auth.signOut();
      return;
    }
    // Load teams
    teamsCache = await loadUserTeams(userData.teamIds);
    if (teamsCache.length === 0) {
      showScreen('screen-login');
      showFormError('login-error', 'Kein Team zugewiesen. Bitte Admin kontaktieren.');
      await auth.signOut();
      return;
    }
    // Set active team
    const lastTeam = localStorage.getItem('dartpro_lastTeam');
    currentTeamId = (lastTeam && userData.teamIds.includes(lastTeam)) ? lastTeam : teamsCache[0].id;
    await loadTeamData();
    // Update UI
    updateTopNav();
    showScreen('screen-app');
    renderApp();
  } else {
    // Not logged in - check if any users exist
    currentUser = null;
    userData = null;
    currentTeamId = null;
    currentTeamData = null;
    membersCache = [];
    incomeCache = [];
    expensesCache = [];
    // Check if setup is needed
    const usersSnap = await db.collection('users').limit(1).get();
    if (usersSnap.empty) {
      showScreen('screen-setup');
    } else {
      showScreen('screen-login');
    }
  }
});

function updateTopNav() {
  const roleLabels = { superadmin: 'Super-Admin', captain: 'Kapitän', viewer: 'Leser' };
  const badge = document.getElementById('user-badge');
  badge.innerHTML = `${esc(userData.username)} <span class="role-tag ${userData.role}">${roleLabels[userData.role] || userData.role}</span>`;
  // Admin button
  document.getElementById('btn-admin').style.display = isAdmin() ? '' : 'none';
  // Team selector
  const sel = document.getElementById('team-selector');
  if (teamsCache.length > 1) {
    sel.style.display = '';
    sel.innerHTML = teamsCache.map(t => `<option value="${t.id}" ${t.id===currentTeamId?'selected':''}>${esc(t.name)}</option>`).join('');
  } else {
    sel.style.display = 'none';
  }
}
