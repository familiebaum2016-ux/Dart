<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dartfreunde-Siegen</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow+Condensed:wght@300;400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* === RESET & BASE === */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a28;--bg4:#222236;
  --accent:#00e5ff;--accent2:#ff3d71;--accent3:#ffaa00;--green:#00e676;--red:#ff1744;
  --text:#e8e8f0;--text2:#9898b0;--text3:#5a5a78;
  --gold:#ffd700;--silver:#c0c0c0;--bronze:#cd7f32;
  --radius:8px;--radius2:12px;
  --shadow:0 4px 24px rgba(0,0,0,.5);
  --glow:0 0 20px rgba(0,229,255,.15);
}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
h1,h2,h3,h4{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em}
button{font-family:'Barlow Condensed',sans-serif;cursor:pointer;border:none;outline:none;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
input,select{font-family:'Barlow',sans-serif;outline:none}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:var(--bg2)}
::-webkit-scrollbar-thumb{background:var(--bg4);border-radius:3px}

/* === LAYOUT === */
.app{max-width:1400px;margin:0 auto;padding:20px}
.screen{display:none;animation:fadeIn .4s ease}
.screen.active{display:block}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}

/* === HEADER === */
.header{text-align:center;padding:30px 0 20px;position:relative}
.header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.logo{font-family:'Oswald',sans-serif;font-size:2.8rem;font-weight:700;letter-spacing:.08em;background:linear-gradient(135deg,var(--accent),#7c4dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo span{font-weight:300;font-size:1.4rem;display:block;letter-spacing:.2em;-webkit-text-fill-color:var(--text2);margin-top:2px}

/* === CARDS === */
.card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius2);padding:24px;margin-bottom:16px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.card-title{font-size:1.1rem;color:var(--accent);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title .icon{width:28px;height:28px;background:var(--bg3);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1rem}

/* === FORM ELEMENTS === */
.form-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;align-items:end}
.form-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
input,select{background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px 12px;border-radius:6px;font-size:.95rem;width:100%;transition:border-color .2s}
input:focus,select:focus{border-color:var(--accent)}

/* === BUTTONS === */
.btn{padding:10px 20px;border-radius:6px;font-size:.95rem;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#0099cc);color:#000}
.btn-primary:hover{transform:translateY(-1px);box-shadow:var(--glow)}
.btn-ghost{background:var(--bg3);color:var(--text);border:1px solid var(--bg4)}
.btn-ghost:hover{background:var(--bg4)}
.btn-success{background:var(--green);color:#000}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:6px 12px;font-size:.8rem}
.btn-block{width:100%}
.btn:disabled{opacity:.4;cursor:not-allowed}

/* === TOURNAMENT SETUP === */
.setup-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:16px}
.tournament-type{background:var(--bg3);border:2px solid var(--bg4);border-radius:var(--radius2);padding:24px;cursor:pointer;transition:all .3s;text-align:center;position:relative;overflow:hidden}
.tournament-type:hover{border-color:var(--accent);transform:translateY(-2px)}
.tournament-type.selected{border-color:var(--accent);box-shadow:var(--glow)}
.tournament-type.selected::before{content:'✓';position:absolute;top:8px;right:8px;background:var(--accent);color:#000;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:700}
.tournament-type h3{font-size:1.3rem;color:var(--accent);margin-bottom:8px}
.tournament-type p{font-size:.85rem;color:var(--text2);line-height:1.4}

/* === PLAYER TABLE === */
.player-table{width:100%;border-collapse:collapse}
.player-table th{text-align:left;padding:10px 12px;background:var(--bg3);color:var(--text2);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid var(--bg4)}
.player-table td{padding:12px;border-bottom:1px solid var(--bg4);font-size:.95rem}
.player-table tr:hover{background:rgba(0,229,255,.03)}

/* === FELGE COUNTER === */
.felge-counter{display:inline-flex;align-items:center;gap:6px;background:var(--bg3);border:1px solid var(--bg4);border-radius:20px;padding:4px 12px}
.felge-counter .count{font-weight:600;color:var(--accent);font-size:1rem}
.felge-counter button{background:var(--bg4);border:none;color:var(--text);width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:.85rem;display:flex;align-items:center;justify-content:center}
.felge-counter button:hover{background:var(--accent);color:#000}

/* === BRACKET === */
.bracket-container{overflow-x:auto;padding:20px 0}
.bracket-round{display:flex;flex-direction:column;gap:20px;min-width:200px}
.bracket-match{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:12px;min-width:180px}
.bracket-match.completed{border-color:var(--green);opacity:.8}
.bracket-player{padding:8px 12px;display:flex;justify-content:space-between;align-items:center;border-radius:4px;margin:4px 0;font-size:.9rem}
.bracket-player.winner{background:rgba(0,230,118,.15);color:var(--green);font-weight:600}
.bracket-player.loser{opacity:.5;text-decoration:line-through}
.bracket-vs{text-align:center;font-size:.7rem;color:var(--text3);margin:2px 0;text-transform:uppercase;letter-spacing:.1em}

/* === MACHINE GRID === */
.machine-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.machine-card{background:var(--bg3);border:2px solid var(--bg4);border-radius:var(--radius);padding:16px;text-align:center;transition:all .3s}
.machine-card.busy{border-color:var(--accent3);box-shadow:0 0 12px rgba(255,170,0,.2)}
.machine-card.ready{border-color:var(--green);box-shadow:0 0 12px rgba(0,230,118,.2);cursor:pointer}
.machine-card.ready:hover{transform:translateY(-2px)}
.machine-name{font-family:'Oswald';font-size:1.1rem;color:var(--accent);margin-bottom:8px}
.machine-status{font-size:.8rem;padding:4px 12px;border-radius:12px;display:inline-block}
.machine-status.busy{background:rgba(255,170,0,.15);color:var(--accent3)}
.machine-status.free{background:rgba(0,230,118,.15);color:var(--green)}
.machine-match{margin-top:8px;font-size:.82rem;color:var(--text2)}

/* === MEMBER STATS === */
.member-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:16px;text-align:center}
.stat-card.highlight{border-color:var(--accent);box-shadow:var(--glow)}
.stat-label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.stat-value{font-family:'Oswald';font-size:1.8rem;font-weight:600;color:var(--accent)}

/* === TABS === */
.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--bg4);padding-bottom:4px}
.tab{padding:10px 20px;background:transparent;color:var(--text2);border:none;border-bottom:2px solid transparent;margin-bottom:-6px;transition:all .2s;font-size:.9rem}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

/* === MEMBER TABLE === */
.member-table{width:100%;border-collapse:collapse}
.member-table th{text-align:left;padding:10px 12px;background:var(--bg3);color:var(--text2);font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;border-bottom:2px solid var(--bg4)}
.member-table td{padding:12px;border-bottom:1px solid var(--bg4);font-size:.9rem}

/* === EDIT BUTTON === */
.edit-btn{background:transparent;border:1px solid var(--bg4);color:var(--text2);padding:4px 8px;border-radius:4px;font-size:.85rem;cursor:pointer;transition:all .2s}
.edit-btn:hover{background:var(--bg3);color:var(--accent);border-color:var(--accent)}

/* === FLEX UTILITIES === */
.flex{display:flex}
.gap-1{gap:8px}
.gap-2{gap:16px}
.mt-1{margin-top:8px}
.mt-2{margin-top:16px}
.items-center{align-items:center}
.justify-between{justify-content:space-between}

/* === SCOREBOARD === */
.scoreboard{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius2);padding:20px;margin-bottom:16px}
.scoreboard-match-info{text-align:center;margin-bottom:16px;font-family:'Oswald';font-size:1.1rem;color:var(--text2)}
.scoreboard-players{display:grid;grid-template-columns:1fr auto 1fr;gap:16px;align-items:center}
.scoreboard-player{text-align:center;padding:16px;border-radius:var(--radius);background:var(--bg3)}
.scoreboard-player.active{background:linear-gradient(135deg,rgba(0,229,255,.1),rgba(124,77,255,.1));border:1px solid var(--accent)}
.scoreboard-player .name{font-family:'Oswald';font-size:1.3rem;margin-bottom:4px}
.scoreboard-player .score{font-family:'Oswald';font-size:3rem;font-weight:700;color:var(--accent)}
.scoreboard-player .score.low{color:var(--accent3);animation:pulse 1s infinite}
.scoreboard-player .score.bust{color:var(--red)}
.scoreboard-vs{font-family:'Oswald';font-size:1.5rem;color:var(--text3)}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.6}}

/* === SCORE INPUT === */
.score-input{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.score-btn{background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:8px 16px;border-radius:6px;font-size:.95rem;cursor:pointer;transition:all .2s;min-width:50px}
.score-btn:hover{background:var(--bg4);border-color:var(--accent)}
.score-btn.bust{border-color:var(--red);color:var(--red)}
.score-btn.bust:hover{background:rgba(255,23,68,.15)}

/* === RESULT CARD === */
.result-card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius2);padding:24px;margin-bottom:16px;position:relative;overflow:hidden}
.result-card.gold{border-color:var(--gold);box-shadow:0 0 24px rgba(255,215,0,.2)}
.result-card.silver{border-color:var(--silver);box-shadow:0 0 24px rgba(192,192,192,.15)}
.result-card.bronze{border-color:var(--bronze);box-shadow:0 0 24px rgba(205,127,50,.15)}
.result-place{font-family:'Oswald';font-size:2.5rem;font-weight:700;line-height:1}
.result-place.gold{color:var(--gold)}
.result-place.silver{color:var(--silver)}
.result-place.bronze{color:var(--bronze)}
.result-name{font-family:'Oswald';font-size:1.4rem;margin-top:4px}
.result-prize{font-size:1.1rem;color:var(--green);font-weight:600;margin-top:4px}

/* === QR CODE === */
.qr-code{background:#fff;padding:16px;border-radius:var(--radius);display:inline-block;margin:16px auto}
.qr-url{font-size:.85rem;color:var(--text2);word-break:break-all;margin-top:8px}
.qr-info{font-size:.8rem;color:var(--text3);margin-top:8px}
.qr-container{text-align:center;padding:24px}

/* === LIVE VIEW === */
.live-view{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius2);padding:20px}
.live-header{text-align:center;margin-bottom:20px;padding-bottom:16px;border-bottom:1px solid var(--bg4)}
.live-title{font-family:'Oswald';font-size:2rem;color:var(--accent);letter-spacing:.08em}
.live-subtitle{font-size:.9rem;color:var(--text2);margin-top:4px}
.live-section{margin-bottom:20px}
.live-section-title{font-family:'Oswald';font-size:1.2rem;color:var(--text);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.live-section-title::before{content:'';width:4px;height:20px;background:var(--accent);border-radius:2px}
.live-machine-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.live-machine{background:var(--bg3);border:2px solid var(--bg4);border-radius:var(--radius);padding:12px}
.live-machine.busy{border-color:var(--accent3)}
.live-machine.free{border-color:var(--green)}
.live-machine-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.live-machine-name{font-family:'Oswald';font-size:1rem;color:var(--text)}
.live-machine-status{font-size:.7rem;padding:3px 8px;border-radius:10px;font-weight:600}
.live-machine-status.busy{background:rgba(255,170,0,.15);color:var(--accent3)}
.live-machine-status.free{background:rgba(0,230,118,.15);color:var(--green)}
.live-player-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.live-player-card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:12px;display:flex;justify-content:space-between;align-items:center}
.live-player-name{font-weight:500}
.live-player-lives{color:var(--accent3);font-size:.85rem}
.live-eliminated{opacity:.5;text-decoration:line-through}
.live-round-badge{display:inline-block;background:var(--accent);color:#000;padding:4px 12px;border-radius:12px;font-weight:600;font-size:.85rem;margin-bottom:12px}

/* === RESPONSIVE === */
@media(max-width:768px){
  .form-row{flex-direction:column}
  .form-group{min-width:100%}
  .scoreboard-player .score{font-size:2rem}
  .bracket-visual{flex-direction:column}
  .machine-grid{grid-template-columns:1fr}
  
  /* Header buttons auf Mobile */
  .header > div[style*="position:absolute"]{
    position:static !important;
    margin-top:16px;
    justify-content:center;
    width:100%;
  }
  
  .header{
    padding-bottom:20px;
  }
}

/* === NOISE OVERLAY === */
body::before{content:'';position:fixed;top:0;left:0;right:0;bottom:0;background:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.03'/%3E%3C/svg%3E");pointer-events:none;z-index:9999;opacity:.5}

/* === PRIZE CONFIG === */
.prize-config{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:8px;margin-top:8px}
.prize-slot{background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:10px 12px;display:flex;align-items:center;gap:8px}
.prize-slot label{font-size:.7rem;flex:1}
.prize-slot input{width:70px;padding:6px 8px;font-size:.85rem}

/* === LIVE OVERLAY === */
.live-match-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.9);z-index:9000;display:none;align-items:center;justify-content:center;padding:20px}
.live-match-overlay.active{display:flex}
.live-match-box{background:var(--bg2);border:2px solid var(--accent);border-radius:var(--radius2);padding:24px;max-width:900px;width:100%;max-height:90vh;overflow-y:auto;position:relative}
.live-match-close{position:absolute;top:12px;right:12px;background:var(--bg3);border:1px solid var(--bg4);color:var(--text2);width:32px;height:32px;border-radius:50%;cursor:pointer;font-size:1.2rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.live-match-close:hover{background:var(--red);color:#fff}
</style>
</head>
<body>
<div class="app">
  <!-- HEADER -->
  <div class="header">
    <div class="logo">DARTPRO<span>Tournament Manager</span></div>
    <div style="position:absolute;top:20px;right:20px;display:flex;gap:12px">
      <button class="btn btn-ghost" style="padding:12px 18px;font-size:1rem;display:flex;align-items:center;gap:8px" onclick="showMembers()">
        <span style="font-size:1.4rem">&#128101;</span> Team & Kasse
      </button>
      <button class="btn btn-ghost" style="padding:12px 18px;font-size:1rem;display:flex;align-items:center;gap:8px" onclick="openSettings()" title="Einstellungen">
        <span style="font-size:1.4rem">&#9881;</span>
      </button>
    </div>
  </div>

  <!-- SCREEN 1: SETUP -->
  <div id="screen-setup" class="screen active">
    <!-- PLACEHOLDER: setup content -->
  </div>

  <!-- SCREEN 2: PLAYERS -->
  <div id="screen-players" class="screen">
    <!-- PLACEHOLDER: players content -->
  </div>

  <!-- SCREEN 3: TOURNAMENT -->
  <div id="screen-tournament" class="screen">
    <!-- PLACEHOLDER: tournament content -->
  </div>

  <!-- SCREEN 4: RESULTS -->
  <div id="screen-results" class="screen">
    <!-- PLACEHOLDER: results content -->
  </div>

  <!-- SCREEN 5: LIVE VIEW -->
  <div id="screen-live" class="screen">
    <!-- PLACEHOLDER: live view content -->
  </div>

  <!-- SCREEN 6: MEMBERS -->
  <div id="screen-members" class="screen">
    <!-- PLACEHOLDER: members content -->
  </div>

  <!-- QR CODE OVERLAY -->
  <div id="qr-overlay" class="live-match-overlay">
    <div class="qr-container">
      <h3>Live Turnier-Ansicht</h3>
      <p style="font-size:.85rem;color:var(--text2)">Scanne den QR-Code um das Turnier live zu verfolgen</p>
      <div id="qr-code" class="qr-code"></div>
      <div id="qr-url" class="qr-url"></div>
      <p class="qr-info">Öffne diese URL auf einem anderen Gerät im gleichen Netzwerk</p>
      <button class="btn btn-primary btn-block mt-2" onclick="closeQR()">Schließen</button>
    </div>
  </div>

  <!-- LIVE MATCH OVERLAY -->
  <div id="live-overlay" class="live-match-overlay">
    <div class="live-match-box">
      <button class="live-match-close" onclick="closeLiveMatch()">&times;</button>
      <div id="live-content"><!-- filled by JS --></div>
    </div>
  </div>
</div>

<script>
// === STATE ===
const STATE = {
  // Setup
  gameMode: '501',
  lives: 3,
  outMode: 'double',
  machines: 4,
  entryFee: 10,
  prizeDistribution: [40, 30, 20, 10],
  // Players
  players: [],
  // Tournament
  winnersBracket: [],
  losersBracket: [],
  finalMatch: null,
  currentRound: 0,
  tournamentActive: false,
  eliminatedPlayers: [],
  matchQueue: [],
  machineStates: [],
  placementOrder: [],
  nextPlayerId: 1,
  nextMatchId: 1,
  // Kratzer
  kratzerRound: 1,
  kratzerGroups: [],
  // Members
  members: [],
  otherIncome: [],
  otherExpenses: [],
  nextMemberId: 1,
  nextIncomeId: 1,
  nextExpenseId: 1,
  // Settings
  felgeCost: 0.50,
  monthlyFee: 5.00,
  // Player history
  playerHistory: [],
};

// === PERSISTENCE ===
const STORAGE_KEY = 'dartpro_tournament_data';

function saveState() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
  } catch (e) {
    console.warn('Save failed:', e);
  }
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const data = JSON.parse(saved);
      Object.assign(STATE, data);
      return true;
    }
  } catch (e) {
    console.warn('Load failed:', e);
  }
  return false;
}

function withAutoSave(fn) {
  return function() {
    const result = fn.apply(this, arguments);
    saveState();
    return result;
  };
}

// === UTILITIES ===
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function showScreen(name) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('screen-' + name);
  if (el) el.classList.add('active');
}

// === SETUP SCREEN ===
function renderSetup() {
  const el = document.getElementById('screen-setup');
  el.innerHTML = `
    <div class="card">
      <div class="card-title"><div class="icon">&#9881;</div> Turnier-Einstellungen</div>
      <div class="form-row">
        <div class="form-group">
          <label>Spielmodus</label>
          <select id="cfg-mode" onchange="onModeChange()">
            <option value="301">301</option>
            <option value="501" selected>501</option>
            <option value="701">701</option>
            <option value="kratzer">Kratzer</option>
          </select>
        </div>
        <div class="form-group" id="cfg-lives-info" style="display:none">

  ];

        <div class="form-group">

    <div class="card">

      ${STATE.players.length === 0 ? '<p style="color:var(--text3);text-align:center;padding:20px;font-size:.9rem">Noch keine Spieler hinzugefügt</p>' : `

        <thead><tr><th>#</th><th>Name</th>${isKratzer ? '<th style="text-align:center">Leben</th>' : ''}<th style="text-align:center">Status</th><th></th></tr></thead>

    </div>
    <div class="flex gap-1 mt-2">

      <button class="btn btn-primary" style="flex:1" onclick="startTournament()" ${STATE.players.length < 2 ? 'disabled style="opacity:.4;flex:1"' : 'style="flex:1"'}>

window.addPlayer = function() {
  const nameInput = document.getElementById('player-name');
  const name = nameInput.value.trim();
  if (!name) return;
  
  const isKratzer = STATE.gameMode === 'kratzer';
  const lives = isKratzer ? parseInt(document.getElementById('player-lives').value) || 3 : 0;
  const entry = parseFloat(document.getElementById('player-entry').value) || STATE.entryFee;
  
  STATE.players.push({
    id: STATE.nextPlayerId++,
    name,
    paid: false,
    lives,
    maxLives: lives,
    entry
  });
  
  nameInput.value = '';
  nameInput.focus();
  renderPlayers();
};

window.addSavedPlayer = function(name) {
  const isKratzer = STATE.gameMode === 'kratzer';
  const lives = isKratzer ? 3 : 0;
  
  STATE.players.push({
    id: STATE.nextPlayerId++,
    name,
    paid: false,
    lives,
    maxLives: lives,
    entry: STATE.entryFee
  });
  
  renderPlayers();
};

window.removePlayer = function(id) {
  const idx = STATE.players.findIndex(p => p.id === id);
  if (idx !== -1) {
    STATE.players.splice(idx, 1);
    renderPlayers();
  }
};

window.togglePay = function(id) {
  const player = STATE.players.find(p => p.id === id);
  if (player) {
    player.paid = !player.paid;
    renderPlayers();
  }
};

window.changeLives = function(id, delta) {
  const player = STATE.players.find(p => p.id === id);
  if (player) {
    player.lives = Math.max(0, Math.min(player.maxLives + 5, player.lives + delta));
    renderPlayers();
  }
};

// === TOURNAMENT LOGIC ===
window.startTournament = function() {
  if (STATE.players.length < 2) return;
  
  // Initialize machines
  STATE.machineStates = [];
  for (let i = 1; i <= STATE.machines; i++) {
    STATE.machineStates.push({ id: i, busy: false, match: null });
  }
  
  const isKratzer = STATE.gameMode === 'kratzer';
  
  if (isKratzer) {
    // Initialize Kratzer
    STATE.kratzerRound = 1;
    STATE.kratzerGroups = [];
    STATE.eliminatedPlayers = [];
    STATE.placementOrder = [];
    
    // Create groups of 3-4 players
    const shuffled = [...STATE.players].sort(() => Math.random() - 0.5);
    const groupSize = shuffled.length <= 12 ? 3 : 4;
    
    for (let i = 0; i < shuffled.length; i += groupSize) {
      const groupPlayers = shuffled.slice(i, i + groupSize);
      STATE.kratzerGroups.push({
        id: STATE.nextMatchId++,
        players: groupPlayers.map(p => ({ id: p.id, name: p.name, lives: p.lives, maxLives: p.maxLives })),
        loserIdx: null,
        completed: false,
        machine: null
      });
    }
  } else {
    // Initialize Double-KO
    STATE.winnersBracket = [];
    STATE.losersBracket = [];
    STATE.finalMatch = null;
    STATE.eliminatedPlayers = [];
    STATE.placementOrder = [];
    STATE.currentRound = 0;
    STATE.matchQueue = [];
    
    // Create first round of winners bracket
    const shuffled = [...STATE.players].sort(() => Math.random() - 0.5);
    const firstRound = [];
    
    for (let i = 0; i < shuffled.length; i += 2) {
      if (i + 1 < shuffled.length) {
        firstRound.push({
          id: STATE.nextMatchId++,
          player1: { id: shuffled[i].id, name: shuffled[i].name },
          player2: { id: shuffled[i + 1].id, name: shuffled[i + 1].name },
          winner: null,
          loser: null,
          completed: false,
          bracket: 'winners',
          machine: null
        });
      } else {
        // Bye
        firstRound.push({
          id: STATE.nextMatchId++,
          player1: { id: shuffled[i].id, name: shuffled[i].name },
          player2: null,
          winner: shuffled[i],
          loser: null,
          completed: true,
          bracket: 'winners',
          machine: null
        });
      }
    }
    
    STATE.winnersBracket.push(firstRound);
  }
  
  STATE.tournamentActive = true;
  renderTournament();
  showScreen('tournament');
};

// === TOURNAMENT SCREEN ===
function renderTournament() {
  const el = document.getElementById('screen-tournament');
  const isKratzer = STATE.gameMode === 'kratzer';
  
  let html = `
    <div class="flex justify-between items-center mb-2" style="margin-bottom:16px">
      <button class="btn btn-ghost" onclick="showQRCode()">&#128247; Live-Ansicht</button>
      <div style="font-family:'Oswald';font-size:1.3rem;color:var(--accent)">
        ${isKratzer ? 'Kratzer - Runde ' + STATE.kratzerRound : 'Doppel-KO Turnier'}
      </div>
      <button class="btn btn-ghost" onclick="showLiveMatch()">&#127919; Live-Match</button>
    </div>
  `;
  
  if (isKratzer) {
    html += renderKratzerTournament();
  } else {
    html += renderDoubleKOTournament();
  }
  
  el.innerHTML = html;
}

function renderKratzerTournament() {
  const currentGroups = STATE.kratzerGroups.filter(g => !g.completed);
  const completedGroups = STATE.kratzerGroups.filter(g => g.completed);
  
  let html = '';
  
  // Current round groups
  if (currentGroups.length > 0) {
    html += `<div class="card"><div class="card-title"><div class="icon">&#127922;</div> Runde ${STATE.kratzerRound}</div>`;
    html += `<div class="machine-grid">`;
    
    currentGroups.forEach(group => {
      const machine = STATE.machineStates.find(m => m.match && m.match.id === group.id);
      const isBusy = machine && machine.busy;
      
      html += `
        <div class="machine-card ${isBusy ? 'busy' : 'ready'}" onclick="${!isBusy ? `assignKratzerGroup(${group.id})` : ''}">
          <div class="machine-name">Gruppe ${group.id}</div>
          <div class="machine-status ${isBusy ? 'busy' : 'free'}">${isBusy ? 'Läuft' : 'Bereit'}</div>
          <div class="machine-match">
            ${group.players.map(p => `<div style="font-size:.82rem;color:var(--text2)">${esc(p.name)} (${p.lives}&#10084;)</div>`).join('')}
          </div>
          ${!isBusy && !group.machine ? `<button class="btn btn-sm btn-primary mt-1" style="margin-top:8px" onclick="event.stopPropagation();assignKratzerGroup(${group.id})">Automat zuweisen</button>` : ''}
        </div>
      `;
    });
    
    html += `</div></div>`;
  }
  
  // Check if round is complete
  if (currentGroups.length === 0 && completedGroups.length > 0) {
    const allLosersSelected = completedGroups.every(g => g.loserIdx !== null);
    
    if (allLosersSelected) {
      const activePlayers = STATE.players.filter(p => !STATE.eliminatedPlayers.includes(p.id));
      
      if (activePlayers.length <= 1) {
        // Tournament complete
        html += renderTournamentComplete();
      } else {
        // Next round
        html += `
          <div class="card" style="text-align:center;padding:40px">
            <h3 style="font-family:'Oswald';font-size:1.5rem;color:var(--accent);margin-bottom:16px">Runde ${STATE.kratzerRound} abgeschlossen</h3>
            <p style="color:var(--text2);margin-bottom:20px">${activePlayers.length} Spieler verbleibend</p>
            <button class="btn btn-primary" onclick="startNextKratzerRound()">Nächste Runde starten</button>
          </div>
        `;
      }
    } else {
      html += `
        <div class="card" style="text-align:center;padding:20px">
          <p style="color:var(--accent3)">Bitte wähle die Verlierer aller Gruppen aus</p>
        </div>
      `;
    }
  }
  
  // Completed groups with loser selection
  completedGroups.forEach(group => {
    if (group.loserIdx === null) {
      html += `
        <div class="card">
          <div class="card-title"><div class="icon">&#128165;</div> Verlierer auswählen - Gruppe ${group.id}</div>
          <div style="display:flex;flex-wrap:wrap;gap:8px">
            ${group.players.map((p, idx) => `
              <button class="btn btn-ghost" onclick="selectKratzerLoser(${group.id}, ${idx})">
                ${esc(p.name)} (${p.lives}&#10084;)
              </button>
            `).join('')}
          </div>
        </div>
      `;
    }
  });
  
  // Eliminated players
  if (STATE.eliminatedPlayers.length > 0) {
    html += `
      <div class="card">
        <div class="card-title"><div class="icon">&#128128;</div> Ausgeschieden (${STATE.eliminatedPlayers.length})</div>
        <div style="display:flex;flex-wrap:wrap;gap:8px">
          ${STATE.eliminatedPlayers.map(id => {
            const player = STATE.players.find(p => p.id === id);
            return player ? `<div style="background:var(--bg3);padding:8px 16px;border-radius:20px;font-size:.85rem;opacity:.6">${esc(player.name)}</div>` : '';
          }).join('')}
        </div>
      </div>
    `;
  }
  
  return html;
}

window.assignKratzerGroup = function(groupId) {
  const group = STATE.kratzerGroups.find(g => g.id === groupId);
  if (!group) return;
  
  const freeMachine = STATE.machineStates.find(m => !m.busy);
  if (!freeMachine) {
    alert('Kein freier Automat verfügbar!');
    return;
  }
  
  freeMachine.busy = true;
  freeMachine.match = group;
  group.machine = freeMachine.id;
  
  renderTournament();
};

window.selectKratzerLoser = function(groupId, loserIdx) {
  const group = STATE.kratzerGroups.find(g => g.id === groupId);
  if (!group) return;
  
  group.loserIdx = loserIdx;
  group.completed = true;
  
  // Mark player as eliminated
  const loser = group.players[loserIdx];
  STATE.eliminatedPlayers.push(loser.id);
  STATE.placementOrder.push(loser.id);
  
  // Free machine
  const machine = STATE.machineStates.find(m => m.id === group.machine);
  if (machine) {
    machine.busy = false;
    machine.match = null;
  }
  group.machine = null;
  
  renderTournament();
};

window.startNextKratzerRound = function() {
  STATE.kratzerRound++;
  
  const activePlayers = STATE.players.filter(p => !STATE.eliminatedPlayers.includes(p.id));
  const shuffled = [...activePlayers].sort(() => Math.random() - 0.5);
  const groupSize = shuffled.length <= 12 ? 3 : 4;
  
  STATE.kratzerGroups = [];
  
  for (let i = 0; i < shuffled.length; i += groupSize) {
    const groupPlayers = shuffled.slice(i, i + groupSize);
    STATE.kratzerGroups.push({
      id: STATE.nextMatchId++,
      players: groupPlayers.map(p => {
        const original = STATE.players.find(op => op.id === p.id);
        return { id: p.id, name: p.name, lives: original ? original.lives : p.lives, maxLives: original ? original.maxLives : p.maxLives };
      }),
      loserIdx: null,
      completed: false,
      machine: null
    });
  }
  
  renderTournament();
};

function renderDoubleKOTournament() {
  let html = '';
  
  // Winners bracket
  html += `<div class="card"><div class="card-title"><div class="icon">&#127942;</div> Gewinner-Bracket</div>`;
  html += renderBracket(STATE.winnersBracket, 'winners');
  html += `</div>`;
  
  // Losers bracket
  if (STATE.losersBracket.length > 0) {
    html += `<div class="card"><div class="card-title"><div class="icon">&#128170;</div> Verlierer-Bracket</div>`;
    html += renderBracket(STATE.losersBracket, 'losers');
    html += `</div>`;
  }
  
  // Final
  if (STATE.finalMatch) {
    html += `<div class="card"><div class="card-title"><div class="icon">&#127941;</div> Finale</div>`;
    html += renderMatch(STATE.finalMatch);
    html += `</div>`;
  }
  
  // Check tournament completion
  const activePlayers = STATE.players.filter(p => !STATE.eliminatedPlayers.includes(p.id));
  if (activePlayers.length <= 1) {
    html += renderTournamentComplete();
  }
  
  return html;
}

function renderBracket(bracket, type) {
  let html = '<div class="bracket-container"><div style="display:flex;gap:20px;overflow-x:auto;padding-bottom:12px">';
  
  bracket.forEach((round, roundIdx) => {
    html += `<div class="bracket-round">`;
    html += `<div style="font-size:.75rem;color:var(--text3);margin-bottom:8px">Runde ${roundIdx + 1}</div>`;
    
    round.forEach(match => {
      html += renderMatch(match);
    });
    
    html += `</div>`;
  });
  
  html += `</div></div>`;
  return html;
}

function renderMatch(match) {
  if (!match) return '';
  
  const machine = STATE.machineStates.find(m => m.match && m.match.id === match.id);
  const isBusy = machine && machine.busy;
  const canAssign = !isBusy && !match.completed && !match.machine;
  
  let html = `
    <div class="bracket-match ${match.completed ? 'completed' : ''}" ${canAssign ? `onclick="assignMatch(${match.id})"` : ''}>
  `;
  
  if (match.player1) {
    html += `<div class="bracket-player ${match.winner && match.winner.id === match.player1.id ? 'winner' : ''} ${match.loser && match.loser.id === match.player1.id ? 'loser' : ''}">${esc(match.player1.name)}</div>`;
  }
  
  html += `<div class="bracket-vs">VS</div>`;
  
  if (match.player2) {
    html += `<div class="bracket-player ${match.winner && match.winner.id === match.player2.id ? 'winner' : ''} ${match.loser && match.loser.id === match.player2.id ? 'loser' : ''}">${esc(match.player2.name)}</div>`;
  } else {
    html += `<div class="bracket-player" style="opacity:.3">TBD</div>`;
  }
  
  if (match.completed && match.winner) {
    html += `<div style="margin-top:8px;font-size:.75rem;color:var(--green)">✓ ${esc(match.winner.name)} gewinnt</div>`;
  }
  
  if (canAssign) {
    html += `<div style="margin-top:8px;font-size:.75rem;color:var(--accent3)">Klicken zum Starten</div>`;
  }
  
  if (isBusy) {
    html += `<div style="margin-top:8px;font-size:.75rem;color:var(--accent3)">Automat ${machine.id} - Läuft</div>`;
  }
  
  html += `</div>`;
  return html;
}

window.assignMatch = function(matchId) {
  const freeMachine = STATE.machineStates.find(m => !m.busy);
  if (!freeMachine) {
    alert('Kein freier Automat verfügbar!');
    return;
  }
  
  // Find match in brackets
  let match = null;
  for (const round of STATE.winnersBracket) {
    match = round.find(m => m.id === matchId);
    if (match) break;
  }
  
  if (!match) {
    for (const round of STATE.losersBracket) {
      match = round.find(m => m.id === matchId);
      if (match) break;
    }
  }
  
  if (!match && STATE.finalMatch && STATE.finalMatch.id === matchId) {
    match = STATE.finalMatch;
  }
  
  if (!match) return;
  
  freeMachine.busy = true;
  freeMachine.match = match;
  match.machine = freeMachine.id;
  
  renderTournament();
};

function renderTournamentComplete() {
  const winner = STATE.eliminatedPlayers.length > 0 ? null : STATE.players.find(p => !STATE.eliminatedPlayers.includes(p.id));
  
  if (!winner && STATE.placementOrder.length > 0) {
    const lastPlayer = STATE.players.find(p => !STATE.eliminatedPlayers.includes(p.id));
    if (lastPlayer) {
      STATE.placementOrder.unshift(lastPlayer.id);
    }
  }
  
  const totalPrize = STATE.players.reduce((sum, p) => sum + (p.entry || STATE.entryFee), 0);
  
  let html = `
    <div class="card" style="text-align:center;padding:40px">
      <h2 style="font-family:'Oswald';font-size:2rem;color:var(--accent);margin-bottom:16px">&#127942; Turnier beendet!</h2>
  `;
  
  if (STATE.placementOrder.length > 0) {
    html += `<div style="margin-bottom:20px">`;
    
    STATE.placementOrder.slice(0, 4).forEach((playerId, idx) => {
      const player = STATE.players.find(p => p.id === playerId);
      if (!player) return;
      
      const prize = totalPrize * (STATE.prizeDistribution[idx] / 100);
      const placeClass = idx === 0 ? 'gold' : idx === 1 ? 'silver' : idx === 2 ? 'bronze' : '';
      const medals = ['&#129351;', '&#129352;', '&#129353;', '4.'];
      
      html += `
        <div style="background:var(--bg3);border:2px solid var(--${placeClass || 'bg4'});border-radius:var(--radius);padding:16px;margin-bottom:8px;text-align:left">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <div>
              <div style="font-size:1.5rem">${medals[idx]}</div>
              <div style="font-family:'Oswald';font-size:1.2rem;margin-top:4px">${esc(player.name)}</div>
            </div>
            ${prize > 0 ? `<div style="font-size:1.2rem;color:var(--green);font-weight:600">${prize.toFixed(2)} €</div>` : ''}
          </div>
        </div>
      `;
    });
    
    html += `</div>`;
  }
  
  html += `
      <button class="btn btn-primary" onclick="showResults()">Ergebnisse anzeigen</button>
    </div>
  `;
  
  return html;
}

window.showResults = function() {
  const el = document.getElementById('screen-results');
  const totalPrize = STATE.players.reduce((sum, p) => sum + (p.entry || STATE.entryFee), 0);
  
  let html = `
    <div class="card">
      <div class="card-title"><div class="icon">&#127942;</div> Turnierergebnisse</div>
      <div style="margin-bottom:20px">
  `;
  
  STATE.placementOrder.slice(0, 4).forEach((playerId, idx) => {
    const player = STATE.players.find(p => p.id === playerId);
    if (!player) return;
    
    const prize = totalPrize * (STATE.prizeDistribution[idx] / 100);
    const placeClass = idx === 0 ? 'gold' : idx === 1 ? 'silver' : idx === 2 ? 'bronze' : '';
    
    html += `
      <div class="result-card ${placeClass}">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div class="result-place ${placeClass}">${idx + 1}. Platz</div>
            <div class="result-name">${esc(player.name)}</div>
          </div>
          ${prize > 0 ? `<div class="result-prize">${prize.toFixed(2)} €</div>` : ''}
        </div>
      </div>
    `;
  });
  
  html += `
      </div>
      <button class="btn btn-primary" onclick="resetAll()">Neues Turnier</button>
    </div>
  `;
  
  el.innerHTML = html;
  showScreen('results');
};

window.resetAll = function() {
  // Save current players to history before resetting
  if (STATE.players && STATE.players.length > 0) {
    const currentNames = STATE.players.map(p => p.name);
    
    // Initialize playerHistory if not exists
    if (!STATE.playerHistory) STATE.playerHistory = [];
    
    // Add new names to the beginning, avoiding duplicates
    currentNames.forEach(name => {
      const idx = STATE.playerHistory.indexOf(name);
      if (idx !== -1) {
        // Remove from current position
        STATE.playerHistory.splice(idx, 1);
      }
      // Add to the beginning
      STATE.playerHistory.unshift(name);
    });
    
    // Keep only the last 20 players
    if (STATE.playerHistory.length > 20) {
      STATE.playerHistory = STATE.playerHistory.slice(0, 20);
    }
  }
  
  STATE.players = [];
  STATE.winnersBracket = [];
  STATE.losersBracket = [];
  STATE.finalMatch = null;
  STATE.tournamentActive = false;
  STATE.eliminatedPlayers = [];
  STATE.placementOrder = [];
  STATE.results = null;
  STATE.nextPlayerId = 1;
  STATE.nextMatchId = 1;
  delete STATE._winnersChamp;
  delete STATE._losersChamp;
  // Reset Kratzer state
  STATE.kratzerRound = 1;
  STATE.kratzerGroups = [];
  // Don't reset members - they persist across tournaments
  showScreen('setup');
}

  if (!isNaN(newFelgeCost) && newFelgeCost >= 0) {

window.switchMemberTab = function(tabId) {
  currentMemberTab = tabId;
  ['tab-kader','tab-birthdays'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = id === tabId ? '' : 'none';
  });
  // Update tab buttons
  document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
  const activeTab = document.querySelector(`.tabs .tab[onclick*="${tabId}"]`);
  if (activeTab) activeTab.classList.add('active');
}

function renderBirthdaysView() {
  if (STATE.members.length === 0) {
    return '<div class="card"><p style="color:var(--text3);text-align:center;padding:40px">Noch keine Mitglieder vorhanden</p></div>';
  }
  
  // Filter members with birthdays and calculate days until next birthday
  const membersWithBirthdays = STATE.members.filter(m => m.birthday).map(m => {
    const birthDate = new Date(m.birthday);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    
    // Calculate next birthday
    const nextBirthday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
    if (nextBirthday < today) {
      nextBirthday.setFullYear(nextBirthday.getFullYear() + 1);
    }
    
    // Calculate days until birthday
    const diffTime = nextBirthday - today;
    const daysUntil = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    
    return {
      ...m,
      daysUntilBirthday: daysUntil,
      nextBirthday: nextBirthday
    };
  });
  
  if (membersWithBirthdays.length === 0) {
    return '<div class="card"><p style="color:var(--text3);text-align:center;padding:40px">Keine Geburtstage eingetragen</p></div>';
  }
  
  // Sort by days until birthday
  membersWithBirthdays.sort((a, b) => a.daysUntilBirthday - b.daysUntilBirthday);
  
  let html = '<div class="card"><div class="card-title"><div class="icon">&#127874;</div> Geburtstage</div>';
  
  membersWithBirthdays.forEach((m, idx) => {
    const isToday = m.daysUntilBirthday === 0;
    const isNextWeek = m.daysUntilBirthday <= 7;
    const birthDate = new Date(m.birthday);
    const age = new Date().getFullYear() - birthDate.getFullYear();
    
    let badgeColor = 'var(--red)';
    let badgeBg = 'rgba(255,23,68,.15)';
    let badgeText = '';
    
    if (isToday) {
      badgeColor = 'var(--green)';
      badgeBg = 'rgba(0,230,118,.2)';
      badgeText = '&#127881; HEUTE!';
    } else if (isNextWeek) {
      badgeColor = 'var(--accent3)';
      badgeBg = 'rgba(255,170,0,.15)';
      badgeText = `in ${m.daysUntilBirthday} ${m.daysUntilBirthday === 1 ? 'Tag' : 'Tagen'}`;
    } else {
      badgeText = `in ${m.daysUntilBirthday} Tagen`;
    }
    
    const borderColor = isToday ? 'var(--green)' : (isNextWeek ? 'var(--accent3)' : 'var(--bg4)');
    const borderWidth = isToday ? '2px' : '1px';
    
    html += `
      <div style="background:var(--bg3);border:${borderWidth} solid ${borderColor};border-radius:var(--radius);padding:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;${idx === 0 && !isToday ? 'border-color:var(--red);border-width:2px;background:rgba(255,23,68,.05)' : ''}">
        <div style="display:flex;align-items:center;gap:16px">
          ${idx === 0 && !isToday ? '<div style="font-size:1.5rem">&#128293;</div>' : ''}
          <div>
            <div style="font-family:'Oswald';font-size:1.2rem;font-weight:600;${idx === 0 ? 'color:var(--red)' : ''}">${esc(m.name)}</div>
            <div style="font-size:.85rem;color:var(--text2);margin-top:4px">
              ${formatDate(m.birthday)} ${!isNaN(age) ? `(${age} Jahre)` : ''}
            </div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-family:'Oswald';font-size:1.6rem;font-weight:700;color:${badgeColor};padding:4px 12px;background:${badgeBg};border-radius:var(--radius)">
            ${badgeText}
          </div>
        </div>
      </div>
    `;
  });
  
  html += '</div>';
  return html;
}

window.addMember = function() {
  const name = document.getElementById('member-name').value.trim();
  const birthday = document.getElementById('member-birthday').value;
  const jerseySize = document.getElementById('member-jersey').value;
  const felgeCount = parseInt(document.getElementById('member-felge').value) || 0;
  
  if (!name) {
    alert('Bitte Name eingeben');
    return;
  }
  
  STATE.members.push({
    id: STATE.nextMemberId++,
    name,
    birthday,
    jerseySize,
    felgeCount,
    paidMonths: [],
    penalties: []
  });
  
  renderMembers();
}

window.editMember = function(id) {

  if (!member) return;
  
  const modal = document.createElement('div');

  modal.innerHTML = `
    <div style="background:var(--bg2);border:2px solid var(--accent);border-radius:var(--radius);padding:24px;max-width:500px;width:100%">
      <h3 style="font-family:'Oswald';color:var(--accent);margin-bottom:20px;font-size:1.3rem">Mitglied bearbeiten</h3>
      
      <div style="margin-bottom:12px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Name</label>
        <input type="text" id="edit-member-name" value="${esc(member.name)}" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px;font-size:1rem">
      </div>
      
      <div style="margin-bottom:12px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Geburtstag</label>
        <input type="date" id="edit-member-birthday" value="${member.birthday || ''}" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px;font-size:1rem">
      </div>
      
      <div style="margin-bottom:12px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Trikotgröße</label>
        <select id="edit-member-jersey" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px;font-size:1rem">
          <option value="">-</option>
          <option value="XS" ${member.jerseySize === 'XS' ? 'selected' : ''}>XS</option>
          <option value="S" ${member.jerseySize === 'S' ? 'selected' : ''}>S</option>
          <option value="M" ${member.jerseySize === 'M' ? 'selected' : ''}>M</option>
          <option value="L" ${member.jerseySize === 'L' ? 'selected' : ''}>L</option>
          <option value="XL" ${member.jerseySize === 'XL' ? 'selected' : ''}>XL</option>
          <option value="XXL" ${member.jerseySize === 'XXL' ? 'selected' : ''}>XXL</option>
          <option value="XXXL" ${member.jerseySize === 'XXXL' ? 'selected' : ''}>XXXL</option>
        </select>
      </div>
      
      <div style="margin-bottom:20px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Felgen</label>
        <input type="number" id="edit-member-felge" value="${member.felgeCount || 0}" min="0" step="1" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px;font-size:1rem">
      </div>
      
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="this.closest('div[style*=fixed]').remove()">Abbrechen</button>
        <button class="btn btn-primary" onclick="saveMember(${id})">Speichern</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

window.saveMember = function(id) {
  const member = STATE.members.find(m => m.id === id);
  if (!member) return;
  
  member.name = document.getElementById('edit-member-name').value.trim();
  member.birthday = document.getElementById('edit-member-birthday').value;
  member.jerseySize = document.getElementById('edit-member-jersey').value;
  member.felgeCount = parseInt(document.getElementById('edit-member-felge').value) || 0;
  
  document.body.querySelector('div[style*="position:fixed"][style*="z-index:10000"]').remove();
  
  renderMembers();
}

window.deleteMember = function(id) {
  if (!confirm('Mitglied wirklich löschen? Alle Daten gehen verloren.')) return;
  
  const idx = STATE.members.findIndex(m => m.id === id);
  if (idx !== -1) {
    STATE.members.splice(idx, 1);
    renderMembers();
  }
}

window.togglePaidMonth = function(memberId, monthIdx) {
  const member = STATE.members.find(m => m.id === memberId);
  if (!member) return;
  
  if (!member.paidMonths) member.paidMonths = [];
  
  const idx = member.paidMonths.indexOf(monthIdx);
  if (idx >= 0) {
    member.paidMonths.splice(idx, 1);
  } else {
    member.paidMonths.push(monthIdx);
    member.paidMonths.sort((a, b) => a - b);
  }
  
  renderMembers();
}

window.addPenalty = function(memberId) {
  const member = STATE.members.find(m => m.id === memberId);
  if (!member) return;
  
  const modal = document.createElement('div');
  modal.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px';
  modal.innerHTML = `
    <div style="background:var(--bg2);border:2px solid var(--accent2);border-radius:var(--radius);padding:24px;max-width:400px;width:100%">
      <h3 style="font-family:'Oswald';color:var(--accent2);margin-bottom:20px;font-size:1.3rem">Strafe hinzufügen</h3>
      
      <div style="margin-bottom:12px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Grund</label>
        <input type="text" id="penalty-type" placeholder="z.B. Zu spät, Vergessen, etc." style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px;font-size:1rem">
      </div>
      
      <div style="margin-bottom:12px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Betrag (€)</label>
        <input type="number" id="penalty-amount" value="5" min="0" step="0.50" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px;font-size:1rem">
      </div>
      
      <div style="margin-bottom:20px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Datum</label>
        <input type="date" id="penalty-date" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px;font-size:1rem">
      </div>
      
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="this.closest('div[style*=fixed]').remove()">Abbrechen</button>
        <button class="btn btn-danger" onclick="savePenalty(${memberId})">Speichern</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  
  // Set default date to today
  document.getElementById('penalty-date').valueAsDate = new Date();
}

window.savePenalty = function(memberId) {
  const member = STATE.members.find(m => m.id === memberId);
  if (!member) return;
  
  const type = document.getElementById('penalty-type').value.trim();
  const amount = parseFloat(document.getElementById('penalty-amount').value);
  const date = document.getElementById('penalty-date').value;
  
  if (!type || isNaN(amount) || amount <= 0 || !date) {
    alert('Bitte alle Felder korrekt ausfüllen');
    return;
  }
  
  if (!member.penalties) member.penalties = [];
  
  member.penalties.push({ type, amount, date });
  
  document.body.querySelector('div[style*="position:fixed"][style*="z-index:10000"]').remove();
  
  renderMembers();
}

window.deletePenalty = function(memberId, penaltyIdx) {
  const member = STATE.members.find(m => m.id === memberId);
  if (!member || !member.penalties) return;
  
  if (!confirm('Diese Strafe wirklich löschen?')) return;
  
  member.penalties.splice(penaltyIdx, 1);
  renderMembers();
}

function formatDate(dateStr) {
  if (!dateStr) return '-';
  const d = new Date(dateStr);
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

// === QR CODE & LIVE VIEW ===
function showQRCode() {
  const el = document.getElementById('qr-overlay');
  el.classList.add('active');
  
  const url = window.location.href;
  document.getElementById('qr-url').textContent = url;
  
  // Generate QR code
  const qrEl = document.getElementById('qr-code');
  qrEl.innerHTML = '';
  new QRCode(qrEl, {
    text: url,
    width: 200,
    height: 200,
    colorDark: '#000000',
    colorLight: '#ffffff'
  });
}

window.closeQR = function() {
  document.getElementById('qr-overlay').classList.remove('active');
}

window.showLiveMatch = function() {
  const el = document.getElementById('live-overlay');
  el.classList.add('active');
  
  renderLiveMatch();
}

window.closeLiveMatch = function() {
  document.getElementById('live-overlay').classList.remove('active');
}

function renderLiveMatch() {
  const el = document.getElementById('live-content');
  const isKratzer = STATE.gameMode === 'kratzer';
  const totalPrize = STATE.players.length * STATE.entryFee;
  
  let contentHtml = '';
  
  if (isKratzer) {
    // Kratzer Live View
    const activePlayers = STATE.players.filter(p => p.lives > 0);
    const eliminatedPlayers = STATE.eliminatedPlayers.map(id => STATE.players.find(p => p.id === id)).filter(Boolean);
    
    // Machines
    let machinesHtml = STATE.machineStates.map(m => {
      const group = m.match;
      let statusClass = 'free';
      let statusText = 'Frei';
      let matchInfo = '';
      
      if (group && !group.completed) {
        statusClass = 'busy';
        statusText = 'Belegt';
        matchInfo = `<div style="font-size:.82rem;color:var(--text);margin-top:4px">
          ${group.players.map(p => esc(p.name)).join(', ')}
        </div>`;
      }
      
      return `
        <div class="live-machine ${statusClass}">
          <div class="live-machine-header">
            <span class="live-machine-name">Automat ${m.id}</span>
            <span class="live-machine-status ${statusClass}">${statusText}</span>
          </div>
          ${matchInfo}
        </div>
      `;
    }).join('');
    
    // Players
    let playersHtml = activePlayers.map(p => {
      const hearts = '&#10084;'.repeat(p.lives) + '&#9825;'.repeat(Math.max(0, p.maxLives - p.lives));
      return `
        <div class="live-player-card">
          <span class="live-player-name">${esc(p.name)}</span>
          <span class="live-player-lives">${hearts}</span>
        </div>
      `;
    }).join('');
    
    // Eliminated
    let eliminatedHtml = eliminatedPlayers.length > 0 ? `
      <div class="live-section">
        <div class="live-section-title">Ausgeschieden</div>
        <div class="live-player-list">
          ${eliminatedPlayers.map(p => `
            <div class="live-player-card live-eliminated">
              <span class="live-player-name">${esc(p.name)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    ` : '';
    
    contentHtml = `
      <div class="live-section">
        <div class="live-section-title">Aktuelle Runde ${STATE.kratzerRound}</div>
        <div class="live-machine-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px">
          ${machinesHtml}
        </div>
      </div>
      
      <div class="live-section">
        <div class="live-section-title">Aktive Spieler (${activePlayers.length})</div>
        <div class="live-player-list">
          ${playersHtml}
        </div>
      </div>
      
      ${eliminatedHtml}
    `;
  } else {
    // Double-KO Live View
    let machinesHtml = STATE.machineStates.map(m => {
      const match = m.match;
      let statusClass = 'free';
      let statusText = 'Frei';
      let matchInfo = '';
      
      if (match && !match.completed) {
        statusClass = 'busy';
        statusText = 'Belegt';
        const bracketText = match.bracket === 'winners' ? 'Gewinner' : (match.bracket === 'losers' ? 'Verlierer' : 'Finale');
        matchInfo = `<div style="font-size:.82rem;color:var(--text);margin-top:4px">
          <div style="font-size:.7rem;color:var(--text3);margin-bottom:2px">${bracketText}</div>
          ${esc(match.player1.name)} VS ${esc(match.player2.name)}
        </div>`;
      }
      
      return `
        <div class="live-machine ${statusClass}">
          <div class="live-machine-header">
            <span class="live-machine-name">Automat ${m.id}</span>
            <span class="live-machine-status ${statusClass}">${statusText}</span>
          </div>
          ${matchInfo}
        </div>
      `;
    }).join('');
    
    const activePlayers = STATE.players.filter(p => !STATE.eliminatedPlayers.includes(p.id));
    
    let playersHtml = activePlayers.map(p => `
      <div class="live-player-card">
        <span class="live-player-name">${esc(p.name)}</span>
      </div>
    `).join('');
    
    contentHtml = `
      <div class="live-section">
        <div class="live-section-title">Automaten</div>
        <div class="live-machine-grid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px">
          ${machinesHtml}
        </div>
      </div>
      
      <div class="live-section">
        <div class="live-section-title">Aktive Spieler (${activePlayers.length})</div>
        <div class="live-player-list">
          ${playersHtml}
        </div>
      </div>
    `;
  }
  
  el.innerHTML = `
    <div class="live-view">
      <div class="live-header">
        <div class="live-title">DARTPRO LIVE</div>
        <div class="live-subtitle">${isKratzer ? 'Kratzer Turnier' : 'Doppel-KO Turnier'} &bull; ${STATE.gameMode.toUpperCase()} &bull; ${totalPrize.toFixed(0)} € Preisgeld</div>
        <div class="live-round-badge" style="margin-top:12px">${STATE.players.length} Spieler</div>
      </div>
      
      ${contentHtml}
      
      <div style="text-align:center;margin-top:32px;padding-top:20px;border-top:1px solid var(--bg4)">
        <button class="btn btn-ghost" onclick="showScreen('tournament')">&larr; Zurück zum Turnier</button>
      </div>
    </div>
  `;
}
