<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DartPro - Team & Kasse</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Barlow:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0f;--bg2:#12121a;--bg3:#1a1a28;--bg4:#222236;
  --accent:#00e5ff;--accent2:#ff3d71;--accent3:#ffaa00;--green:#00e676;--red:#ff1744;
  --text:#e8e8f0;--text2:#9898b0;--text3:#5a5a78;
  --radius:8px;--radius2:12px;
}
html{font-size:15px}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
h1,h2,h3,h4{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.04em}
button{font-family:'Barlow',sans-serif;cursor:pointer;border:none;outline:none;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
input,select{font-family:'Barlow',sans-serif;outline:none}
.app{max-width:1400px;margin:0 auto;padding:20px}
.screen{display:none}
.screen.active{display:block}

.header{text-align:center;padding:30px 0 20px;position:relative}
.header::after{content:'';position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:120px;height:2px;background:linear-gradient(90deg,transparent,var(--accent),transparent)}
.logo{font-family:'Oswald',sans-serif;font-size:2.8rem;font-weight:700;letter-spacing:.08em;background:linear-gradient(135deg,var(--accent),#7c4dff);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.logo span{font-weight:300;font-size:1.4rem;display:block;letter-spacing:.2em;-webkit-text-fill-color:var(--text2);margin-top:2px}

.card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius2);padding:24px;margin-bottom:16px;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.card-title{font-size:1.1rem;color:var(--accent);margin-bottom:16px;display:flex;align-items:center;gap:8px}
.card-title .icon{width:28px;height:28px;background:var(--bg3);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:1rem}

.form-row{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap;align-items:end}
.form-group{display:flex;flex-direction:column;gap:4px;flex:1;min-width:140px}
label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;font-weight:500}
input,select{background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px 12px;border-radius:6px;font-size:.95rem;width:100%}
input:focus,select:focus{border-color:var(--accent)}

.btn{padding:10px 20px;border-radius:6px;font-size:.95rem;transition:all .2s;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--accent),#0099cc);color:#000}
.btn-primary:hover{transform:translateY(-1px)}
.btn-ghost{background:var(--bg3);color:var(--text);border:1px solid var(--bg4)}
.btn-ghost:hover{background:var(--bg4)}
.btn-success{background:var(--green);color:#000}
.btn-danger{background:var(--red);color:#fff}
.btn-sm{padding:6px 12px;font-size:.8rem}

.member-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius);padding:16px;text-align:center}
.stat-card.highlight{border-color:var(--accent);box-shadow:0 0 20px rgba(0,229,255,.15)}
.stat-label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:4px}
.stat-value{font-family:'Oswald';font-size:1.8rem;font-weight:600;color:var(--accent)}

.tabs{display:flex;gap:4px;margin-bottom:20px;border-bottom:2px solid var(--bg4);padding-bottom:4px}
.tab{padding:10px 20px;background:transparent;color:var(--text2);border:none;border-bottom:2px solid transparent;margin-bottom:-6px;transition:all .2s;font-size:.9rem}
.tab:hover{color:var(--text)}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}

.edit-btn{background:transparent;border:1px solid var(--bg4);color:var(--text2);padding:4px 8px;border-radius:4px;font-size:.85rem;cursor:pointer}
.edit-btn:hover{background:var(--bg3);color:var(--accent);border-color:var(--accent)}

@media(max-width:768px){
  .form-row{flex-direction:column}
  .form-group{min-width:100%}
}

/* Login Screen */
.login-wrap{display:flex;align-items:center;justify-content:center;min-height:80vh}
.login-box{background:var(--bg2);border:1px solid var(--bg4);border-radius:var(--radius2);padding:40px;max-width:420px;width:100%;position:relative;overflow:hidden}
.login-box::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--accent),var(--accent2))}
.login-box h2{font-family:'Oswald';text-align:center;margin-bottom:24px;color:var(--accent);font-size:1.6rem}
.login-box .form-group{margin-bottom:14px}
.login-box label{font-size:.75rem;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;font-weight:500;display:block;margin-bottom:4px}
.login-box input{background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px 12px;border-radius:6px;font-size:.95rem;width:100%}
.login-box input:focus{border-color:var(--accent)}
.login-toggle{text-align:center;margin-top:16px;font-size:.85rem;color:var(--text2)}
.login-toggle a{color:var(--accent);cursor:pointer;text-decoration:underline}
.user-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--bg3);border-radius:var(--radius);margin-bottom:16px;flex-wrap:wrap}
.user-bar .email{flex:1;font-size:.85rem;color:var(--text2);overflow:hidden;text-overflow:ellipsis}
.user-bar .team-name{font-family:'Oswald';font-size:1rem;color:var(--accent)}
.role-badge{padding:3px 10px;border-radius:20px;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.role-superadmin{background:rgba(124,77,255,.2);color:#b388ff;border:1px solid #7c4dff}
.role-admin{background:rgba(0,229,255,.15);color:var(--accent);border:1px solid var(--accent)}
.role-viewer{background:rgba(152,152,176,.15);color:var(--text2);border:1px solid var(--text3)}
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.8);z-index:10000;display:flex;align-items:center;justify-content:center;padding:20px}
.modal-box{background:var(--bg2);border:2px solid var(--accent);border-radius:var(--radius);padding:24px;max-width:500px;width:100%;max-height:90vh;overflow-y:auto}
.modal-box h3{font-family:'Oswald';color:var(--accent);margin-bottom:20px;font-size:1.3rem}
.error-msg{background:rgba(255,23,68,.1);border:1px solid var(--red);color:var(--red);padding:12px;border-radius:var(--radius);margin-bottom:16px;font-size:.9rem}
.success-msg{background:rgba(0,230,118,.1);border:1px solid var(--green);color:var(--green);padding:12px;border-radius:var(--radius);margin-bottom:16px;font-size:.9rem}
.loading{text-align:center;padding:60px;color:var(--text3)}
.spinner{display:inline-block;width:40px;height:40px;border:3px solid var(--bg4);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="logo">DARTPRO<span>Team & Kasse</span></div>
  </div>

  <!-- Login Screen -->
  <div id="login-screen">
    <div class="login-wrap">
      <div class="login-box">
        <h2 id="login-title">Anmelden</h2>
        <div id="login-msg"></div>
        <div class="form-group">
          <label>E-Mail</label>
          <input type="email" id="login-email" placeholder="deine@email.de">
        </div>
        <div class="form-group">
          <label>Passwort</label>
          <input type="password" id="login-password" placeholder="Mind. 6 Zeichen">
        </div>
        <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="handleLoginSubmit()">Einloggen</button>
        <div class="login-toggle">
          Noch kein Konto? <a onclick="toggleLoginMode()">Registrieren</a>
        </div>
      </div>
    </div>
  </div>

  <!-- Main App Screen -->
  <div id="screen-members" class="screen">
    <!-- Wird durch JavaScript gefüllt -->
  </div>
</div>

<script>
/* ============================================================
   SUPABASE CONFIG
   ============================================================ */
const SUPABASE_URL = 'https://tywnbjvpspvtdpyuefas.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InR5d25ianZwc3B2dGRweXVlZmFzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODI4MTQxMDUsImV4cCI6MjA5ODM5MDEwNX0.tg9OUzoxFhGVszAPHqKEIlm_zf66Dqn3smznCLDfIxA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============================================================
   APP STATE
   ============================================================ */
const APP = {
  user: null,
  profile: null,
  team: null,
  members: [],
  paidMonths: [],
  penalties: [],
  otherIncome: [],
  otherExpenses: [],
};

let loginMode = 'login';
let currentMemberTab = 'tab-kader';

/* ============================================================
   UTILITY
   ============================================================ */
function esc(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
}

function formatDate(dateStr) {
  if (!dateStr) return '-';
  const d = new Date(dateStr);
  return d.toLocaleDateString('de-DE', { day: '2-digit', month: '2-digit', year: 'numeric' });
}

function showMsg(type, text) {
  const el = document.getElementById('login-msg');
  if (!el) return;
  el.innerHTML = `<div class="${type === 'error' ? 'error-msg' : 'success-msg'}">${esc(text)}</div>`;
  setTimeout(() => { if (el) el.innerHTML = ''; }, 4000);
}

/* ============================================================
   AUTH
   ============================================================ */
async function doLogin(email, password) {
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { showMsg('error', 'Login fehlgeschlagen: ' + error.message); return; }
  APP.user = data.user;
  await loadProfile();
}

async function doSignup(email, password) {
  const { data, error } = await sb.auth.signUp({ email, password });
  if (error) { showMsg('error', 'Registrierung fehlgeschlagen: ' + error.message); return; }
  if (data.user && !data.session) {
    showMsg('success', 'Registrierung erfolgreich! Bitte bestätige deine E-Mail und logge dich dann ein.');
    loginMode = 'login';
    renderLogin();
    return;
  }
  APP.user = data.user;
  await loadProfile();
}

async function doLogout() {
  await sb.auth.signOut();
  APP.user = null;
  APP.profile = null;
  APP.team = null;
  document.getElementById('login-screen').style.display = '';
  document.getElementById('screen-members').classList.remove('active');
  loginMode = 'login';
  renderLogin();
}

async function loadProfile() {
  if (!APP.user) return;
  const { data, error } = await sb.from('profiles').select('*, teams(*)').eq('id', APP.user.id).single();
  if (error || !data) {
    showMsg('error', 'Profil nicht gefunden. Bitte kontaktiere den Superadmin.');
    return;
  }
  APP.profile = data;
  APP.team = data.teams;
  
  if (!APP.team) {
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('screen-members').classList.add('active');
    renderNoTeam();
    return;
  }
  
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('screen-members').classList.add('active');
  await loadTeamData();
  renderMembers();
}

function renderLogin() {
  document.getElementById('login-screen').style.display = '';
  document.getElementById('screen-members').classList.remove('active');
  document.getElementById('login-title').textContent = loginMode === 'login' ? 'Anmelden' : 'Registrieren';
  const btn = document.querySelector('#login-screen .btn-primary');
  if (btn) btn.textContent = loginMode === 'login' ? 'Einloggen' : 'Konto erstellen';
}

function toggleLoginMode() {
  loginMode = loginMode === 'login' ? 'signup' : 'login';
  renderLogin();
}

async function handleLoginSubmit() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  if (!email || !password) { showMsg('error', 'Bitte E-Mail und Passwort eingeben.'); return; }
  if (password.length < 6) { showMsg('error', 'Passwort muss mindestens 6 Zeichen haben.'); return; }
  if (loginMode === 'login') {
    await doLogin(email, password);
  } else {
    await doSignup(email, password);
  }
}

function renderNoTeam() {
  const el = document.getElementById('screen-members');
  el.innerHTML = `
    ${renderUserBar()}
    <div class="card" style="text-align:center;padding:60px 24px">
      <div style="font-size:3rem;margin-bottom:16px">&#128274;</div>
      <h3 style="font-family:'Oswald';font-size:1.4rem;margin-bottom:12px;color:var(--accent)">Kein Team zugewiesen</h3>
      <p style="color:var(--text2);max-width:400px;margin:0 auto">
        Dein Account (${esc(APP.profile.email)}) hat noch kein Team zugewiesen. Bitte kontaktiere den Superadmin.
      </p>
    </div>
  `;
}

function renderUserBar() {
  const roleClass = 'role-' + (APP.profile?.role || 'viewer');
  const roleLabel = APP.profile?.role === 'superadmin' ? 'Superadmin' : APP.profile?.role === 'admin' ? 'Admin' : 'Viewer';
  return `
    <div class="user-bar">
      <span class="role-badge ${roleClass}">${roleLabel}</span>
      <span class="team-name">${esc(APP.team?.name || 'Kein Team')}</span>
      <span class="email">${esc(APP.profile?.email || '')}</span>
      <button class="btn btn-ghost btn-sm" onclick="doLogout()">Abmelden</button>
    </div>
  `;
}

/* ============================================================
   DATA LOADING
   ============================================================ */
async function loadTeamData() {
  if (!APP.team) return;
  const teamId = APP.team.id;
  
  const [membersRes, pmRes, penRes, incRes, expRes] = await Promise.all([
    sb.from('members').select('*').eq('team_id', teamId).order('name'),
    sb.from('paid_months').select('*'),
    sb.from('penalties').select('*').order('date', { ascending: false }),
    sb.from('other_income').select('*').eq('team_id', teamId).order('date', { ascending: false }),
    sb.from('other_expenses').select('*').eq('team_id', teamId).order('date', { ascending: false }),
  ]);
  
  APP.members = membersRes.data || [];
  APP.paidMonths = pmRes.data || [];
  APP.penalties = penRes.data || [];
  APP.otherIncome = incRes.data || [];
  APP.otherExpenses = expRes.data || [];
}

/* ============================================================
   RENDER - Original UI mit Supabase Daten
   ============================================================ */
function getMemberPaidMonths(memberId) {
  return APP.paidMonths.filter(pm => pm.member_id === memberId);
}

function getMemberPenalties(memberId) {
  return APP.penalties.filter(p => p.member_id === memberId);
}

function renderMembersList() {
  const FELGE_COST = parseFloat(APP.team.felge_cost);
  const MONTHLY_FEE = parseFloat(APP.team.monthly_fee);
  const months = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
  const isAdmin = APP.profile.role === 'admin' || APP.profile.role === 'superadmin';
  
  let html = '<div style="display:grid;gap:12px">';
  
  APP.members.forEach(m => {
    const mPenalties = getMemberPenalties(m.id);
    const mPaidMonths = getMemberPaidMonths(m.id);
    const penaltyTotal = mPenalties.reduce((s, p) => s + parseFloat(p.amount), 0);
    const paidMonthsCount = mPaidMonths.length;
    
    let monthButtons = months.map((month, idx) => {
      const isPaid = mPaidMonths.some(pm => pm.month_index === idx);
      const clickable = isAdmin ? `onclick="togglePaidMonth(${m.id}, ${idx})"` : '';
      return `<button class="btn btn-sm" ${clickable} style="min-width:48px;padding:4px 8px;font-size:.75rem;${isPaid ? 'background:var(--green);color:#000' : 'background:var(--bg);color:var(--text2);border:1px solid var(--bg4)'};${!isAdmin?'cursor:default':''}">${month}</button>`;
    }).join('');
    
    let penaltiesHtml = '';
    if (mPenalties.length > 0) {
      penaltiesHtml = `<div style="display:grid;gap:4px;margin-bottom:8px">`;
      mPenalties.forEach((p, idx) => {
        penaltiesHtml += `
          <div style="background:var(--bg);padding:8px;border-radius:4px;display:flex;justify-content:space-between;align-items:center;font-size:.82rem">
            <span>${esc(p.type)} - ${formatDate(p.date)}</span>
            <div style="display:flex;align-items:center;gap:8px">
              <span style="color:var(--accent2);font-weight:600">${parseFloat(p.amount).toFixed(2)} €</span>
              ${isAdmin ? `<button class="edit-btn" style="color:var(--red);padding:2px 6px;font-size:.75rem" onclick="deletePenalty(${p.id})">&#128465;</button>` : ''}
            </div>
          </div>
        `;
      });
      penaltiesHtml += `</div>`;
    } else {
      penaltiesHtml = '<div style="font-size:.82rem;color:var(--text3);margin-bottom:8px">Keine Strafen</div>';
    }
    
    html += `
    <div style="background:var(--bg3);border:1px solid var(--bg4);border-radius:var(--radius);padding:16px">
      <div style="display:flex;justify-content:space-between;align-items:start;margin-bottom:12px">
        <div>
          <div style="font-family:'Oswald';font-size:1.2rem;font-weight:600">${esc(m.name)}</div>
          <div style="font-size:.82rem;color:var(--text2);margin-top:4px">
            ${m.birthday ? 'Geburtstag: ' + formatDate(m.birthday) : ''} 
            ${m.jersey_size ? '| Trikot: ' + m.jersey_size : ''}
            | Felgen: <span style="color:var(--accent2)">${m.felge_count || 0}</span> (${((m.felge_count || 0) * FELGE_COST).toFixed(2)} €)
          </div>
        </div>
        ${isAdmin ? `<div style="display:flex;gap:4px">
          <button class="edit-btn" onclick="editMember(${m.id})">&#9998;</button>
          <button class="edit-btn" style="color:var(--red)" onclick="deleteMember(${m.id})">&#128465;</button>
        </div>` : ''}
      </div>
      <div style="margin-bottom:12px">
        <div style="font-size:.75rem;color:var(--text2);margin-bottom:6px">Monatsbeiträge (${paidMonthsCount}/${MONTHLY_FEE.toFixed(2)} € pro Monat):</div>
        <div style="display:flex;flex-wrap:wrap;gap:4px">${monthButtons}</div>
        <div style="font-size:.82rem;color:var(--green);margin-top:6px;font-weight:600">Gesamt: ${(paidMonthsCount * MONTHLY_FEE).toFixed(2)} €</div>
      </div>
      <div>
        <div style="font-size:.75rem;color:var(--text2);margin-bottom:6px">Strafen: <span style="color:var(--accent2);font-weight:600">${mPenalties.length}</span> (${penaltyTotal.toFixed(2)} €)</div>
        ${penaltiesHtml}
        ${isAdmin ? `<button class="edit-btn btn-sm" onclick="addPenalty(${m.id})">+ Strafe hinzufügen</button>` : ''}
      </div>
    </div>
    `;
  });
  
  html += '</div>';
  return html;
}

function renderBirthdaysView() {
  if (APP.members.length === 0) {
    return '<div class="card"><p style="color:var(--text3);text-align:center;padding:40px">Noch keine Mitglieder vorhanden</p></div>';
  }
  
  const membersWithBirthdays = APP.members.filter(m => m.birthday).map(m => {
    const birthDate = new Date(m.birthday);
    const today = new Date();
    today.setHours(0, 0, 0, 0);
    const nextBirthday = new Date(today.getFullYear(), birthDate.getMonth(), birthDate.getDate());
    if (nextBirthday < today) nextBirthday.setFullYear(nextBirthday.getFullYear() + 1);
    const diffTime = nextBirthday - today;
    const daysUntil = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    return { ...m, daysUntilBirthday: daysUntil, nextBirthday };
  });
  
  if (membersWithBirthdays.length === 0) {
    return '<div class="card"><p style="color:var(--text3);text-align:center;padding:40px">Keine Geburtstage eingetragen</p></div>';
  }
  
  membersWithBirthdays.sort((a, b) => a.daysUntilBirthday - b.daysUntilBirthday);
  
  let html = '<div class="card"><div class="card-title"><div class="icon">&#127874;</div> Geburtstage</div>';
  
  membersWithBirthdays.forEach((m, idx) => {
    const isToday = m.daysUntilBirthday === 0;
    const isNextWeek = m.daysUntilBirthday <= 7;
    const birthDate = new Date(m.birthday);
    const age = new Date().getFullYear() - birthDate.getFullYear();
    
    let badgeColor = 'var(--red)';
    let badgeBg = 'rgba(255,23,68,.15)';
    let badgeText = `in ${m.daysUntilBirthday} Tagen`;
    
    if (isToday) {
      badgeColor = 'var(--green)';
      badgeBg = 'rgba(0,230,118,.2)';
      badgeText = '&#127881; HEUTE!';
    } else if (isNextWeek) {
      badgeColor = 'var(--accent3)';
      badgeBg = 'rgba(255,170,0,.15)';
      badgeText = `in ${m.daysUntilBirthday} ${m.daysUntilBirthday === 1 ? 'Tag' : 'Tagen'}`;
    }
    
    html += `
      <div style="background:var(--bg3);border:${isToday ? '2px' : '1px'} solid ${isToday ? 'var(--green)' : (isNextWeek ? 'var(--accent3)' : 'var(--bg4)')};border-radius:var(--radius);padding:16px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;${idx === 0 && !isToday ? 'border-color:var(--red);border-width:2px;background:rgba(255,23,68,.05)' : ''}">
        <div style="display:flex;align-items:center;gap:16px">
          ${idx === 0 && !isToday ? '<div style="font-size:1.5rem">&#128293;</div>' : ''}
          <div>
            <div style="font-family:'Oswald';font-size:1.2rem;font-weight:600;${idx === 0 ? 'color:var(--red)' : ''}">${esc(m.name)}</div>
            <div style="font-size:.85rem;color:var(--text2);margin-top:4px">${formatDate(m.birthday)} ${!isNaN(age) ? `(${age} Jahre)` : ''}</div>
          </div>
        </div>
        <div style="text-align:right">
          <div style="font-family:'Oswald';font-size:1.6rem;font-weight:700;color:${badgeColor};padding:4px 12px;background:${badgeBg};border-radius:var(--radius)">${badgeText}</div>
        </div>
      </div>
    `;
  });
  
  html += '</div>';
  return html;
}

function renderMembers() {
  const el = document.getElementById('screen-members');
  const FELGE_COST = parseFloat(APP.team.felge_cost);
  const MONTHLY_FEE = parseFloat(APP.team.monthly_fee);
  const isAdmin = APP.profile.role === 'admin' || APP.profile.role === 'superadmin';
  
  const totalFelgeMoney = APP.members.reduce((sum, m) => sum + (m.felge_count || 0) * FELGE_COST, 0);
  const totalMonthlyFees = APP.paidMonths.length * MONTHLY_FEE;
  const totalPenalties = APP.penalties.reduce((sum, p) => sum + parseFloat(p.amount), 0);
  const totalOtherIncome = APP.otherIncome.reduce((sum, i) => sum + parseFloat(i.amount), 0);
  const totalOtherExpenses = APP.otherExpenses.reduce((sum, e) => sum + parseFloat(e.amount), 0);
  const totalCash = totalFelgeMoney + totalMonthlyFees + totalPenalties + totalOtherIncome - totalOtherExpenses;
  
  let membersHtml = APP.members.length === 0 ? 
    '<p style="color:var(--text3);text-align:center;padding:40px;font-size:.9rem">Noch keine Mitglieder hinzugefügt</p>' :
    renderMembersList();
  
  let incomeHtml = APP.otherIncome.length === 0 ?
    '<p style="color:var(--text3);text-align:center;padding:20px;font-size:.85rem">Keine sonstigen Einnahmen</p>' :
    `<table style="width:100%;border-collapse:collapse;margin-top:12px">
      <thead><tr style="background:var(--bg3)"><th style="padding:10px;text-align:left;font-size:.75rem;color:var(--text2)">Beschreibung</th><th style="padding:10px;text-align:left;font-size:.75rem;color:var(--text2)">Betrag</th><th style="padding:10px;text-align:left;font-size:.75rem;color:var(--text2)">Datum</th>${isAdmin?'<th></th>':''}</tr></thead>
      <tbody>
        ${APP.otherIncome.map(i => `
          <tr style="border-bottom:1px solid var(--bg4)">
            <td style="padding:12px">${esc(i.description)}</td>
            <td style="padding:12px;color:var(--green);font-weight:600">+${parseFloat(i.amount).toFixed(2)} €</td>
            <td style="padding:12px">${formatDate(i.date)}</td>
            ${isAdmin ? `<td style="padding:12px;text-align:right"><button class="edit-btn" style="color:var(--red)" onclick="deleteIncome(${i.id})">&#128465;</button></td>` : ''}
          </tr>
        `).join('')}
      </tbody>
    </table>`;
  
  let expensesHtml = APP.otherExpenses.length === 0 ?
    '<p style="color:var(--text3);text-align:center;padding:20px;font-size:.85rem">Keine Ausgaben erfasst</p>' :
    `<table style="width:100%;border-collapse:collapse;margin-top:12px">
      <thead><tr style="background:var(--bg3)"><th style="padding:10px;text-align:left;font-size:.75rem;color:var(--text2)">Beschreibung</th><th style="padding:10px;text-align:left;font-size:.75rem;color:var(--text2)">Betrag</th><th style="padding:10px;text-align:left;font-size:.75rem;color:var(--text2)">Datum</th>${isAdmin?'<th></th>':''}</tr></thead>
      <tbody>
        ${APP.otherExpenses.map(e => `
          <tr style="border-bottom:1px solid var(--bg4)">
            <td style="padding:12px">${esc(e.description)}</td>
            <td style="padding:12px;color:var(--red);font-weight:600">-${parseFloat(e.amount).toFixed(2)} €</td>
            <td style="padding:12px">${formatDate(e.date)}</td>
            ${isAdmin ? `<td style="padding:12px;text-align:right"><button class="edit-btn" style="color:var(--red)" onclick="deleteExpense(${e.id})">&#128465;</button></td>` : ''}
          </tr>
        `).join('')}
      </tbody>
    </table>`;
  
  el.innerHTML = `
    ${renderUserBar()}
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <h2 style="font-size:1.8rem">&#128101; ${esc(APP.team.name)}</h2>
      ${isAdmin ? `<button class="btn btn-ghost" style="padding:12px 18px;font-size:1rem;display:flex;align-items:center;gap:8px" onclick="openSettings()">
        <span style="font-size:1.4rem">&#9881;</span>
      </button>` : ''}
    </div>
    
    <div class="member-stats">
      <div class="stat-card"><div class="stat-label">Mitglieder</div><div class="stat-value">${APP.members.length}</div></div>
      <div class="stat-card"><div class="stat-label">Felgengeld</div><div class="stat-value">${totalFelgeMoney.toFixed(2)} €</div><div style="font-size:.75rem;color:var(--text3);margin-top:4px">${APP.members.reduce((sum, m) => sum + (m.felge_count || 0), 0)} Felgen x ${FELGE_COST.toFixed(2)} €</div></div>
      <div class="stat-card"><div class="stat-label">Monatsbeiträge</div><div class="stat-value">${totalMonthlyFees.toFixed(2)} €</div><div style="font-size:.75rem;color:var(--text3);margin-top:4px">${APP.paidMonths.length} x ${MONTHLY_FEE.toFixed(2)} €</div></div>
      <div class="stat-card"><div class="stat-label">Strafen</div><div class="stat-value">${totalPenalties.toFixed(2)} €</div></div>
      <div class="stat-card"><div class="stat-label">Sonstige Einnahmen</div><div class="stat-value">${totalOtherIncome.toFixed(2)} €</div></div>
      <div class="stat-card"><div class="stat-label">Ausgaben</div><div class="stat-value" style="color:var(--red)">${totalOtherExpenses.toFixed(2)} €</div></div>
      <div class="stat-card highlight"><div class="stat-label">Gesamtkasse</div><div class="stat-value">${totalCash.toFixed(2)} €</div></div>
    </div>
    
    <div class="tabs">
      <button class="tab ${currentMemberTab === 'tab-kader' ? 'active' : ''}" onclick="switchMemberTab('tab-kader')">Kader</button>
      <button class="tab ${currentMemberTab === 'tab-birthdays' ? 'active' : ''}" onclick="switchMemberTab('tab-birthdays')">&#127874; Geburtstage</button>
    </div>
    
    <div id="tab-kader" style="display:${currentMemberTab === 'tab-kader' ? '' : 'none'}">
      ${isAdmin ? `<div class="card">
        <div class="card-title"><div class="icon">&#128100;</div> Mitglied hinzufügen</div>
        <div class="form-row">
          <div class="form-group" style="flex:2"><label>Name</label><input type="text" id="member-name" placeholder="Vollständiger Name"></div>
          <div class="form-group"><label>Geburtstag</label><input type="date" id="member-birthday"></div>
          <div class="form-group"><label>Trikotgröße</label><select id="member-jersey"><option value="">-</option><option value="XS">XS</option><option value="S">S</option><option value="M">M</option><option value="L">L</option><option value="XL">XL</option><option value="XXL">XXL</option><option value="XXXL">XXXL</option></select></div>
          <div class="form-group"><label>Felgen</label><input type="number" id="member-felge" value="0" min="0" step="1"></div>
          <div class="form-group" style="flex:0;min-width:auto"><label>&nbsp;</label><button class="btn btn-primary" onclick="addMember()">+ Hinzufügen</button></div>
        </div>
      </div>` : ''}
      <div class="card"><div class="card-title"><div class="icon">&#128101;</div> Mitgliederliste</div>${membersHtml}</div>
      ${isAdmin ? `<div class="card">
        <div class="card-title"><div class="icon">&#128176;</div> Sonstige Einnahmen</div>
        <div class="form-row">
          <div class="form-group" style="flex:2"><label>Beschreibung</label><input type="text" id="income-desc" placeholder="z.B. Spende, Verkauf, etc."></div>
          <div class="form-group"><label>Betrag (€)</label><input type="number" id="income-amount" placeholder="0.00" min="0" step="0.01"></div>
          <div class="form-group"><label>Datum</label><input type="date" id="income-date"></div>
          <div class="form-group" style="flex:0;min-width:auto"><label>&nbsp;</label><button class="btn btn-success" onclick="addIncome()">+ Einnahme</button></div>
        </div>
        ${incomeHtml}
      </div>
      <div class="card">
        <div class="card-title"><div class="icon">&#128184;</div> Ausgaben</div>
        <div class="form-row">
          <div class="form-group" style="flex:2"><label>Beschreibung</label><input type="text" id="expense-desc" placeholder="z.B. Dartpfeile, Miete, Verpflegung, etc."></div>
          <div class="form-group"><label>Betrag (€)</label><input type="number" id="expense-amount" placeholder="0.00" min="0" step="0.01"></div>
          <div class="form-group"><label>Datum</label><input type="date" id="expense-date"></div>
          <div class="form-group" style="flex:0;min-width:auto"><label>&nbsp;</label><button class="btn btn-danger" onclick="addExpense()">+ Ausgabe</button></div>
        </div>
        ${expensesHtml}
      </div>` : ''}
    </div>
    
    <div id="tab-birthdays" style="display:${currentMemberTab === 'tab-birthdays' ? '' : 'none'}">${renderBirthdaysView()}</div>
  `;
  
  const incomeDate = document.getElementById('income-date');
  if (incomeDate) incomeDate.valueAsDate = new Date();
  const expenseDate = document.getElementById('expense-date');
  if (expenseDate) expenseDate.valueAsDate = new Date();
}

function switchMemberTab(tabId) {
  currentMemberTab = tabId;
  ['tab-kader','tab-birthdays'].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.style.display = id === tabId ? '' : 'none';
  });
  document.querySelectorAll('.tabs .tab').forEach(t => t.classList.remove('active'));
  const activeTab = document.querySelector(`.tabs .tab[onclick*="${tabId}"]`);
  if (activeTab) activeTab.classList.add('active');
}

/* ============================================================
   DATA MUTATIONS (Supabase)
   ============================================================ */
async function deleteMember(id) {
  if (!confirm('Mitglied wirklich löschen? Alle Daten gehen verloren.')) return;
  const { error } = await sb.from('members').delete().eq('id', id);
  if (error) { alert('Fehler: ' + error.message); return; }
  await loadTeamData();
  renderMembers();
}

async function togglePaidMonth(memberId, monthIdx) {
  const existing = APP.paidMonths.find(pm => pm.member_id === memberId && pm.month_index === monthIdx);
  if (existing) {
    await sb.from('paid_months').delete().eq('id', existing.id);
  } else {
    await sb.from('paid_months').insert({ member_id: memberId, month_index: monthIdx });
  }
  await loadTeamData();
  renderMembers();
}

function addPenalty(memberId) {
  const modal = document.createElement('div');
  modal.id = 'penalty-modal';
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal-box" style="border-color:var(--accent2)">
      <h3 style="color:var(--accent2)">Strafe hinzufügen</h3>
      <div style="margin-bottom:12px"><label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Grund</label><input type="text" id="penalty-type" placeholder="z.B. Zu spät, Vergessen, etc." style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px"></div>
      <div style="margin-bottom:12px"><label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Betrag (€)</label><input type="number" id="penalty-amount" value="5" min="0" step="0.50" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px"></div>
      <div style="margin-bottom:20px"><label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Datum</label><input type="date" id="penalty-date" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px"></div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="document.getElementById('penalty-modal').remove()">Abbrechen</button>
        <button class="btn btn-danger" onclick="savePenalty(${memberId})">Speichern</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
  document.getElementById('penalty-date').valueAsDate = new Date();
}

async function savePenalty(memberId) {
  const type = document.getElementById('penalty-type').value.trim();
  const amount = parseFloat(document.getElementById('penalty-amount').value);
  const date = document.getElementById('penalty-date').value;
  
  if (!type || isNaN(amount) || amount <= 0 || !date) {
    alert('Bitte alle Felder korrekt ausfüllen');
    return;
  }
  
  const { error } = await sb.from('penalties').insert({ member_id: memberId, type, amount, date });
  if (error) { alert('Fehler: ' + error.message); return; }
  document.getElementById('penalty-modal').remove();
  await loadTeamData();
  renderMembers();
}

async function deletePenalty(penaltyId) {
  if (!confirm('Diese Strafe wirklich löschen?')) return;
  await sb.from('penalties').delete().eq('id', penaltyId);
  await loadTeamData();
  renderMembers();
}

function editMember(id) {
  const member = APP.members.find(m => m.id === id);
  if (!member) return;
  
  const modal = document.createElement('div');
  modal.id = 'edit-modal';
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal-box">
      <h3>Mitglied bearbeiten</h3>
      <div style="margin-bottom:12px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Name</label>
        <input type="text" id="edit-member-name" value="${esc(member.name)}" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px">
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Geburtstag</label>
        <input type="date" id="edit-member-birthday" value="${member.birthday || ''}" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px">
      </div>
      <div style="margin-bottom:12px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Trikotgröße</label>
        <select id="edit-member-jersey" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px">
          <option value="">-</option>
          <option value="XS" ${member.jersey_size === 'XS' ? 'selected' : ''}>XS</option>
          <option value="S" ${member.jersey_size === 'S' ? 'selected' : ''}>S</option>
          <option value="M" ${member.jersey_size === 'M' ? 'selected' : ''}>M</option>
          <option value="L" ${member.jersey_size === 'L' ? 'selected' : ''}>L</option>
          <option value="XL" ${member.jersey_size === 'XL' ? 'selected' : ''}>XL</option>
          <option value="XXL" ${member.jersey_size === 'XXL' ? 'selected' : ''}>XXL</option>
          <option value="XXXL" ${member.jersey_size === 'XXXL' ? 'selected' : ''}>XXXL</option>
        </select>
      </div>
      <div style="margin-bottom:20px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Felgen</label>
        <input type="number" id="edit-member-felge" value="${member.felge_count || 0}" min="0" step="1" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px">
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="document.getElementById('edit-modal').remove()">Abbrechen</button>
        <button class="btn btn-primary" onclick="saveMember(${id})">Speichern</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

async function saveMember(id) {
  const newName = document.getElementById('edit-member-name').value.trim();
  const newBirthday = document.getElementById('edit-member-birthday').value;
  const newJersey = document.getElementById('edit-member-jersey').value;
  const newFelgeCount = parseInt(document.getElementById('edit-member-felge').value) || 0;
  
  if (!newName) { alert('Name darf nicht leer sein'); return; }
  
  const { error } = await sb.from('members').update({
    name: newName,
    birthday: newBirthday || null,
    jersey_size: newJersey || null,
    felge_count: newFelgeCount
  }).eq('id', id);
  
  if (error) { alert('Fehler: ' + error.message); return; }
  document.getElementById('edit-modal').remove();
  await loadTeamData();
  renderMembers();
}

function openSettings() {
  const modal = document.createElement('div');
  modal.id = 'settings-modal';
  modal.className = 'modal-overlay';
  modal.innerHTML = `
    <div class="modal-box">
      <h3>Einstellungen</h3>
      <div style="margin-bottom:16px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Felgen-Preis pro Stück (€)</label>
        <input type="number" id="settings-felge-cost" value="${parseFloat(APP.team.felge_cost).toFixed(2)}" step="0.01" min="0" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px;font-size:1rem">
      </div>
      <div style="margin-bottom:20px">
        <label style="font-size:.85rem;color:var(--text2);display:block;margin-bottom:6px">Monatsbeitrag pro Mitglied (€)</label>
        <input type="number" id="settings-monthly-fee" value="${parseFloat(APP.team.monthly_fee).toFixed(2)}" step="0.01" min="0" style="width:100%;background:var(--bg3);border:1px solid var(--bg4);color:var(--text);padding:10px;border-radius:6px;font-size:1rem">
      </div>
      <div style="display:flex;gap:10px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="document.getElementById('settings-modal').remove()">Abbrechen</button>
        <button class="btn btn-primary" onclick="saveSettings()">Speichern</button>
      </div>
    </div>
  `;
  document.body.appendChild(modal);
}

async function saveSettings() {
  const newFelgeCost = parseFloat(document.getElementById('settings-felge-cost').value);
  const newMonthlyFee = parseFloat(document.getElementById('settings-monthly-fee').value);
  
  const { error } = await sb.from('teams').update({
    felge_cost: newFelgeCost,
    monthly_fee: newMonthlyFee
  }).eq('id', APP.team.id);
  
  if (error) { alert('Fehler: ' + error.message); return; }
  document.getElementById('settings-modal').remove();
  APP.team.felge_cost = newFelgeCost;
  APP.team.monthly_fee = newMonthlyFee;
  renderMembers();
}

async function addMember() {
  const name = document.getElementById('member-name').value.trim();
  const birthday = document.getElementById('member-birthday').value;
  const jerseySize = document.getElementById('member-jersey').value;
  const felgeCount = parseInt(document.getElementById('member-felge').value) || 0;
  
  if (!name) { alert('Bitte Name eingeben'); return; }
  
  const { error } = await sb.from('members').insert({
    team_id: APP.team.id,
    name,
    birthday: birthday || null,
    jersey_size: jerseySize || null,
    felge_count: felgeCount
  });
  
  if (error) { alert('Fehler: ' + error.message); return; }
  await loadTeamData();
  renderMembers();
}

async function addIncome() {
  const description = document.getElementById('income-desc').value.trim();
  const amount = parseFloat(document.getElementById('income-amount').value);
  const date = document.getElementById('income-date').value;
  
  if (!description || isNaN(amount) || amount <= 0 || !date) {
    alert('Bitte alle Felder korrekt ausfüllen');
    return;
  }
  
  const { error } = await sb.from('other_income').insert({
    team_id: APP.team.id,
    description,
    amount,
    date
  });
  
  if (error) { alert('Fehler: ' + error.message); return; }
  await loadTeamData();
  renderMembers();
}

async function deleteIncome(id) {
  if (!confirm('Diese Einnahme wirklich löschen?')) return;
  await sb.from('other_income').delete().eq('id', id);
  await loadTeamData();
  renderMembers();
}

async function addExpense() {
  const description = document.getElementById('expense-desc').value.trim();
  const amount = parseFloat(document.getElementById('expense-amount').value);
  const date = document.getElementById('expense-date').value;
  
  if (!description || isNaN(amount) || amount <= 0 || !date) {
    alert('Bitte alle Felder korrekt ausfüllen');
    return;
  }
  
  const { error } = await sb.from('other_expenses').insert({
    team_id: APP.team.id,
    description,
    amount,
    date
  });
  
  if (error) { alert('Fehler: ' + error.message); return; }
  await loadTeamData();
  renderMembers();
}

async function deleteExpense(id) {
  if (!confirm('Diese Ausgabe wirklich löschen?')) return;
  await sb.from('other_expenses').delete().eq('id', id);
  await loadTeamData();
  renderMembers();
}

/* ============================================================
   INIT
   ============================================================ */
window.handleLoginSubmit = handleLoginSubmit;
window.toggleLoginMode = toggleLoginMode;
window.doLogout = doLogout;
window.deleteMember = deleteMember;
window.togglePaidMonth = togglePaidMonth;
window.addPenalty = addPenalty;
window.savePenalty = savePenalty;
window.deletePenalty = deletePenalty;
window.editMember = editMember;
window.saveMember = saveMember;
window.openSettings = openSettings;
window.saveSettings = saveSettings;
window.addMember = addMember;
window.addIncome = addIncome;
window.deleteIncome = deleteIncome;
window.addExpense = addExpense;
window.deleteExpense = deleteExpense;
window.switchMemberTab = switchMemberTab;

async function init() {
  const { data: { session } } = await sb.auth.getSession();
  if (session?.user) {
    APP.user = session.user;
    await loadProfile();
  } else {
    renderLogin();
  }
}

sb.auth.onAuthStateChange(async (event, session) => {
  if (event === 'SIGNED_IN' && session?.user) {
    APP.user = session.user;
    await loadProfile();
  } else if (event === 'SIGNED_OUT') {
    APP.user = null;
    APP.profile = null;
    APP.team = null;
    renderLogin();
  }
});

init();
</script>
</body>
</html>
